# VITALS - run the macOS collector on real Darwin.
#
# WHY THIS FILE EXISTS. Every macOS line in this project was written from documented tool output by
# someone who does not own a Mac. The simulated suite proves the collector's LOGIC given assumed
# input; it cannot prove macOS actually emits what was assumed. That gap was declared in the
# capability manifest rather than hidden, and this workflow is how it closes.
#
# GitHub's macOS runners are real Apple Silicon machines with passwordless sudo, free for public
# repositories. That makes this a better verification regime than owning one Mac: it re-proves the
# port on every push, on two macOS versions at once, and banks fresh real fixtures each run.
#
# WHAT A FAILURE HERE MEANS. On the first runs, failures are the POINT - each one is a real finding
# about a command whose output we guessed wrong. Steps therefore run to completion rather than
# stopping at the first failure, so one run yields every finding instead of the first one.
#
# WHAT THIS CANNOT SEE. Runners are virtual machines: no battery, a paravirtual GPU, no real
# thermals. Those paths get their fixtures from a human's Mac via tools/capture-macos-fixtures.sh.
# A green run here is not permission to flip a capability flag that only a populated sensor proves.

name: vitals · macOS

on:
  push:
    paths: ['vitals/**', '.github/workflows/vitals-macos.yml']
  pull_request:
    paths: ['vitals/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: vitals

jobs:
  darwin:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one architecture failing must not hide the other's result
      matrix:
        os: [macos-14, macos-15]
        node: ['20']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: What machine is this
        run: |
          echo "arch:    $(uname -m)"
          echo "os:      $(sw_vers -productVersion)"
          echo "cpu:     $(sysctl -n machdep.cpu.brand_string)"
          echo "cores:   $(sysctl -n hw.ncpu)"
          echo "memory:  $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          echo "node:    $(node --version)"

      # Capture BEFORE testing. Even when the suites fail, the run has produced real Darwin output
      # for every command the collector uses - which is the artifact that lets the fix be written
      # against reality instead of against another assumption.
      - name: Capture real fixtures
        if: always()
        # NETQ=1: the networkQuality section costs bandwidth, which is fine on a runner and is the
        # fixture the future speed-test integration will be written against.
        run: NETQ=1 bash tools/capture-macos-fixtures.sh

      - name: Upload fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-fixtures-${{ matrix.os }}
          path: vitals/macos-fixtures.txt
          if-no-files-found: warn

      - name: Parser fixtures (logic only - passes on any platform)
        if: always()
        run: node collect/test-darwin.js

      - name: Full-collector simulation
        if: always()
        run: node collect/test-darwin-sim.js

      # THE ONE THAT MATTERS. Runs the real collector against the real system and cross-checks every
      # field against an independent authority - sysctl, df, vm_stat, ps - because a collector
      # agreeing with itself proves nothing.
      - name: LIVE collector on real Darwin
        if: always()
        run: node collect/test-darwin-live.js

      - name: Route guard + capability manifest
        if: always()
        run: node test-routes.js

      # The non-Windows action layer: validation, denial counting, osascript command construction,
      # and the growth walker against a real temporary tree - here that tree is on real Darwin.
      - name: Action layer + growth walker suite
        if: always()
        run: node test-actions-posix.js

      # The inspection layer (sockets-with-owners, startup scan) and the clipboard watcher's
      # dedupe/secret/row logic, from fixtures. Their LIVE halves run below against the bridge.
      - name: Inspection layer + clip watcher suite
        if: always()
        run: node test-inspect-posix.js

      - name: Self-check fold (stubs - passes anywhere, proves the arithmetic)
        if: always()
        run: node test-selfcheck.js

      - name: Storage substrate — histograms (A2)
        if: always()
        run: node test-hist.js

      - name: Storage substrate — rollups, both formats, compaction (A2)
        if: always()
        run: node test-history.js

      - name: Rewind — the engine at a past moment (B1)
        if: always()
        run: node test-replay.js

      - name: Workloads — per-program percentiles, job vs machine (B5/B6)
        if: always()
        run: node test-workload.js

      - name: Panel script parses (node --check cannot see inside HTML)
        if: always()
        run: node test-dashboard.js

      - name: Scheduling — collision-free jobs, boot trial (B8/B11)
        if: always()
        run: node test-schedule.js

      # THE EVIDENCE STEP for `self.verify` on darwin, which is flagged FALSE in collect/caps.js
      # despite the code being complete - because that file's rule is that a flag means observed
      # working, not implemented. All three comparisons are independent here (vm_stat vs
      # host_statistics64, iostat vs host_processor_info, collector uptime vs kern.boottime), so
      # unlike linux this run has all three legs. Flip the flag when this passes, and paste the run
      # URL beside it. Not before.
      - name: LIVE agreement record on real Darwin
        if: always()
        run: node selfcheck-live.js --samples 16

      # The walker against a real macOS home directory: proves it survives genuine permission
      # walls, firmlinks and .app bundles, and that the snapshot it writes is one History.growth
      # can read. This is the live half of what the suite above simulates.
      - name: Growth walker walks a real Darwin home
        if: always()
        run: |
          node growthscan.js --root "$HOME" --out /tmp/walk-live.json --min 1
          node -e '
            const s = require("/tmp/walk-live.json");
            let bad = 0;
            const need = { scanner: s.scanner === "walk-1", "sep is /": s.sep === "/",
                           "walked something": s.dirs > 0 && s.files > 0,
                           "total > 0": s.totalBytes > 0,
                           "entries present": Array.isArray(s.entries) && s.entries.length > 0,
                           "denied is a count, not a lie": Number.isInteger(s.denied) };
            for (const [k, v] of Object.entries(need)) {
              console.log((v ? "  ok   " : "  MISS ") + k);
              if (!v) bad++;
            }
            console.log(`  ${s.dirs} dirs, ${s.files} files, ${(s.totalBytes/2**30).toFixed(2)} GB, ${s.denied} denied`);
            process.exit(bad ? 1 : 0);
          '

      # Proves the bridge actually starts and serves measured telemetry on macOS, which no unit
      # test covers: process spawn, the collector's own child processes, and the HTTP surface.
      - name: Bridge boots and serves a real sample
        if: always()
        run: |
          VITALS_PORT=8790 node bridge.js &
          BRIDGE=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8790/api/caps >/dev/null && break
            sleep 0.5
          done
          echo "--- /api/caps ---"
          curl -sf http://127.0.0.1:8790/api/caps | head -c 900 || echo "caps did not answer"
          echo ""
          sleep 12
          echo "--- /api/latest ---"
          curl -sf http://127.0.0.1:8790/api/latest | head -c 900 || echo "latest did not answer"
          echo ""
          node -e '
            const http = require("http");
            http.get({host:"127.0.0.1",port:8790,path:"/api/latest"}, r => {
              let b=""; r.on("data",c=>b+=c); r.on("end",()=>{
                const l=JSON.parse(b); let bad=0;
                const need = {"cpu.total": l.cpu && l.cpu.total, "mem.usedMB": l.mem && l.mem.usedMB,
                              "disk.vols": l.disk && l.disk.vols && l.disk.vols.length,
                              "proc rows": l.proc && l.proc.length};
                for (const [k,v] of Object.entries(need)) {
                  const ok = v !== null && v !== undefined && v !== 0;
                  console.log((ok?"  ok   ":"  MISS ") + k + " = " + JSON.stringify(v));
                  if (!ok) bad++;
                }
                process.exit(bad ? 1 : 0);
              });
            }).on("error", e => { console.error("bridge unreachable: " + e.message); process.exit(1); });
          '
          # The ported inspection routes, against the SAME live bridge. These were 501s until
          # 2026-07-31; the checks below are what turns "route reachable" into a real finding
          # about whether netstat/launchctl on this macOS emit what inspect-posix.js assumed.
          echo "--- /api/conns (live) ---"
          curl -sf http://127.0.0.1:8790/api/conns | head -c 600 || echo "conns did not answer"
          echo ""
          node -e '
            const http = require("http");
            http.get({host:"127.0.0.1",port:8790,path:"/api/conns"}, r => {
              let b=""; r.on("data",c=>b+=c); r.on("end",()=>{
                const rows=JSON.parse(b); let bad=0;
                const need = {
                  "rows is an array": Array.isArray(rows),
                  // the bridge itself is LISTENING on 8790, so a correct parser cannot miss it
                  "sees the bridge listening on 8790": Array.isArray(rows) &&
                    rows.some(r => r.st==="Listen" && /:8790$/.test(r.l)),
                  "every row has l/st/pid": Array.isArray(rows) &&
                    rows.every(r => r.l && r.st && Number.isInteger(r.pid)),
                  "the bridge pid resolves to a name": Array.isArray(rows) &&
                    rows.some(r => /:8790$/.test(r.l) && r.pn),
                };
                for (const [k,v] of Object.entries(need)) { console.log((v?"  ok   ":"  MISS ")+k); if(!v) bad++; }
                process.exit(bad?1:0);
              });
            }).on("error", e => { console.error("conns unreachable: " + e.message); process.exit(1); });
          '
          echo "--- /api/startup (live) ---"
          node -e '
            const http = require("http");
            http.get({host:"127.0.0.1",port:8790,path:"/api/startup"}, r => {
              let b=""; r.on("data",c=>b+=c); r.on("end",()=>{
                const rows=JSON.parse(b); let bad=0;
                const need = {
                  "rows is an array": Array.isArray(rows),
                  // a Mac with EMPTY LaunchDaemons does not exist; empty here means the scan lied
                  "found at least one entry": Array.isArray(rows) && rows.length>0,
                  "rows carry kind/where/name/state": Array.isArray(rows) &&
                    rows.every(r => r.kind && r.where && r.name && r.state),
                  "kinds are the macOS vocabulary": Array.isArray(rows) &&
                    rows.every(r => ["agent","daemon","login"].includes(r.kind)),
                };
                for (const [k,v] of Object.entries(need)) { console.log((v?"  ok   ":"  MISS ")+k); if(!v) bad++; }
                if (Array.isArray(rows)) console.log(`  ${rows.length} entries, ` +
                  `${rows.filter(r=>r.suspect).length} suspect, ` +
                  `${rows.filter(r=>r.kind==="login").length} login items`);
                process.exit(bad?1:0);
              });
            }).on("error", e => { console.error("startup unreachable: " + e.message); process.exit(1); });
          '
          kill $BRIDGE 2>/dev/null || true

      # The clipboard watcher against the REAL pasteboard: pbcopy something after it starts and
      # the row must land in the jsonl with the right shape. If pbcopy cannot reach a pasteboard
      # in this session, that failure is itself the finding this step exists to surface.
      - name: Clipboard watcher logs a real copy
        if: always()
        run: |
          printf 'baseline-before-watching' | pbcopy
          node clipwatch-posix.js --out /tmp/clip-live.jsonl --poll 300 &
          WATCH=$!
          sleep 1.5
          printf 'the quick brown fox jumped over the vitals bridge' | pbcopy
          sleep 1.5
          kill $WATCH 2>/dev/null || true
          echo "--- rows ---"; cat /tmp/clip-live.jsonl 2>/dev/null || echo "(no file)"
          node -e '
            const fs = require("fs");
            let rows = [];
            try { rows = fs.readFileSync("/tmp/clip-live.jsonl","utf8").trim().split("\n").filter(Boolean).map(JSON.parse); }
            catch (e) { console.error("no rows were written: " + e.message); process.exit(1); }
            let bad = 0;
            const r = rows[rows.length-1] || {};
            const need = {
              "exactly one row (baseline copy NOT logged)": rows.length === 1,
              "kind is text": r.kind === "text",
              "the copied text was captured": /quick brown fox/.test(r.text || ""),
              "not flagged secret": r.secret === false,
              "sha present (12 hex)": /^[0-9A-F]{12}$/.test(r.sha || ""),
            };
            for (const [k,v] of Object.entries(need)) { console.log((v?"  ok   ":"  MISS ")+k); if(!v) bad++; }
            process.exit(bad ? 1 : 0);
          '

      - name: Sudo is available (the elevated paths are testable here)
        if: always()
        # Block scalar, not a plain one: the colons inside the echo strings would otherwise be
        # parsed as YAML mappings - the exact parse failure that made run #1 die with zero jobs.
        run: |
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: NO"

      # The native panel host. It cannot be compiled on the machine it was written on, so CI is the
      # only thing standing between "250 lines of Swift" and "250 lines of Swift that build". An
      # unsigned binary is fine here and for anyone building locally; shipping to strangers needs an
      # Apple Developer certificate, which is a purchase, not a line of code.
      - name: Build the native panel host
        if: always()
        run: |
          swiftc -O -o VITALS mac/VitalsHost.swift -framework Cocoa -framework WebKit
          ls -lh VITALS
          file VITALS

      - name: Upload the host binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-host-${{ matrix.os }}
          path: vitals/VITALS
          if-no-files-found: warn

      # Proves the host launches and reaches the bridge rather than merely linking. It is a GUI app
      # on a headless runner, so this checks it starts and stays up for a few seconds without
      # crashing - not that anything is drawn. What a window LOOKS like still needs human eyes.
      - name: Panel host launches without crashing
        if: always()
        run: |
          VITALS_PORT=8791 node bridge.js &
          sleep 6
          ./VITALS --port 8791 --no-top &
          HOSTPID=$!
          sleep 5
          if kill -0 $HOSTPID 2>/dev/null; then
            echo "host still running after 5s (did not crash on launch)"
            # Photograph it while it is up. "What it looks like needs human eyes" conflated two
            # things - a human must JUDGE the pixels, but capturing them is automation's job.
            # Runners do have a window server; if this comes back wallpaper-only or refuses,
            # that is itself a finding about capture consent on runners, banked not guessed.
            sleep 3
            screencapture -x host-window.png || echo "screencapture refused on this runner"
            kill $HOSTPID 2>/dev/null || true
          else
            echo "HOST EXITED EARLY - check the build step output"
            exit 1
          fi

      - name: Upload the host screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-screenshot-${{ matrix.os }}
          path: vitals/host-window.png
          if-no-files-found: warn
