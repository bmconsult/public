      <p>This page can run a Claude conversation about this machine, grounded in what the panel has
         actually measured. It is off until you turn it on, and nothing has been sent anywhere.</p>
      <p class="muted">What connecting does: starts the Claude Code CLI on this machine as a child
         process, and sends it a short anonymous summary with each question — CPU, memory, disk, GPU,
         battery and the ranked diagnosis. <b>No process names, no account name, no paths.</b> Detail
         is fetched only when a question needs it. It runs on your Claude subscription if you are
         logged in, or on an API key you provide.</p>
      <p class="muted">It can read and write files in the VITALS folder — that is how you can ask it
         for a new tool. The clipboard log, your API key and the admin passphrase are denied to it
         outright.</p>
      <button class="btn go" id="askConnect">Connect Ask</button>
      <span class="muted" style="margin-left:10px">you can disconnect again at any time</span>
    </div>`;
    const b=$('#askConnect');
    if(b) b.onclick=async()=>{
      b.disabled=true; b.textContent='connecting…';
      const d=await askCfg({enabled:true});
      if(d){ toast('Ask connected',3500); RENDER.ask(); }
      else { b.disabled=false; b.textContent='Connect Ask'; }
    };
    return;
  }
  const bar=$('.askbar'), sug=$('#askSug');
  if(bar) bar.style.display='';
  if(sug) sug.style.display='';
  if(!ASK.msgs.length){
    t.innerHTML=`<div class="btsub" style="padding:10px">It already knows what this machine is doing —
      the ranked diagnosis, the live sample and the top processes go with every question, so you can
      ask about <i>this</i> box rather than describe it first.</div>`;
    return;
  }
  t.innerHTML=ASK.msgs.map(m=>
    `<div class="askmsg ${m.role}"><div class="askwho">${m.role==='user'?'you':'claude'}</div>
     <div class="asktext">${sysEsc(m.text)}</div></div>`).join('');
  t.scrollTop=t.scrollHeight;
}
/* ONE SHARED STREAM, HELD FOR THE LIFE OF THE WINDOW.
   The old client POSTed and then read the reply out of its own response body, which is why closing
   the window killed the run. Now the POST only starts it and every window - this one, a popped-out
   chat, a second machine's later - watches the same server-side stream. Attach on first paint, not
   on send, so a window that opens mid-answer joins an already-running conversation. */
/* POP OUT — a real second window, not a floating card.
   Asked for explicitly: the panel is frameless and usually docked to a screen edge, so a card
   floating on top of it competes for the same space the diagnostics need. A separate window can sit
   on another monitor while the panel keeps monitoring, which is the whole point of asking a question
   that takes a minute.
   Nothing is handed off. Both windows watch the same server-side stream, so the conversation appears
   in both and closing either one leaves the run untouched. */
function askPopOut(){
  const u=new URL(location.href);
  u.searchParams.set('view','ask');
  u.hash='';
  /* The bridge opens a native window when it can (WebView2 on Windows); window.open is the fallback
     and is also what a browser-hosted panel gets. */
  /* INHERIT ALWAYS-ON-TOP. A non-topmost window can NEVER be drawn above a topmost one - no amount
     of raising, activating or foregrounding beats that, because it is a z-band, not a z-order. With
     the panel pinned on top the pop-out opened behind it every time and looked like a dead button.
     So the child matches the parent's band: pinned parent, pinned child. */
  fetch(API('/api/window/open'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:u.toString(),w:520,h:680,title:'VITALS · Ask',
                         top:(typeof isTop!=='undefined'&&!!isTop)})})
    .then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
    .then(d=>{ if(!d||!d.opened) throw new Error('no native host'); })
    .catch(()=>{ window.open(u.toString(),'vitals-ask','width=520,height=680'); });
}

/* CHROMELESS MODE. ?view=ask renders only the conversation - no sidebar, no header, no other pages -
   so a popped-out window is a chat window rather than a second copy of the whole panel. */
const SOLO=(()=>{ try{ return new URLSearchParams(location.search).get('view')||''; }catch{ return ''; } })();

let askES=null;
function askStream(){
  if(askES) return;
  askES=new EventSource(API('/api/ask/stream'));
  askES.onmessage=(ev)=>{
    let j; try{ j=JSON.parse(ev.data); }catch{ return; }
    const last=()=>ASK.msgs[ASK.msgs.length-1];
    if(j.type==='hello'){
      ASK.busy=!!j.busy;
      /* RESYNC WHOLESALE. The server's list IS the thread; whatever this window accumulated locally
         is only a reconstruction of it, and after a reconnect it may be missing an entire exchange
         that started and finished while the stream was down. Replacing rather than merging is what
         makes two windows show the same thing byte for byte. */
      if(Array.isArray(j.messages)) ASK.msgs=j.messages;
      /* Then overlay anything still IN FLIGHT - not saved yet, so it exists only in the live buffer.
         Without it a window opened during a long answer sits blank until the next delta, which on a
         thinking model can be most of a minute of looking broken. */
      if(j.live){
        ASK.msgs.push({role:'user',text:j.live.q});
        ASK.msgs.push({role:'assistant',text:j.live.text||''});
      }
      paintAsk(); askBusyUI();
      return;
    }
    if(j.type==='ask'){
      /* Someone asked - possibly in another window. Mirror it here so both threads agree. */
      const l=last();
      if(!l||l.role!=='user'||l.text!==j.q){
        ASK.msgs.push({role:'user',text:j.q});
        ASK.msgs.push({role:'assistant',text:''});
      }
      ASK.busy=true; askBusyUI(); paintAsk(); return;
    }
    if(j.type==='text'){
      let l=last();
      if(!l||l.role!=='assistant'){ ASK.msgs.push({role:'assistant',text:''}); l=last(); }
      l.text+=j.text; paintAsk(); return;
    }
    if(j.type==='error'){
      ASK.busy=false;
      if(Array.isArray(j.messages)) ASK.msgs=j.messages;
      let l=last();
      if(!l||l.role!=='assistant'||l.text){ ASK.msgs.push({role:'assistant',text:''}); l=last(); }
      l.text=`(${j.error})`;
      askBusyUI(); paintAsk(); return;
    }
    if(j.type==='done'){
      ASK.busy=false;
      /* The SAVED thread replaces the streamed reconstruction. It carries the trimming and the
         stopped marker, so every window finishes a run holding identical content rather than each
         holding its own assembly of whichever deltas it happened to receive. */
      if(Array.isArray(j.messages)) ASK.msgs=j.messages;
      const l=last();
      if(l&&l.role==='assistant'&&!l.text) l.text='(no reply)';
      askBusyUI(); paintAsk(); return;
    }
  };
  askES.onerror=()=>{};   // EventSource reconnects on its own
}
function askBusyUI(){
  const g=$('#askGo'), st=$('#askStop');
  if(g) g.style.display=ASK.busy?'none':'';
  if(st) st.style.display=ASK.busy?'':'none';
}
/* Fire and forget. The reply arrives on the shared stream, so this window is not the run's owner and
   may be closed, reloaded or popped out without ending it. */
async function askSend(){
  const inp=$('#askIn'); if(!inp) return;
  const q=inp.value.trim(); if(!q||ASK.busy) return;
  inp.value='';
  askStream();
  try{
    const r=await fetch(API('/api/ask'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    if(r.status===409){ toast('A question is already running'); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    /* No local echo: the server's own 'ask' event adds the turn, so every window shows it once and
       in the same order rather than each inventing its own copy. */
  }catch(e){ toast('Ask failed: '+e.message); }
}

/* ================= WATCH: tell me when =================
 * The one thing on this page that works while you are not looking at it. Everything else answers a
 * question you thought to ask; a watch answers one you asked earlier and then forgot about.
 *
 * Two rules make it honest rather than a toy:
 *   SUSTAINED, never instantaneous. Same law the diagnosis engine runs on. "CPU dropped below 12%"
 *   fires the moment a build pauses to read a file; "CPU below 12% FOR 30 SECONDS" means the build
 *   actually finished. Each watch carries its own hold time and the tile shows progress toward it.
 *   ARMED means it has SEEN THE OPPOSITE FIRST. A "download finished" watch armed while the network is
 *   already idle would fire instantly and tell you nothing - so it must observe the condition being
 *   FALSE at least once before it may become true. It has to see the thing start before it can tell
 *   you it stopped.
 *
 * Fires in-window only - journal line, the FX bus, a toast - per the owner: nothing buzzing outside. */
const WATCH_PRESETS = [
  { id:'build',  label:'Build finished',    metric:'cpu',  op:'<', value:12,   forSec:30, needsOpposite:true,
    say:'CPU under 12% for 30s, whatever was running has finished' },
  { id:'dl',     label:'Download finished', metric:'net',  op:'<', value:0.15, forSec:20, needsOpposite:true,
    say:'network idle for 20s, the transfer is done' },
  { id:'mem',    label:'Memory critical',   metric:'mem',  op:'>', value:95,   forSec:45, needsOpposite:false,
    say:'memory above 95% for 45s' },
  { id:'disk',   label:'Disk space freed',  metric:'free', op:'>', value:60,   forSec:5,  needsOpposite:false,
    say:'C: free space passed 60 GB' },
];
const WATCH_METRIC = {
  cpu:  { label:'CPU',         unit:'%',    get:t=>t.cpu.total },
  mem:  { label:'Memory',      unit:'%',    get:t=>t.mem.pct },
  net:  { label:'Network',     unit:'MB/s', get:t=>(t.net.rxMBs||0)+(t.net.txMBs||0) },
  free: { label:'Disk free',   unit:'GB',   get:t=>{const v=sysVol(t);return v?v.freeGB:0;} },
  flt:  { label:'Hard faults', unit:'/s',   get:t=>t.mem.pagesSec||0 },
};
let WATCHES=(()=>{ try{ return JSON.parse(localStorage.getItem('vitals-watches')||'[]'); }catch{ return []; } })();
const watchSave=()=>{ try{ localStorage.setItem('vitals-watches',JSON.stringify(WATCHES)); }catch{} };

function watchAdd(preset){
  if(WATCHES.some(w=>w.id===preset.id&&!w.firedAt)) return;     // already armed; do not stack duplicates
  WATCHES.push({ ...preset, addedAt:Date.now(), heldMs:0, armed:!preset.needsOpposite, firedAt:null });
  watchSave(); paintWatches();
  const m=WATCH_METRIC[preset.metric];
  sysPush('info','watch',`watching: ${preset.label.toLowerCase()} (${m.label} ${preset.op} ${preset.value}${m.unit} for ${preset.forSec}s)`);
}
function watchRemove(i){ WATCHES.splice(i,1); watchSave(); paintWatches(); }

/* Judged on the TICK, so hold time is measured against the collector's real cadence rather than a
   timer that could drift away from the samples it is judging. */
function watchTick(t){
  if(!t||!WATCHES.length) return;
  const dt=(S.tickDt||1)*1000;
  let changed=false;
  for(const w of WATCHES){
    if(w.firedAt) continue;
    const m=WATCH_METRIC[w.metric]; if(!m) continue;
    const v=+m.get(t)||0;
    const meets=w.op==='<' ? v<w.value : v>w.value;
    if(!w.armed){ if(!meets){ w.armed=true; changed=true; } continue; }
    if(meets){
      w.heldMs+=dt;
      if(w.heldMs>=w.forSec*1000){
        w.firedAt=Date.now(); changed=true;
        sysPush('ok','watch',`${w.label}: ${w.say} (now ${fmt(v,2)}${m.unit})`);
        try{ if(window.__fxBus) __fxBus('ok','watch',w.label); }catch{}
        try{ toast(`${w.label} — ${w.say}`); }catch{}
      }
    } else if(w.heldMs){ w.heldMs=0; changed=true; }   // a flicker RESETS the hold, it does not fire
  }
  if(changed){ watchSave(); if(S.view==='tools') paintWatches(); }
}

function paintWatches(){
  const list=$('#wList'), pre=$('#wPresets'), cl=$('#wClear'); if(!list||!pre) return;
  if(!pre.dataset.built){
    pre.dataset.built='1';
    pre.innerHTML=WATCH_PRESETS.map((p,i)=>`<button class="btn" data-wp="${i}">${p.label}</button>`).join('');
    pre.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>watchAdd(WATCH_PRESETS[+b.dataset.wp]));
  }
  if(cl){ cl.style.display=WATCHES.length?'':'none';
          cl.onclick=()=>{ WATCHES=[]; watchSave(); paintWatches(); }; }
  if(!WATCHES.length){
    list.innerHTML=`<div class="btsub" style="margin-top:5px">Arm one and forget it. Each waits for a
      <b>sustained</b> condition, not a flicker, and says so in the journal when it happens.</div>`;
    return;
  }
  list.innerHTML=WATCHES.map((w,i)=>{
    const m=WATCH_METRIC[w.metric];
    const pct=Math.min(100,Math.round((w.heldMs/(w.forSec*1000))*100));
    const state=w.firedAt?`fired ${new Date(w.firedAt).toTimeString().slice(0,5)}`
              :!w.armed?'waiting for it to start'
              :w.heldMs?`${Math.round(w.heldMs/1000)}/${w.forSec}s`:'armed';
    return `<div class="wrow${w.firedAt?' done':''}">
      <div class="wtop"><b>${w.label}</b><span class="wx" data-wx="${i}">×</span></div>
      <div class="wmeta">${m.label} ${w.op} ${w.value}${m.unit} · ${state}</div>
      ${w.firedAt?'':`<div class="wbar"><i style="width:${pct}%"></i></div>`}</div>`;
  }).join('');
  list.querySelectorAll('[data-wx]').forEach(x=>x.onclick=()=>watchRemove(+x.dataset.wx));
}

/* Network tile actions. Latency is ~1 KB and runs on a click; the speed test spends real bandwidth so
   it keeps the price on the button and confirms first, same rule as the NET page. */
/* Results ACCUMULATE. A network measurement on its own says almost nothing - the useful question is
   "is this worse than last time", and that needs the last time still on screen. So each run appends a
   timestamped row to its own list, latency and speed never overwrite each other, and rows are removed
   one at a time with their x or all at once with clear. Persisted, because "worse than this morning"
   should survive a reload. */
let NETRECS=(()=>{ try{ return JSON.parse(localStorage.getItem('vitals-netrecs')||'{"ping":[],"speed":[]}'); }
                   catch{ return {ping:[],speed:[]}; } })();
const netSave=()=>{ try{ localStorage.setItem('vitals-netrecs',JSON.stringify(NETRECS)); }catch{} };
function netRec(kind,html){
  NETRECS[kind].unshift({ at:Date.now(), html });
  if(NETRECS[kind].length>12) NETRECS[kind].length=12;      // a tile, not an archive
  netSave(); paintNetRecs();
}
function netDrop(kind,i){ NETRECS[kind].splice(i,1); netSave(); paintNetRecs(); }
function paintNetRecs(){
  const clk=t=>new Date(t).toTimeString().slice(0,5);
  for(const [kind,id] of [['ping','#twPingOut'],['speed','#twSpeedOut']]){
    const el=$(id); if(!el) continue;
    el.innerHTML=NETRECS[kind].map((r,i)=>
      `<div class="nrec"><span class="nt">${clk(r.at)}</span><span class="nv">${r.html}</span>
       <span class="nx" data-nk="${kind}" data-ni="${i}">×</span></div>`).join('');
    el.querySelectorAll('[data-nk]').forEach(x=>x.onclick=()=>netDrop(x.dataset.nk,+x.dataset.ni));
  }
  const c=$('#twClear');
  if(c){ c.style.display=(NETRECS.ping.length||NETRECS.speed.length)?'':'none';
         c.onclick=()=>{ NETRECS={ping:[],speed:[]}; netSave(); paintNetRecs(); }; }
}
async function netPing(){
  const b=$('#twPing'); if(b) b.textContent='…';
  try{
    const r=await (await fetch('/api/nettest',{method:'POST'})).json();
    if(r.error) throw new Error(r.error);
    const one=p=>p&&p.avg!==undefined?`${fmt(p.avg,0)}ms`:'—';
    netRec('ping',`gw <b>${one(r.gw)}</b> · net <b>${one(r.inet)}</b>${r.dns&&r.dns.avg!==undefined?` · dns <b>${one(r.dns)}</b>`:''}`);
  }catch(e){ netRec('ping',`<span style="color:var(--crit)">${sysEsc(e.message).slice(0,40)}</span>`); }
  if(b) b.textContent='latency';
}
async function netSpeed(){
  if(!confirm('Run a speed test?\n\nIt downloads about 25 MB and uploads about 8 MB from speed.cloudflare.com — roughly 33 MB of your data plan.')) return;
  const b=$('#twSpeed'); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span>&nbsp;measuring'; }
  try{
    const r=await (await fetch('/api/speedtest',{method:'POST'})).json();
    if(r.error) throw new Error(r.error);
    netRec('speed',`↓ <b>${fmt(r.downMbps,1)}</b> ↑ <b>${fmt(r.upMbps,1)}</b> Mbps`);
    sysPush('info','net',`speed test: ${fmt(r.downMbps,1)} down / ${fmt(r.upMbps,1)} up Mbps`);
  }catch(e){ netRec('speed',`<span style="color:var(--crit)">${sysEsc(e.message).slice(0,40)}</span>`); }
  if(b){ b.disabled=false; b.textContent='Speed test'; }
}

/* Full-size viewer. Built once, reused, and dismissed by clicking anywhere or pressing Escape - it is
   an overlay on a 1080-wide panel, so anything more elaborate would be in the way. */
function clipView(file){
  let v=$('#clipView');
  if(!v){
    v=document.createElement('div'); v.id='clipView';
    v.innerHTML=`<div class="cvbar"><span id="cvName"></span><span style="flex:1"></span>
      <a id="cvOpen">open in Explorer</a><a id="cvClose">close</a></div><img id="cvImg" alt="">`;
    document.body.appendChild(v);
    v.onclick=e=>{ if(e.target.id!=='cvOpen') v.classList.remove('on'); };
    addEventListener('keydown',e=>{ if(e.key==='Escape') v.classList.remove('on'); });
  }
  $('#cvImg').src='/api/clip/img?f='+encodeURIComponent(file);
  $('#cvName').textContent=file;
  $('#cvOpen').onclick=()=>{ fetch('/api/reveal',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({clip:file})}).catch(()=>{}); };
  v.classList.add('on');
}

/* Clipboard tile. The toggle is the whole feature: it is off, it says it is off, and it says why. */
async function clipToggle(){
  const b=$('#clipToggle'); if(!b) return;
  const turningOn=b.textContent.trim()!=='on';
  if(turningOn && !confirm(
    'Start clipboard history?\n\n'+
    'EVERYTHING you copy as text is written to disk, including things that look like keys and tokens, '+
    'so you can go back for them.\n\n'+
    'Entries that look like secrets keep their text for 24 HOURS and are then blanked automatically — '+
    'the row survives so you can see something was copied, but the value is gone. Ordinary text is '+
    'kept for 120 days.\n\n'+
    'Images and file drops are logged as events only (size / filenames), never the bytes.\n\n'+
    'It is never included in a support bundle unless you tick it deliberately.')) return;
  b.textContent='…';
  try{
    const r=await (await fetch('/api/clip',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({on:turningOn})})).json();
    sysPush('info','clip',`clipboard history ${r.running?'started':'stopped'}`);
  }catch(e){ toast('Failed: '+e.message); }
  clipRefresh();
}
async function clipRefresh(){
  const el=$('#clipBody'), b=$('#clipToggle'); if(!el) return;
  let d=null;
  try{ d=await (await fetch('/api/clip?days=7&limit=40')).json(); }catch{ return; }
  const on=d.stats&&d.stats.running;
  if(b) b.textContent=on?'on':'off';
  const head=`<div class="btsub" style="margin-bottom:5px">${on?'recording':'off'} · ${d.stats?fmt(d.stats.lines):0} kept · ${d.stats?d.stats.keepDays:0}d, secrets blanked after ${d.stats?d.stats.secretHours:24}h</div>`;
  if(!d.entries||!d.entries.length){
    el.innerHTML=head+`<div class="empty" style="padding:6px;font-size:10px">${on?'nothing copied yet':'Off. A clipboard log is the most sensitive thing this tool can keep, so it never starts by itself.'}</div>`;
    return;
  }
  /* Every row that CAN be opened, is: images show a thumbnail and open full size, file drops reveal in
     Explorer, and anything copied from a page carries the SourceURL the clipboard's HTML format
     already had. A log of things you copied is much more useful when the things are still reachable. */
  el.innerHTML=head+d.entries.map(e=>{
    const t=new Date(e.at).toTimeString().slice(0,5);
    const gone=e.secret&&!e.text;                  // scrubbed after its 24 h, row kept on purpose
    const tag=e.kind&&e.kind!=='text'?e.kind:(e.secret?'secret':'');
    let body;
    if(e.kind==='image'&&e.file){
      body=`<img class="cthumb" src="/api/clip/img?f=${encodeURIComponent(e.file)}" data-img="${encodeURIComponent(e.file)}"
              alt="${e.w}x${e.h}" title="click to open ${e.w}x${e.h}">`;
    } else if(e.kind==='image'){
      body=`<div class="ctext">image ${sysEsc(e.text||'')} — not saved (recorded before images were kept)</div>`;
    } else if(e.kind==='files'){
      body=(e.text||'').split('\n').filter(Boolean).map(pth=>
        `<div class="cpath" data-reveal="${encodeURIComponent(pth)}" title="reveal in Explorer">${sysEsc(pth)}</div>`).join('');
    } else {
      body=`<div class="ctext">${gone?'expired after 24 h — value gone, record kept':sysEsc(e.text||'')}</div>`;
    }
    return `<div class="clip-row${gone?' skip':''}">
      <div class="cmeta"><span>${t}</span>${e.src?`<span>${sysEsc(e.src)}</span>`:''}
        ${tag?`<span style="color:var(--warn)">${tag}</span>`:''}
        <span>${e.chars?e.chars+' chars':(e.bytes?fmt(e.bytes/1024,0)+' KB':'')}</span></div>
      ${body}
      ${e.url?`<a class="curl" href="${sysEsc(e.url)}" target="_blank" rel="noopener" title="${sysEsc(e.url)}">${sysEsc(e.url.replace(/^https?:\/\//,'').slice(0,42))}</a>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-img]').forEach(im=>im.onclick=()=>clipView(decodeURIComponent(im.dataset.img)));
  el.querySelectorAll('[data-reveal]').forEach(pn=>pn.onclick=()=>{
    fetch('/api/reveal',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:decodeURIComponent(pn.dataset.reveal)})}).catch(()=>{});
  });
}
function paintLaps(){
  const c=$('#swLapsCard'), el=$('#swLaps'); if(!c||!el) return;
  c.style.display=SW.laps.length?'':'none';
  el.innerHTML=SW.laps.map((l,i)=>
    `<div class="kv"><span class="muted">Lap ${i+1}</span><b>${swFmt(l.split)} <span class="muted" style="font-weight:400">at ${swFmt(l.at)}</span></b></div>`).join('');
}
/* The point of the feature: a window the user chose, summarised and then PERSISTED. */
function swReport(){
  const st=swStats(), ms=swMs();
  const keys=Object.keys(st);
  if(!keys.length){ $('#swOut').innerHTML=`<div class="note">Nothing was ticked, so nothing was recorded.</div>`; return; }
  const fmtv=(k,v)=> (SW_METRICS[k].unit==='MB/s'||v<10) ? fmt(v,2) : fmt(v,0);
  /* Timestamped, per the owner: "the recordings should be timestamps". A duration alone cannot be
     placed against anything else - the journal, the rollups, a build log - but a start and end time
     can, which is what turns a stopwatch result into evidence. */
  const clk=(t)=> t ? new Date(t).toTimeString().slice(0,8) : '—';
  const span=`${clk(SW.startedAt)} → ${clk(SW.stoppedAt||Date.now())}`;
  $('#swOut').innerHTML=`
    <div class="rl" style="margin-top:12px">${span} · over ${swFmt(ms)} · ${st[keys[0]].n} samples</div>
    <table class="dense swtab"><thead><tr><th>Metric</th><th class="num">min</th><th class="num">avg</th><th class="num">peak</th></tr></thead><tbody>
    ${keys.map(k=>`<tr><td><i class="swdot" style="background:var(${SW_METRICS[k].color})"></i>${SW_METRICS[k].label}</td>
      <td class="num">${fmtv(k,st[k].min)}</td><td class="num">${fmtv(k,st[k].avg)}</td>
      <td class="num"><b>${fmtv(k,st[k].max)}</b><small class="muted"> ${SW_METRICS[k].unit}</small></td></tr>`).join('')}
    </tbody></table>`;
  sysPush('info','sw',`stopwatch ${span} (${swFmt(ms)}) · `+keys.map(k=>
    `${SW_METRICS[k].label} avg ${fmtv(k,st[k].avg)} peak ${fmtv(k,st[k].max)}${SW_METRICS[k].unit}`).join(' · '));
}

/* One second is enough for a wall clock; the ring redraws with it. Runs regardless of which page is
   showing because the header clock is always visible, and skips the canvas work when it is not. */
setInterval(()=>{
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0'), ss=String(now.getSeconds()).padStart(2,'0');
  const hc=$('#hClock'); if(hc) hc.textContent=`${hh}:${mm}:${ss}`;
  if(document.hidden) return;
  /* The docked strip is the surface that is on screen all day, so its clock runs whenever the strip
     exists - it is not gated on which page the (hidden) window happens to be showing. */
  const sbT=$('#sbTime');
  if(sbT){
    sbT.textContent=`${hh}:${mm}:${ss}`;
    const sbD=$('#sbDate'); if(sbD) sbD.textContent=now.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    drawClock($('#sbClockC'));
  }
  if(S.view==='tools'){
    const d=$('#cDigits'); if(d) d.textContent=`${hh}:${mm}:${ss}`;
    const dy=$('#cDay'); if(dy) dy.textContent=now.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
    const mt=$('#cMeta'); if(mt) mt.textContent=`day ${Math.ceil((now-new Date(now.getFullYear(),0,0))/86400000)} of ${now.getFullYear()}`;
    drawClock($('#clockC'));
  }
},1000);
/* The stopwatch face needs to move faster than the clock or it looks broken. Only while running and
   only while its page is up - a stopped stopwatch on a hidden page costs nothing. */
setInterval(()=>{
  if(document.hidden) return;
  if(SW.running){
    const t=swFmt(swMs());
    const b=$('#swBig'); if(b&&S.view==='tools') b.textContent=t;
    const s=$('#sbSwBig'); if(s) s.textContent=t;    // the docked strip is always the visible one
  }
},60);

/* ---- growth: what changed, from MFT snapshot diffs ---- */
RENDER.growth=async()=>{
  const el=$('#p-growth');
  el.innerHTML=`<div class="hd"><h2>Growth</h2></div><div class="card"><div class="empty"><span class="spin"></span> reading snapshots…</div></div>`;
  const [snaps,g]=await Promise.all([
    (await fetch('/api/snapshots')).json().catch(()=>[]),
    (await fetch('/api/growth')).json().catch(()=>({}))]);
  const head=`<div class="hd"><h2>Growth</h2><span class="n">${snaps.length} snapshot${snaps.length===1?'':'s'}</span>
    <span class="sp"></span><button class="btn go" id="doScan">New scan</button></div>`;

  if(g.incompatible){
    el.innerHTML=head+`<div class="card"><h3>Cannot compare</h3><div class="note">
      These snapshots came from <b>different scanner versions</b> (v${g.oldScanner} → v${g.newScanner}).
      A scanner change alters how sizes are computed, so diffing them would measure the change in the
      <i>scanner</i>, not on the disk. Take a fresh scan and compare from there.</div></div>`;
  } else if(g.need){
    el.innerHTML=head+`<div class="card"><h3>Need a second snapshot</h3><div class="note">
      Growth is the difference between two MFT scans. You have ${g.have}. Take another now, then
      again in a few days — that is when this view starts answering <b>"when did this start?"</b>,
      the question no live monitor can.</div></div>`;
  } else if(!g.grew){
    el.innerHTML=head+`<div class="card"><div class="empty">no snapshots yet — hit New scan</div></div>`;
  } else {
    const mx=Math.max(...[...g.grew,...g.shrank].map(r=>Math.abs(r.deltaGB)),0.1);
    const span=g.spanDays<1?Math.round(g.spanDays*24)+' hours':g.spanDays.toFixed(1)+' days';
    const rate=g.spanDays>0.04?` · ${g.netGB>0?'+':''}${(g.netGB/g.spanDays).toFixed(1)} GB/day`:'';
    const dvg=(r,dir)=>`
      <div class="dvg"><div class="dp">${r.path}${r.isNew?' <span class="tag t2">new</span>':''}</div>
        <div class="dbar"><i style="${dir>0?'left:50%':'right:50%'};width:${Math.abs(r.deltaGB)/mx*50}%;
          background:var(--${dir>0?'warn':'ok'});box-shadow:0 0 calc(7px*var(--sgk)) var(--${dir>0?'warn':'ok'})"></i></div>
        <div class="dv ${dir>0?'warn':'ok'}">${dir>0?'+':''}${r.deltaGB} GB</div></div>`;
    el.innerHTML=head+`
      <div class="hero" style="grid-template-columns:1fr">
        <div class="hstat" style="--acc:var(--${g.netGB>0?'warn':'ok'})">
          <div class="hl"><i></i>Net change over ${span}</div>
          <div class="hv"><span class="${g.netGB>0?'warn':'ok'}">${g.netGB>0?'+':''}${g.netGB}</span><small>GB${rate}</small></div>
          <div class="hs">Volume now holds ${g.newest.totalGB} GB. This diffs two MFT snapshots — the answer to <b>"when did this start?"</b> that no live monitor has.</div>
        </div>
      </div>
      ${(g.grew.length||g.shrank.length)?`<div class="card gcard"><h3>What moved <span class="muted">· grew right, shrank left</span><span style="flex:1"></span><span class="muted" style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase">${g.grew.length+g.shrank.length} directories</span></h3>
        <div class="gscroll">${g.grew.map(r=>dvg(r,1)).join('')}${g.shrank.map(r=>dvg(r,-1)).join('')}</div></div>`:''}
      <div class="card"><h3>Attribution</h3><div class="note">
        Only the <b>deepest</b> directory that accounts for a change is listed. If a child explains
        essentially all of its parent's growth, showing both would bury the actual culprit under its
        own ancestors.</div></div>`;
  }
  $('#doScan').onclick=async()=>{
    toast('Accept the UAC prompt — full-volume scan takes ~10s');
    await fetch('/api/mftscan',{method:'POST'});
    setTimeout(()=>{ RENDER.growth(); toast('Scan should be complete'); },22000);
  };
};

/* ---- disk: volumes + reclaimability treemap ----
   Colour carries the one thing this app knows that no shipping disk map does: which bytes you can
   actually get back (playbook §2.4 tiers). Palette lives in :root as --t1..--tn triplets. */
let crumb=[{name:'C:\\',full:'C:\\'}];
const TIER_META={
  1:{c:'--t1',leg:'reclaim now',        say:'Tier 1 — regenerable cache. Safe to clear: it rebuilds on next use, zero loss.'},
  2:{c:'--t2',leg:'decide',             say:'Tier 2 — real but recoverable data. Reclaimable after a deliberate call, not a reflex (playbook §2.4).'},
  3:{c:'--t3',leg:'yours · archivable', say:'Tier 3 — irreplaceable user data. Never delete blind, but movable to cold storage.'},
  4:{c:'--t4',leg:'system · keep out',  say:'Tier 4 — Windows needs this. Clean only via DISM / Settings / powercfg, never by hand.'},
  0:{c:'--tn',leg:'unsorted',           say:'No reclaim rule matches this path — judge it with the playbook’s four tiers.'},
};
/* First match wins, so overrides (Downloads\code, Windows\Temp) sit ABOVE their parents' rules,
   and because these are substring segment matches, children inherit an ancestor's tier for free. */
const TIER_RULES=[
  [4,/\\Users\\[^\\]+\\Downloads\\code($|\\)/i],            // live workspace — playbook tier 4
  [1,/\\AppData\\Local\\Temp($|\\)/i],
  [1,/^[a-z]:\\Windows\\Temp($|\\)/i],
  [1,/^[a-z]:\\Windows\\SoftwareDistribution\\Download($|\\)/i],
  [1,/^[a-z]:\\\$WinREAgent($|\\)/i],
  [1,/^[a-z]:\\(tmp|adobeTemp)($|\\)/i],
  [1,/\\AppData\\.*\\(Cache|Code Cache|GPUCache|CacheStorage|ShaderCache|DawnCache|CachedData)($|\\)/i],
  [2,/^[a-z]:\\\$Recycle\.Bin($|\\)/i],
  [2,/\\(hiberfil|pagefile|swapfile)\.sys$/i],
  [2,/CanonicalGroupLimited|\\ext4\.vhdx$/i],               // WSL disk — compact it, never delete
  [2,/\\Users\\[^\\]+\\\.(cargo|rustup|cache|elan|nuget|gradle|m2)($|\\)/i],
  [2,/\\pypoetry($|\\)/i],
  [3,/\\Users\\[^\\]+\\(Downloads|Documents|Pictures|Videos|Music|Desktop)($|\\)/i],
  [3,/\\Users\\[^\\]+\\OneDrive[^\\]*($|\\)/i],
  [4,/^[a-z]:\\Windows($|\\)/i],
  [4,/^[a-z]:\\Program Files( \(x86\))?($|\\)/i],
  [4,/^[a-z]:\\System Volume Information($|\\)/i],
];
const tierOf=p=>{ if(!p) return 0; for(const [t,re] of TIER_RULES) if(re.test(p)) return t; return 0; };
const gbs=g=>g>=10?fmt(g,0)+' GB':g>=1?fmt(g,1)+' GB':fmt(g*1024,0)+' MB';
const pcs=f=>{ const p=f*100; return (p>=10?Math.round(p):p>=1?p.toFixed(1):p.toFixed(2))+'%'; };
RENDER.disk=()=>{
  const t=S.tick; if(!t) return;
  $('#p-disk').innerHTML=`
    <div class="hd"><h2>Storage</h2><span class="sp"></span></div>
    <div class="hero" style="grid-template-columns:repeat(${Math.min(t.disk.vols.length,3)},1fr)">
      ${t.disk.vols.map(v=>{
        const cl=v.pct>95?'crit':v.pct>85?'warn':'ok';
        const bcol=v.pct>95?'crit':v.pct>85?'warn':'disk';
        return `<div class="hstat" style="--acc:var(--${bcol})">
          <div class="hl"><i></i>${v.id} ${v.label?`· ${v.label}`:''}</div>
          <div class="hv"><span class="${cl}">${fmt(v.freeGB,0)}</span><small>GB free</small></div>
          <div class="hs">${v.pct}% of ${fmt(v.sizeGB||0,0)} GB used</div>
          <div class="bar mb" style="height:8px;margin-top:10px"><i style="width:${v.pct}%;background:var(--${bcol});box-shadow:0 0 calc(10px*var(--sgk)) var(--${bcol})"></i></div>
        </div>`}).join('')}
    </div>
    ${t.disk.vols.some(v=>v.pct>90)?`<div class="find critical" style="margin-bottom:12px"><h4>Below 10% free</h4>
      <div class="why">SSDs need spare blocks for wear-levelling and garbage collection; past this point write speed can fall by more than half. This is fully reversible — free space and the drive recovers.</div></div>`:''}
    <div class="card"><h3 style="display:flex;align-items:center;gap:13px;margin-bottom:8px">Where the space went
      <span class="tleg">${[1,2,3,4,0].map(k=>`<span><i style="background:rgb(var(${TIER_META[k].c}))"></i>${TIER_META[k].leg}</span>`).join('')}<span><i style="background:none;border:1px dashed rgba(var(--fg),.35)"></i>free</span><span><i style="background:repeating-linear-gradient(45deg,rgba(var(--t4),.6) 0 2px,transparent 2px 4px)"></i>unmapped</span></span>
      <span style="flex:1"></span>
      <button class="btn" id="reScan" title="Re-runs the elevated MFT scanner — Windows will show a UAC prompt">Rescan · UAC</button></h3>
      <div class="crumb" id="crumb"></div>
      <div id="dirs"><div class="empty"><span class="spin"></span> sizing…</div></div>
    </div>`;
  $('#reScan').onclick=async()=>{
    const b=$('#reScan'); b.disabled=true; b.innerHTML='<span class="spin"></span>&nbsp;scanning';
    toast('Accept the UAC prompt — full-volume MFT scan, ~10 s');
    try{ await fetch('/api/mftscan',{method:'POST'}); }catch{}
    setTimeout(()=>{ b.disabled=false; b.textContent='Rescan · UAC'; loadDirs(); },16000);
  };
  paintCrumb(); loadDirs();
};
function paintCrumb(){
  const el=$('#crumb'); if(!el) return;
  el.innerHTML=crumb.map((c,i)=>`<span data-i="${i}">${c.name}</span>${i<crumb.length-1?'<span class="muted" style="cursor:default">›</span>':''}`).join('');
  $$('#crumb span[data-i]').forEach(s=>s.onclick=()=>{ crumb=crumb.slice(0,+s.dataset.i+1); paintCrumb(); loadDirs(); });
}
/* Prefer the MFT snapshot: once one exists, descending is a lookup (~30 ms) instead of a live
   directory walk (seconds per level). Falls back to the walker when no snapshot is available.
   The map accounts for the WHOLE volume at root — free space and the unmapped remainder (VSS,
   $MFT, NTFS metadata) get explicit tiles, so the percentages reconcile instead of quietly
   summing to less than the drive. */
let loadSeq=0;
async function loadDirs(){
  const host=$('#dirs'); if(!host) return;
  const seq=++loadSeq;
  const cur=crumb[crumb.length-1].full;
  const isRoot=/^[a-z]:\\?$/i.test(cur);
  host.innerHTML='<div class="empty"><span class="spin"></span> reading…</div>';
  let dirs=null, src='', m=null, meta='';
  try{
    m=await (await fetch('/api/mft?path='+encodeURIComponent(cur))).json();
    if(m && !m.none && m.kids){
      dirs=m.kids; src='mft';
      const age=m.takenAt?((Date.now()-Date.parse(m.takenAt))/3600000):null;
      meta=`MFT snapshot · ${m.files?fmt(m.files):'?'} files`+
           (age!==null?` · taken ${age<1?Math.round(age*60)+' min':age.toFixed(1)+' h'} ago`:'');
    }
  }catch{}
  if(!dirs){
    try{
      const d=await (await fetch('/api/bigdirs?root='+encodeURIComponent(cur))).json();
      dirs=(d.dirs||[]).map(x=>({name:x.name,path:x.full,gb:x.gb})); src='walk';
      meta='live directory walk — Rescan builds the instant whole-volume MFT map';
    }catch(e){ if(seq===loadSeq) host.innerHTML=`<div class="empty">scan failed: ${e.message}</div>`; return; }
  }
  if(seq!==loadSeq) return;                    // a faster navigation superseded this one
  dirs=dirs.filter(x=>x.gb>0.01).sort((a,b)=>b.gb-a.gb);
  const vol=S.tick&&S.tick.disk.vols.find(v=>cur.toUpperCase().startsWith(v.id));
  const kidSum=dirs.reduce((s,x)=>s+x.gb,0);
  // Tiny tails collapse into one aggregate tile instead of unreadable slivers.
  const MAXT=16, big=dirs.slice(0,MAXT), rest=dirs.slice(MAXT);
  const items=big.map(x=>({v:x.gb,x:{...x,tier:tierOf(x.path),kind:'dir'}}));
  let restV=rest.reduce((s,x)=>s+x.gb,0), restN=rest.length, self=null, own=0, unm=0;
  if(src==='mft'){
    self=isRoot?m.totalGB:(m.selfGB!=null?m.selfGB:null);
    own=m.ownGB!=null?m.ownGB:0;
    // The snapshot has no entry for the drive root itself, so root loose files (pagefile,
    // hiberfil, swapfile…) are total − children. Below root, selfGB reconciles the level.
    if(isRoot) own=Math.max(0,m.totalGB-kidSum);
    else if(self!=null){ const hid=self-own-kidSum; if(hid>0.1) restV+=hid; }
    if(own>0.05) items.push({v:own,x:{name:isRoot?'loose files · pagefile, hiberfil…':'loose files',
      gb:own,path:null,tier:isRoot?2:0,kind:'loose'}});
  }
  if(restV>0.01) items.push({v:restV,x:{name:restN?`${restN} smaller`:'deeper & smaller',gb:restV,path:null,tier:0,kind:'rest',dim:true}});
  if(isRoot&&vol){
    if(vol.freeGB>0.05) items.push({v:vol.freeGB,x:{name:'free space',gb:vol.freeGB,path:null,tier:0,kind:'free'}});
    if(src==='mft'){ unm=vol.sizeGB-vol.freeGB-m.totalGB;
      if(unm>0.3) items.push({v:unm,x:{name:'unmapped',gb:unm,path:null,tier:4,kind:'unm'}}); }
  }
  if(!items.length){ host.innerHTML='<div class="empty">nothing substantial here</div>'; return; }
  items.sort((a,b)=>b.v-a.v);
  const levelSum=items.reduce((s,i)=>s+i.v,0);
  const volGB=(vol&&vol.sizeGB)||(m&&m.totalGB)||levelSum;
  const volId=vol?vol.id:cur.slice(0,2);

  host.innerHTML='<div class="tmap" id="tmap"></div><div class="note" id="tfoot" style="margin-top:8px"></div>';
  const tm=$('#tmap'), W=tm.getBoundingClientRect().width||800, H=tm.getBoundingClientRect().height||340;
  const rects=layoutTreemap(items,W,H);
  // one flat store drives the hover card; sub-tiles append to it as their fetches land
  const tips=rects.map(r=>({name:r.it.x.name,path:r.it.x.path,gb:r.it.x.gb,
    pl:r.it.v/levelSum,pv:r.it.x.gb/volGB,tier:r.it.x.tier,kind:r.it.x.kind}));
  tm.innerHTML=rects.map((r,i)=>{
    const x=r.it.x, share=r.it.v/levelSum, w=Math.max(0,r.w-3), h=Math.max(0,r.h-3);
    const showTxt=w>54&&h>26, showGb=w>54&&h>40;
    const cls=(x.kind==='free'?' tfree':x.kind==='unm'?' tunm':'')+(x.dim?' dim':'')+(x.path?'':' noc');
    const tc=TIER_META[x.tier]?TIER_META[x.tier].c:'--tn';
    return `<div class="tnode${cls}" data-t="${i}" data-i="${i}"
      style="left:${r.x+1.5}px;top:${r.y+1.5}px;width:${w}px;height:${h}px;--tc:var(${tc});--ta:${(.08+share*.5).toFixed(3)}"
      ${x.path?`data-f="${x.path.replace(/"/g,'&quot;')}" data-n="${(x.name||'').replace(/"/g,'&quot;')}"`:''}>
      ${showTxt?`<div class="tn1">${x.name}</div>`:''}
      ${showGb?`<div class="tn2">${gbs(x.gb)} · ${pcs(x.gb/volGB)}</div>`:''}
    </div>`;
  }).join('');
  $$('#tmap .tnode[data-f]').forEach(d=>d.onclick=()=>{ crumb.push({name:d.dataset.n,full:d.dataset.f}); paintCrumb(); loadDirs(); });
  wireTips(tm,tips,volId);
  // footer: provenance, whole-volume reconciliation, what's recoverable at this level
  const t1s=items.filter(i=>i.x.tier===1&&i.x.kind==='dir').reduce((s,i)=>s+i.v,0);
  const t2s=items.filter(i=>i.x.tier===2).reduce((s,i)=>s+i.v,0);
  const parts=[meta];
  if(isRoot&&vol&&src==='mft')
    parts.push(`${fmt(m.totalGB,0)} GB mapped + ${fmt(vol.freeGB,0)} free + ${fmt(Math.max(0,unm),1)} unmapped = ${fmt(vol.sizeGB,0)} GB`);
  else if(self!=null) parts.push(`this folder ${gbs(self)}`);
  if(t1s>=0.05) parts.push(`<b style="color:rgb(var(--t1))">${fmt(t1s,1)} GB reclaim-now here</b>`);
  if(t2s>=0.05) parts.push(`<b style="color:rgb(var(--t2))">${fmt(t2s,1)} GB behind decisions</b>`);
  parts.push('click a tile to descend');
  const foot=$('#tfoot'); if(foot) foot.innerHTML=parts.join(' &nbsp;·&nbsp; ');
  if(src==='mft') paintSubs(tm,rects,tips,volGB,seq);
}
/* Second level: subdivide each big tile by its largest children — a real treemap, not one flat
   level per click. MFT lookups are ~30 ms so the fan-out is cheap; the walker never nests. */
async function paintSubs(tm,rects,tips,volGB,seq){
  const targets=rects.map((r,i)=>({r,i})).filter(o=>o.r.it.x.kind==='dir'&&o.r.w>=120&&o.r.h>=78);
  await Promise.all(targets.map(async o=>{
    let m; try{ m=await (await fetch('/api/mft?path='+encodeURIComponent(o.r.it.x.path))).json(); }catch{ return; }
    if(seq!==loadSeq||!m||m.none||!m.kids) return;
    const pg=o.r.it.x.gb||1;
    // A single dominant child (Users -> the account folder at 97%) subdivides into one giant blank box - no
    // information. Skip through such chains and show the level where the split actually happens.
    let prefix='';
    for(let hop=0;hop<2;hop++){
      const ks=(m.kids||[]).filter(k=>k.gb>Math.max(0.03,pg*0.02));
      if(!ks.length||ks[0].gb<0.75*pg) break;   // dominance is share, not sibling count — smaller
                                                // siblings fold into the filler, which stays honest
      let m2=null; try{ m2=await (await fetch('/api/mft?path='+encodeURIComponent(ks[0].path))).json(); }catch{}
      if(!m2||m2.none||!m2.kids||!m2.kids.length) break;
      prefix+=ks[0].name+' › '; m=m2;
    }
    if(seq!==loadSeq) return;
    const node=tm.querySelector(`.tnode[data-i="${o.i}"]`); if(!node) return;
    const kids=m.kids.filter(k=>k.gb>Math.max(0.03,pg*0.02)).slice(0,6);
    if(kids.length<2) return;                              // one child subdividing is no information
    const w=Math.max(0,o.r.w-3), h=Math.max(0,o.r.h-3), top=38, pad=4;
    const iw=w-pad*2, ih=h-top-pad; if(iw<44||ih<26) return;
    const subItems=kids.map(k=>({v:k.gb,k}));
    const known=kids.reduce((s,k)=>s+k.gb,0), fillV=Math.max(0,pg-known);
    if(fillV>0.02) subItems.push({v:fillV,k:null});        // filler keeps child areas honest vs the parent
    node.insertAdjacentHTML('beforeend', layoutTreemap(subItems,iw,ih).map(sr=>{
      const k=sr.it.k, sw=Math.max(0,sr.w-2), sh=Math.max(0,sr.h-2);
      if(sw<8||sh<7) return '';
      const pos=`left:${pad+sr.x+1}px;top:${top+sr.y+1}px;width:${sw}px;height:${sh}px`;
      if(!k) return `<div class="tsub fill" style="${pos};--tc:var(--tn)"></div>`;
      const tier=tierOf(k.path), ti=tips.length, label=prefix+k.name;
      tips.push({name:label,path:k.path,gb:k.gb,pl:null,pv:k.gb/volGB,tier,kind:'dir'});
      const showN=sw>50&&sh>17, showG=sw>50&&sh>30;
      return `<div class="tsub" data-t="${ti}" data-f="${k.path.replace(/"/g,'&quot;')}"
        style="${pos};--tc:var(${TIER_META[tier].c});--ta:${(.12+(k.gb/pg)*.25).toFixed(3)}">
        ${showN?`<div class="tsn">${label}</div>`:''}${showG?`<div class="tsg">${gbs(k.gb)}</div>`:''}
      </div>`;
    }).join(''));
    // clicking a child jumps straight down; EVERY intermediate hop lands in the breadcrumb so
    // climbing back out one level at a time still works
    $$('.tsub[data-f]',node).forEach(s=>s.onclick=e=>{ e.stopPropagation();
      let acc=node.dataset.f.replace(/\\$/,'');
      crumb.push({name:node.dataset.n,full:acc});
      for(const seg of s.dataset.f.slice(acc.length).split('\\').filter(Boolean)){
        acc+='\\'+seg; crumb.push({name:seg,full:acc}); }
      paintCrumb(); loadDirs(); });
  }));
}
/* the hover card — one fixed element, fed by the flat tip store via data-t */
function wireTips(tm,tips,volId){
  let t=$('#ttip');
  if(!t){ t=document.createElement('div'); t.id='ttip'; document.body.appendChild(t); }
  tm.addEventListener('mouseover',e=>{
    const n=e.target.closest('[data-t]');
    if(!n||!tm.contains(n)){ t.classList.remove('on'); return; }
    const d=tips[+n.dataset.t]; if(!d){ t.classList.remove('on'); return; }
    const v=d.kind==='free'?{c:'--tn',say:'Unused capacity — the number this page exists to grow.'}
      :d.kind==='unm'?{c:'--t4',say:'Space no file accounts for: VSS shadow copies, $MFT, $LogFile, NTFS metadata. Reclaim via System Protection or vssadmin, never by deleting.'}
      :d.kind==='rest'?{c:'--tn',say:'Aggregate of the small tail — descend a level to see them individually.'}
      :d.kind==='loose'?{c:TIER_META[d.tier].c,say:d.tier===2?'Files sitting directly at the root — dominated by pagefile.sys and hiberfil.sys, which are policy, not garbage (playbook §2.7).':'Files directly in this folder rather than in a subfolder.'}
      :{c:TIER_META[d.tier].c,say:TIER_META[d.tier].say};
    t.innerHTML=`<b>${d.name}</b>${d.path?`<div class="tp">${d.path}</div>`:''}
      <div class="tr">${gbs(d.gb)}${d.pl!=null?` · ${pcs(d.pl)} of this level`:''}${d.pv!=null?` · ${pcs(d.pv)} of ${volId}`:''}</div>
      <div class="tt"><i style="background:rgb(var(${v.c}))"></i><span>${v.say}</span></div>`;
    t.classList.add('on');
  });
  tm.addEventListener('mousemove',e=>{
    t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8)+'px';
    t.style.top=Math.min(e.clientY+16,innerHeight-t.offsetHeight-8)+'px';
  });
  tm.addEventListener('mouseleave',()=>t.classList.remove('on'));
}

/* ---- reclaim ---- */
RENDER.clean=async()=>{
  const el=$('#p-clean');
  let list=[];
  try{ list=await (await fetch('/api/reclaim')).json(); }catch(e){ el.innerHTML=`<div class="empty">scan failed: ${e.message}</div>`; return; }
  const t1=list.filter(x=>x.tier===1), t2=list.filter(x=>x.tier!==1);
  // Paint the skeleton first, then let each row resolve on its own. The Recycle Bin and update
  // cache take tens of seconds to walk; the fast rows should not wait behind them.
  // One line per item: name · tag · path (ellipsized) · size · button, with the proportional
  // magnitude as a fill BEHIND the row — the old two-line rows plus separate bar were 3x taller.
  const crow=x=>{ const t1f=x.tier===1;
    return `<div class="crow" data-row="${x.key}">
      <i class="rfill" data-bar style="background:var(--${t1f?'ok':'warn'})"></i>
      <b class="cn">${x.name}</b> <span class="tag ${t1f?'t1':'t2'}">${t1f?'safe':'decide'}</span>
      <span class="pth" data-path>—</span>
      <span class="sz" data-gb><span class="spin"></span></span>
      ${t1f?`<button class="btn go c" data-k="${x.key}" disabled>Clear</button>`:''}
    </div>`; };
  el.innerHTML=`
    <div class="hd"><h2>Reclaim</h2></div>
    <div class="hero" style="grid-template-columns:1fr">
      <div class="hstat" style="--acc:var(--ok)">
        <div class="hl"><i></i>Recoverable with zero risk</div>
        <div class="hv"><span id="rcBig"><span class="spin"></span></span><small>GB</small></div>
        <div class="hs" id="rcHs">measuring every cache concurrently — slow rows land when they land…</div>
        <div class="seg" id="rcSeg" style="height:13px"></div>
        <div class="legend" id="rcLeg"></div>
      </div>
    </div>
    <div class="g2" style="grid-template-columns:1fr 1fr;margin-bottom:0">
      <div>
        <div class="card"><h3>Tier 1 — regenerable caches</h3>
          ${t1.map(crow).join('')}
          <div class="note">These rebuild themselves on next use. The worst case is one slower app launch. <b>If you cannot articulate what would be permanently lost, it is Tier 1.</b></div>
        </div>
        <div class="card" style="margin-bottom:0"><h3>Needs an admin prompt</h3>
          <div class="note">Not exposed as buttons because this bridge runs unelevated by design — a background service that can elevate is a liability.<br><br>
          <b>Component store</b> (typically 2–5 GB): <code>Dism.exe /Online /Cleanup-Image /StartComponentCleanup</code><br>
          <b>Disk Cleanup</b> (system files): <code>cleanmgr /sageset:1</code><br>
          <b>WSL disk compaction</b> — see the playbook, §2.5. Virtual disks grow but never shrink on their own.</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:0"><h3>Tier 2 — your call, not a button</h3>
        ${t2.map(crow).join('')}
        <div class="note">
          <b>Recycle Bin</b> — deliberately has no button here. Emptying it permanently destroys files, and that belongs behind Explorer's own confirmation, not a dashboard click. Open it, look, then empty it yourself.<br>
          <b>hiberfil.sys</b> — reclaim with <code>powercfg /h off</code> from an admin prompt if you never hibernate.<br>
          <b>pagefile.sys</b> — cap it via <code>sysdm.cpl</code> → Advanced → Performance → Virtual memory. Do this only <i>after</i> freeing space; a small pagefile on a RAM-starved machine causes crashes.
        </div>
      </div>
    </div>`;
  // Fire every size request concurrently; each row updates the moment its own answer arrives, and
  // the hero (total, stacked segments, row bars) recomposes on every arrival.
  const sizes={};
  function paintHero(){
    const known=list.filter(x=>typeof sizes[x.key]==='number');
    const t1s=known.filter(x=>x.tier===1).reduce((s,x)=>s+sizes[x.key],0);
    const t2s=known.filter(x=>x.tier!==1).reduce((s,x)=>s+sizes[x.key],0);
    const tot=t1s+t2s;
    $('#rcBig').textContent=fmt(t1s,2);
    const c=sysVol(S.tick);
    $('#rcHs').innerHTML=(known.length<list.length?`<span class="spin"></span> still measuring · `:'')
      +(c?`C: has <b>${fmt(c.freeGB,0)} GB</b> free now — clearing tier 1 makes it <b>${fmt(c.freeGB+t1s,0)} GB</b>; tier-2 decisions could take it to <b>${fmt(c.freeGB+tot,0)} GB</b>`
          :`plus ${fmt(t2s,2)} GB behind tier-2 decisions`);
    const segs=known.filter(x=>sizes[x.key]>=0.01)
      .sort((a,b)=>(a.tier===1?0:1)-(b.tier===1?0:1) || sizes[b.key]-sizes[a.key]);
    const mx=Math.max(tot,0.01);
    let gi=0, ai=0;
    segs.forEach(x=>{ x._c=x.tier===1?`rgba(var(--ok-r),${(.9-0.16*gi++).toFixed(2)})`:`rgba(var(--warn-r),${(.85-0.1*ai++).toFixed(2)})`; });
    $('#rcSeg').innerHTML=segs.map(x=>`<i style="width:${sizes[x.key]/mx*100}%;background:${x._c}"></i>`).join('');
    $('#rcLeg').innerHTML=segs.map(x=>`<span><i style="background:${x._c}"></i>${x.name} ${fmt(sizes[x.key],sizes[x.key]>=10?1:2)} GB</span>`).join('');
    // row bars: proportional to the biggest single item
    const rmx=Math.max(...known.map(x=>sizes[x.key]),0.01);
    known.forEach(x=>{ const r=$(`#p-clean [data-row="${x.key}"] [data-bar]`);
      if(r) r.style.width=(sizes[x.key]/rmx*100)+'%'; });
  }
  list.forEach(async x=>{
    let d;
    try{ d=await (await fetch('/api/reclaim?key='+encodeURIComponent(x.key))).json(); }
    catch(e){ d={gb:null}; }
    const row=$(`#p-clean [data-row="${x.key}"]`); if(!row) return;
    const gb=(d&&typeof d.gb==='number')?d.gb:null;
    $('[data-gb]',row).textContent = gb===null?'—':fmt(gb,2)+' GB';
    if(d&&d.path) $('[data-path]',row).textContent=d.path;
    const btn=$('.btn.c',row);
    if(btn&&gb!==null&&gb>=0.01) btn.disabled=false;
    if(gb!==null) sizes[x.key]=gb;
    paintHero();
  });

  /* Reports what ACTUALLY happened (2026-07-30). The owner cleared the update cache, nothing was
     deleted, and this said "Freed -0.02 GB" as though that were a result. Two causes, both fixed on the
     bridge: the delete was unelevated against C:\Windows (denied on every file) and the handler
     hard-coded success. Here the change is refusing to dress up a null result: an error is an error, a
     zero with denials says so, and the paths that need admin say a prompt is coming. */
  const NEEDS_ADMIN=new Set(['wintemp','winupdate','winre','thumbs']);
  $$('#p-clean .btn.c').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.k, adm=NEEDS_ADMIN.has(k);
    if(!confirm(`Clear ${k}?\n\n`+
      (adm?'This path is owned by Windows, so it runs as a one-shot admin task and you will get a UAC prompt. Nothing is deleted if you decline.\n\n':'')+
      'Files currently open are skipped, and the count of anything refused is reported back.')) return;
    b.disabled=true; b.textContent=adm?'UAC…':'…';
    try{
      const r=await (await fetch('/api/clean',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})})).json();
      if(r.error) throw new Error(r.error);
      const freed=+r.freedGB||0;
      if(freed<=0.005){
        /* Counts, not a verdict. "needs admin rights" for one denied file out of nineteen overstates
           it; "16 in use, 1 needs admin" is the same information without the exaggeration. */
        const bits=[];
        if(r.entriesLocked) bits.push(`${r.entriesLocked} in use`);
        if(r.entriesDenied) bits.push(`${r.entriesDenied} needs admin`);
        toast(bits.length ? `Nothing more to free · ${bits.join(', ')}` : `Already empty · nothing to free`);
      } else {
        toast(`Freed ${fmt(freed,2)} GB`
          + (r.entriesDenied?` · ${r.entriesDenied} denied`:'')
          + (r.entriesLocked?` · ${r.entriesLocked} in use, skipped`:'')
          + (r.leftGB>0.01?` · ${fmt(r.leftGB,2)} GB still there`:'')
          + (r.servicesStopped&&r.servicesStopped.length?` · restarted ${r.servicesStopped.join(', ')}`:''));
      }
      RENDER.clean();
    }
    catch(e){ toast('Failed: '+e.message); }
    finally{ b.disabled=false; b.textContent='Clear'; }
  });
};

  /* One page, two vocabularies: the Windows kinds and the macOS kinds coexist here because rows
     arrive with a `kind` and empty groups render nothing - so each platform sees only its own.
     A mac kind missing from this map would be silently counted in the total yet drawn nowhere,
     which is how a scan looks like it lost entries. */
  const groups={run:'Registry Run keys',folder:'Startup folders',task:'Scheduled tasks',service:'Auto-start services',
                agent:'Launch agents',daemon:'Launch daemons',login:'Login items'};
  const gcol={run:'--cpu',folder:'--mem',task:'--net',service:'--disk',
              agent:'--cpu',daemon:'--disk',login:'--mem'};

  const paint=CAP=>{ el.innerHTML=`
    <div class="hd"><h2>Startup</h2></div>
    <div class="hero" style="grid-template-columns:1fr">
      <div class="hstat" style="--acc:var(--warn)">

        <div class="legend">${counts.map(g=>`<span><i style="background:var(${gcol[g.k]})"></i>${groups[g.k]} · ${g.n}</span>`).join('')}</div>
        <div class="hs" style="margin-top:8px">Every one of these runs before you do anything. Most earn nothing at boot — updaters, sync helpers and launchers can all start when first used instead.</div>
      </div>
    </div>
    ${sus.length?`<div class="find critical" style="padding:11px 15px 10px 18px">
      <span class="fmeta"><span class="tag crit">verify first</span></span>
      <h4 style="margin-bottom:4px">Autostart from a throwaway folder</h4>
      ${sus.map(x=>`<div style="font-size:11.5px"><b>${x.name}</b> <span class="muted" style="font-size:10.5px;word-break:break-all">· ${x.cmd}</span></div>`).join('')}
      <div class="why" style="margin-top:6px">${(S.caps&&S.caps.platform)==='darwin'
        ?`<b>/tmp</b>, <b>Downloads</b> and <b>/Users/Shared</b> are world-writable or routinely wiped, so legitimate software never installs there — it is the most common place malware hides persistence. Verify before assuming the worst: <code>codesign -dv --verbose=2 '&lt;path&gt;'</code> — a valid signature from the expected developer means stale, not hostile; remove the entry and move on.`
        :(S.caps&&S.caps.platform)==='linux'
        ?`<b>/tmp</b> and <b>Downloads</b> are world-writable or routinely wiped, so packaged software never runs from there — it is the most common place malware hides persistence. Verify before assuming the worst: <code>dpkg -S '&lt;path&gt;'</code> (or <code>rpm -qf</code>) — a file owned by an installed package means stale, not hostile; remove the entry and move on.`
        :`<b>Temp</b>, <b>Downloads</b> and <b>Public</b> are world-writable and get wiped, so legitimate software never installs there — it is the most common place malware hides persistence. Verify before assuming the worst: <code>Get-AuthenticodeSignature '&lt;path&gt;' | Select Status, SignerCertificate</code> — a valid signature from the expected publisher means stale, not hostile; remove the entry and move on.`}</div>
    </div>`:''}
    ${(()=>{ const gcards=Object.entries(groups).map(([k,title])=>{
      const rows=list.filter(x=>x.kind===k); if(!rows.length) return '';

        ${rows.map((x,i)=>`<div class="brow${i>=CAP?' xtra':''}" title="${String(x.cmd||x.name).replace(/"/g,'&quot;')}">
          <i class="st${x.state==='enabled'?' on':''}" title="${x.state}"></i>
          <span class="bn"><b>${x.name}</b>${x.cmd?` · ${String(x.cmd)}`:''}</span>
          ${k==='task'?`<button class="btn tg" data-n="${x.name.replace(/"/g,'&quot;')}" data-e="${x.state==='enabled'?0:1}">${x.state==='enabled'?'Disable':'Enable'}</button>`:''}
        </div>`).join('')}

    }).filter(Boolean);

    <div class="card" style="margin-bottom:0"><div class="note" style="margin-top:0">
      <b>Judging an entry:</b> don't use the app → uninstall it, not just the entry · need it <i>before</i> you open it? updaters, sync helpers and launchers almost never qualify · telemetry, surveys and "experience" services are always safe · a wrong-looking path → verify as above.
      Hover a scheduled task to toggle it. Services need an admin prompt — <code>Set-Service -Name X -StartupType Manual</code> (prefer <b>Manual</b> over Disabled); Run keys are easiest in Task Manager → Startup apps or Sysinternals <b>Autoruns</b>.
    </div></div>`; };
  /* The no-scroll invariant is a hard acceptance test, and this page's height is DATA-DEPENDENT
     (entry count, wraps in the hero legend, presence of the suspicious card). A fixed row cap
     cannot guarantee the fit, so paint → measure → shrink until it holds, for any content. */
  let CAP=12; paint(CAP);
  while(CAP>4 && el.clientHeight && el.scrollHeight>el.clientHeight){ CAP--; paint(CAP); }
  $$('#p-boot .brow.xm').forEach(m=>m.onclick=()=>m.closest('.card').classList.add('xp'));
  $$('#p-boot .btn.tg').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ const r=await (await fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:b.dataset.n,enable:b.dataset.e==='1'})})).json();
      toast(r.ok?`${b.dataset.e==='1'?'Enabled':'Disabled'} ${b.dataset.n}`:`Failed — ${r.err||'needs admin'}`); RENDER.boot(); }
    catch(e){ toast('Failed: '+e.message); b.disabled=false; }
  });
};

/* ============ stream ============ */
/* Seed the hour of history the bridge already holds, so the memory rings and charts have real
   depth from the first frame instead of growing from nothing. PREPENDED — live ticks may already
   have landed by the time this returns, and they are newer than everything in the seed. */
async function seedHist(){
  try{
    const r=await (await fetch('/api/recent?n='+HIST)).json();
    if(!Array.isArray(r)||!r.length) return;
    const map={cpu:'cpu',mem:'mem',diskBusy:'disk',diskPct:'diskpct',gpu:'gpu',hardFaults:'flt',net:'net'};
    const seed={}; for(const k in map) seed[map[k]]=[];
    for(const row of r) for(const k in map) seed[map[k]].push(typeof row[k]==='number'?row[k]:0);
    for(const k in seed) S.hist[k]=seed[k].concat(S.hist[k]).slice(-HIST);
    if(window.__vitalsBake) window.__vitalsBake();
  }catch{}
}
function connect(){
  const es=new EventSource('/api/stream');
  es.addEventListener('static',e=>{
    S.static=JSON.parse(e.data);
    /* Capabilities ride in on the static event, before any tick, so the page never renders a gauge
       for something this host cannot measure and then yanks it away a second later. */
    if(S.static.caps){
      const first=!S.caps; S.caps=S.static.caps;
      /* The tiles were built before any of this arrived, from the optimistic all-true default. Once
         the host's real capabilities land, rebuild once so anything it cannot measure disappears
         rather than sitting there forever waiting for a number that will never come. */
      if(first&&S.caps.missing&&S.caps.missing.length){ try{ buildTiles(); buildCompact(); }catch{} }
    }
    $('#mach').textContent=S.static.host;
    $('#osl').textContent=S.static.os||'';
    $('#dot').classList.add('live');
    { const lt=$('#lnkTip'); if(lt) lt.textContent='stream: live'; }
    document.body.classList.toggle('no-gpu',!can('gpu.total'));
    document.body.classList.toggle('no-percore',!can('cpu.perCore'));
    document.body.classList.toggle('unverified-host',S.caps&&S.caps.verified===false);
    /* The mode rides in on the SAME manifest the feature gating reads, so the badge cannot disagree
       with what the buttons do - both are downstream of the bridge's one answer. */
    document.body.classList.toggle('viewer-mode',!!(S.caps&&S.caps.mode==='viewer'));
  });
  es.addEventListener('tick',e=>{
    S.tick=JSON.parse(e.data);
    const t=S.tick;
    const cvol=sysVol(t);
    push('cpu',t.cpu.total); push('mem',t.mem.pct);
    push('disk',t.disk.io.busyPct); push('diskpct',cvol?cvol.pct:0);   // null is stored as null; the chart skips it
    push('net',t.net.rxMBs+t.net.txMBs);
    push('gpu',t.gpus?t.gpus.max:(t.gpu?t.gpu.util:0));   // busiest of BOTH adapters, not just NVIDIA
    push('flt',t.mem.pagesSec||0); push('rx',t.net.rxMBs||0); push('tx',t.net.txMBs||0);
    /* Sampled from the TICK, not a timer of its own: the stopwatch's record then shares the collector's
       real cadence instead of drifting against it, and "n samples" means the same thing everywhere. */
    swSample(t);
    watchTick(t);          // watches are judged on the tick, like everything else that claims "sustained"
    // measured tick cadence (EMA) — every "how much time do these samples span" label uses this.
    // Clamped: the first ticks after connect can arrive back-to-back (SSE flush), and one 0.1 s
    // gap seeding the EMA understated the span label by half until it converged.
    const now=performance.now();
    if(S._lt){ const dt=(now-S._lt)/1000;
      if(dt>0.3&&dt<5) S.tickDt=(S.tickDt||dt)*.9+dt*.1; }
    S._lt=now;
    if(window.__vitalsBake) window.__vitalsBake();
    $('#upl').textContent='up '+fmt(t.up,1)+'h';

    // System pressure: the worst of the four, so one number can't hide a single failing resource.
    const c=sysVol(t);
    /* PRESSURE is the worst of the measurable dimensions. A null must not participate - Math.max
       with null coerces it to 0, which is harmless here, but an unmeasurable dimension should not
       be able to LOWER the reading either, so it is filtered out entirely. */
    const p=Math.max(...[t.cpu.total, t.mem.pct, c?c.pct:null, t.disk.io.busyPct].filter(x=>x!=null));
    ease.press=p;
    const bar=$('#pbar i'); bar.style.width=clamp(p,0,100)+'%';
    bar.style.background=p>88?'var(--crit)':p>72?'var(--warn)':'var(--ok)';
    $('#pnum').textContent=Math.round(p)+'%';

    try{ sysTick(t); }catch{}                            // SYS journal detector — cheap, every tick
    /* FOOTPRINT accounting — a few adds per tick, runs in every mode so the per-mode ledger and
       the self history are truthful about time the page wasn't even open. */
    if(t.self&&typeof t.self.cpu==='number'){
      push('selfcpu',t.self.cpu);
      const mk=(typeof mode!=='undefined'&&mode)?mode:'panel';
      const r=S.selfModes[mk]||(S.selfModes[mk]={ema:t.self.cpu,emam:t.self.mb||0,secs:0});
      r.ema=r.ema*.95+t.self.cpu*.05; r.emam=r.emam*.95+(t.self.mb||0)*.05; r.secs+=(S.tickDt||1);
    }
    if(mode!=='panel') paintCompact();                   // docked: only the strip is visible
    else if(S.view==='ov') paintTiles();
    else if(['cpu','mem','net','therm'].includes(S.view)) RENDER[S.view]&&RENDER[S.view]();
    else if(S.view==='sys'){ paintSysHead(t); paintSysRaw(); }
    else if(S.view==='self'){ try{ paintSelf(t); }catch{} }
    else if(S.view==='rig'){ try{ paintRig(t); }catch{} }
    else if(S.view==='ctl'){ try{ paintCtlLive(t); }catch{} }
  });
  // Dock commands relayed from the bridge (see /api/panel/mode). Only the page can reach the host,
  // so it forwards them on.
  es.addEventListener('panelmode',e=>{
    try{ const m=JSON.parse(e.data).mode; if(HOST) send('mode:'+m); else setMode(m); }catch{}

/* ---- display watchdog (2026-07-29) ----
   The worst failure mode of a 24/7 instrument is a display that froze and still looks fine.
   Every 5 s: (1) any new draw errors are surfaced in the journal — the loops already survive
   them, but silent survival is still silence; (2) both rAF heartbeats must have advanced (they
   advance even when frames are skipped — only a dead chain stalls the counter). A dead chain is
   declared in the journal, confessed on-screen (#stallChip), and re-armed. Re-arming only fires
   on a PROVEN-dead chain, so it can never double-schedule a live loop. */
const WD={ring:0,field:0,rerr:0,ferr:0,re:0,stalled:false};
function stallChip(on){
  WD.stalled=on;

setInterval(()=>{

  if(el) el.textContent=String(__VB.ringErrs+__VB.fldErrs)+(WD.re?' · rearmed ×'+WD.re:'');
  /* A1 bad-boot heal (2026-07-31): a page that booted while the window reported ~0x0 latched a

     skipping (hidden, docked, fps 0) never heals it. Repair, then SAY SO — same rule as the
     blank-core guard below. Runs before the hidden check on purpose: painting works while
     hidden, and healing there means the reveal shows a real frame instead of a black one. */

     turning. This asks whether anything reached the canvas: overview showing, not docked, canvas has a
     real box, yet no stroke in over four seconds. Repair, then SAY SO - a silent self-heal would hide
     the very thing worth knowing. */
  try{
    if(S.view==='ov' && !document.body.classList.contains('docked') && window.__vitalsCoreState){

const sysEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sysHms=d=>d.toTimeString().slice(0,8);
/* ---- the journal now persists (2026-07-29) ----
 * It was the most useful log in the product and the only one thrown away: 400 entries in page memory,
 * gone on every reload, dock and close. So the finest-grained record - the individual crossings under
 * a finding - could never be read after the fact. Now every line is also appended to
 * history/journal-YYYY-MM-DD.jsonl server-side, and the console BACKFILLS from disk on load, so the
 * console shows a continuous record across reloads instead of restarting at zero.
 * BATCHED on purpose: a burst of eight crossings in one tick is one request, not eight. Flushed on a
 * 2.5 s timer, when 25 entries pile up, and on pagehide so the tail is never lost. */
let JQ=[], jqTimer=null;
function jqFlush(sync){
  if(!JQ.length) return;
  const batch=JQ.splice(0,200);
  const body=JSON.stringify({entries:batch});
  try{
    if(sync&&navigator.sendBeacon) navigator.sendBeacon('/api/journal',new Blob([body],{type:'application/json'}));
    else fetch('/api/journal',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:!!sync})
           .catch(()=>{});                      // a dropped line must never break the console
  }catch{}
}
function jqPush(e){
  JQ.push(e);
  if(JQ.length>=25) return jqFlush();
  if(!jqTimer) jqTimer=setTimeout(()=>{ jqTimer=null; jqFlush(); },2500);
}
addEventListener('pagehide',()=>jqFlush(true));
addEventListener('beforeunload',()=>jqFlush(true));
/* Backfill once, before any live line arrives, so the console opens on a real history. Entries from
   disk are marked so the reader can tell what this session saw from what was recovered. */
let jqBackfilled=false;
async function jqBackfill(){
  if(jqBackfilled) return; jqBackfilled=true;
  try{
    const r=await (await fetch('/api/journal?days=2&limit=400')).json();
    const rows=(r.entries||[]).map(e=>({at:new Date(e.at),sev:e.sev,kind:e.kind,msg:e.msg,disk:true}));
    if(!rows.length) return;
    const seen=new Set(SYS.log.map(e=>+e.at+'|'+e.msg));
    SYS.log=[...SYS.log,...rows.filter(e=>!seen.has(+e.at+'|'+e.msg))]
      .sort((a,b)=>b.at-a.at).slice(0,400);

  }catch{}
}
function sysPush(sev,kind,msg){
  SYS.log.unshift({at:new Date(),sev,kind,msg}); SYS.n++;

  jqPush({at:Date.now(),sev,kind,msg});
  if(S.view==='sys') paintSysLog();
  /* the FX bus rides the journal and ONLY the journal: an effect can fire only when a measured
     line was just written. If it didn't get written, it cannot flash. */
  try{ if(window.__fxBus) __fxBus(sev,kind,msg); }catch{}

function sysTick(t){
  const now=Date.now();
  if(SYS.lastAt && now-SYS.lastAt>4000)
    sysPush('warn','stream',`collector gap ${((now-SYS.lastAt)/1000).toFixed(1)}s — ticks resumed`);
  SYS.lastAt=now;
  const cvol=sysVol(t);
  /* enter-high / exit-low hysteresis so a value dancing on the line can't spam the journal */
  const TH=[
    ['cpu',  t.cpu.total,        ALERTS.cpu[0], ALERTS.cpu[1], 'cpu total','%'],
    ['mem',  t.mem.pct,          ALERTS.mem[0], ALERTS.mem[1], 'ram','%'],
    ['dq',   t.disk.io.queue,    ALERTS.dq[0],  ALERTS.dq[1],  'disk queue',''],
    ['flt',  t.mem.pagesSec||0,  ALERTS.flt[0], ALERTS.flt[1], 'hard faults','/s'],
    ['dfree',cvol?100-cvol.pct:100, -1, -1, '',''],   // handled below (inverted sense)
  ];

    if(k==='dfree'||v==null) continue;
    const on=!!SYS.th[k];
    if(!on && v>=hi){ SYS.th[k]=true; sysPush('warn','thres',`${label} ${+v.toFixed(1)}${unit} — crossed ${hi}${unit}`); }

/* The journal renders its WHOLE retained history (400 entries) and scrolls (2026-07-29). It used to
   render only the rows that fit the box, which is why it looked like it "isn't allowing scroll": there

   monotonic counter), and preserve scrollTop so a new event never yanks the view back to the top while

/* ============ FOOTPRINT — the instrument audits itself ============

  if(!sf){
    g('sfCpu').textContent=NOVAL; g('sfMb').textContent=NOVAL;
    g('sfVerdict').innerHTML='<em>·</em>self-attribution is not implemented on this platform';
    g('sfCtx').textContent='On Windows this rides the per-process counter read each tick already '+
      'performs, so it costs nothing extra. The other collectors have no equivalent yet, and a '+
      'fabricated 0% here would be exactly the kind of measured-looking lie this page exists to avoid.';
    g('sfAnat').innerHTML=''; g('sfSparkLab').textContent='';

  }
  const comps=sf.comps||[];
  let medC=0,ownC=0,medM=0,ownM=0,medN=0,ownN=0;
  for(const c of comps){ const own=SELF_META[c.k]?SELF_META[c.k][2]:1;

  let sev='',em='QUIET',msg=`running below notice — ${avg.toFixed(1)}% of this machine's compute over the last ${secs}s, ${ramPct.toFixed(1)}% of its memory.`;

  else if(avg>=5){sev='warn';em='WORKING';msg=`${avg.toFixed(1)}% of the machine over the last ${secs}s, and ${domShare}% of it is ${domName}. Worth a lever if this holds.`;}

  };

  const own=comps.filter(c=>SELF_META[c.k]&&SELF_META[c.k][2]);
  g('sfAnat').innerHTML=
    `<div class="sfg"><div class="sfg-h">the medium · chromium renders the window<b>${medN} procs · ${medC.toFixed(2)}% · ${fmt(medM)} MB</b></div>${med.map(row).join('')}</div>`+
    `<div class="sfg"><div class="sfg-h">the instrument · vitals' own code<b>${ownN} procs · ${ownC.toFixed(2)}% · ${fmt(ownM)} MB</b></div>${own.map(row).join('')}</div>`+
    `<div class="sfx-leg">row glow = share of self cpu · baseline tick = share of self memory · accent rows are ours, ink rows are chromium's</div>`;
  const cvs=g('sfSpark');
  if(cvs){ const a2=cssv('--acc2'); sparkline(cvs,S.hist.selfcpu,`rgba(${a2},.30)`,`rgba(${a2},.85)`); }
  const n=S.hist.selfcpu.length, span=Math.max(1,Math.round(n*(S.tickDt||1.08)/60));
  const pk=n?Math.max.apply(null,S.hist.selfcpu):0;
  g('sfSparkLab').innerHTML=`self cpu · ${n>60?span+' min':n+' samples'} · peak ${pk.toFixed(1)}%<br>accounted in every mode, even while this page is closed`;
  g('sfModes').innerHTML=Object.keys(MODE_LABEL).map(k=>{
    const r=S.selfModes[k];
    if(!r||r.secs<10) return `<div class="sfm"><b>${MODE_LABEL[k]}</b><span>not yet observed</span></div>`;

}
