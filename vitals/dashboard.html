.sfx-say small{font-size:16px;color:var(--ink-3);font-weight:400;letter-spacing:.02em;margin:0 20px 0 7px}
.sfx-verdict{margin-top:12px;font-size:14.5px;color:var(--ink);max-width:600px;line-height:1.5}
.sfx-verdict em{font-style:normal;color:var(--vc);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-right:9px}
.sfx-ctx{margin-top:6px;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sfg{margin-top:18px}
.sfg-h{display:flex;align-items:baseline;gap:10px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 8px 5px;border-bottom:1px solid var(--line-2)}
.sfg-h b{font-size:11.5px;letter-spacing:0;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;margin-left:auto}
.sfr{position:relative;display:flex;align-items:center;gap:10px;height:24px;padding:0 8px;overflow:hidden}
.sfr .fill{position:absolute;left:0;top:1px;bottom:2px;background:rgba(var(--fg),.045);z-index:0;border-radius:1px}
.sfr.own .fill{background:rgba(var(--acc2),.10)}
.sfr .mbb{position:absolute;left:0;bottom:0;height:2px;background:rgba(var(--fg),.13);z-index:0}
.sfr.own .mbb{background:rgba(var(--acc2),.38)}
.sfr>span{position:relative;z-index:1}
.sfr .nm{font-size:11.5px;color:var(--ink);width:132px;flex:none}
.sfr .rl2{font-size:9.5px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfr .np{font-size:9.5px;color:var(--ink-3);width:24px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.sfr .cvv{font-family:var(--disp);font-size:15px;font-weight:350;color:var(--ink);width:78px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.sfr .cvv small,.sfr .mvv small{font-size:9px;color:var(--ink-3);margin-left:2px}
.sfr .mvv{font-size:12px;color:var(--ink-2);width:86px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.sfx-sprow{display:flex;align-items:flex-end;gap:16px;margin-top:auto;padding-top:14px}
.sfx-sprow canvas{flex:1;min-width:0;height:46px}
.sfx-sprow span{flex:none;max-width:300px}
.sfx-sprow span{font-size:10px;color:var(--ink-3);line-height:1.5;padding-bottom:2px}
/* The rail is three different things stacked, so it is three regions, not one scroller (2026-07-29,
   owner: "make cost by mode fixed since it doesnt change and make fixed with receipts and levers
   independently scrollable"). Cost-by-mode is a short live readout that never grows — pinned, always
   visible, never scrolls away. Receipts and levers are append-only prose that WILL keep growing, so
   each gets its own scroll and neither can push the other out of view. Each region keeps its section
   label pinned above it. */
.sfx-rail{width:322px;flex:none;border-left:1px solid var(--line-2);padding:2px 0 2px 24px;align-self:stretch;
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sfx-rail>.rl{flex:none}
.sfx-fix{flex:none}                                   /* cost by mode — pinned, it does not grow */
.sfx-scr{flex:1 1 0;min-height:56px;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.sfx-scr::-webkit-scrollbar{width:0;height:0}
.sfx-rail .rl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 10px}
.sfx-rail .rl:not(:first-child){margin-top:16px}
.sfm{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--ink-2);padding:2px 0;font-variant-numeric:tabular-nums}
.sfm b{color:var(--ink);font-weight:600;width:98px;flex:none;font-size:11px}
.sfm span{color:var(--ink-3);font-size:9.5px;margin-left:auto}
.sfl{position:relative;padding:0 0 0 14px;margin-bottom:11px}
.sfl::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:rgba(var(--acc2),.5)}
.sfl b{font-size:11.5px;font-weight:600;color:var(--ink);display:block;line-height:1.4}
.sfl span{font-size:10px;color:var(--ink-3);line-height:1.5;display:block;margin-top:2px}
.sfx-foot{margin-top:auto;padding:9px 0 8px;border-top:1px solid var(--line-2);font-size:10px;color:var(--ink-3);line-height:1.6;max-width:1080px;opacity:.85}
.sfx-foot b{color:var(--ink-2)}

/* ---- RIG + FX (2026-07-29): the owner's two surfaces — orchestration and play ----
   RIG: every control is a real lever with immediate effect, and every lever states its measured
   price (receipts = history/selfcost.jsonl work; no vibes). FX: the light & sound desk — LOOKS
   are CSS-var vectors over a base theme, the FIELD console drives the live shader, and the EVENT
   channels fire ONLY from the SYS journal: the bus IS the journal, so an effect can only ever
   mark a measured event. Both hairline-zoned, no cards (the SYS grammar). */
.xhead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;flex:none}
.xhead b{font-size:13px;letter-spacing:.3em;font-weight:600;color:var(--ink)}
.xhead .tag0{color:var(--ink-3);font-size:10px}
.xhead .xkpi{margin-left:auto;display:flex;gap:16px;font-size:9px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.xhead .xkpi b{color:var(--ink);font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;text-transform:none;font-size:10.5px}
#p-rig,#p-fx{display:flex;flex-direction:column;padding:14px 18px 10px}
.xgrid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0;align-content:start}
/* Each column owns its scroll (2026-07-29). The bug the owner saw as "content on top of content":
   .xgrid is flex:1 + min-height:0 inside a flex-column page, so it is squeezed below its content
   (measured 385 px box holding 447 px of dials) — and because overflow was VISIBLE, the surplus 62 px
   did not clip and did not scroll, it PAINTED OVER the section headers and cards that follow. A
   collision is the worst of the three outcomes and the only one that looks like a rendering bug.
   Scrolling per column also keeps the two lists independent, which is what they are. */
.xcol{min-width:0;display:flex;flex-direction:column;min-height:0;
  overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.xcol::-webkit-scrollbar{width:0;height:0}
/* FX is the densest surface — 6 live dials, 3 channel blocks, a bus readout and two method notes in
   two columns. With the columns clipping instead of colliding it stopped painting over itself, but it
   cut the Honesty note mid-word, which is the owner's "scroll weird" by another route. 10 px off each
   row's vertical padding recovers the 62 px the left column needed and the 43 px the right did, so at
   1080x720 nothing clips at all. The scroll stays as the guard for smaller windows. Scoped to #p-fx:
   .ctr is shared with RIG and CTRL, which already fit and are not touched. */
#p-fx .ctr,#p-fx .fxr{padding-top:3px;padding-bottom:3px}
#p-fx .syssec{margin:8px 0 3px}
#p-fx .fxnote{padding-top:5px;line-height:1.5}
.xcol.r{border-left:1px solid var(--line-2);padding-left:22px;margin-left:22px}
/* control rows */
.ctr{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line-2)}
.ctr .lbl{width:96px;flex:none;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700;line-height:1.3}
.ctr .lbl small{display:block;font-size:8.5px;letter-spacing:.02em;text-transform:none;color:var(--ink-3);font-weight:400;margin-top:1px}
/* flex:0 1 auto + min-width:0, NOT flex:none (2026-07-29). max-width:236px is a wrap hint, not a
   guarantee: with flex:none the price could not shrink below its content, so label(96) + gap + switch
   (up to 201) + gap + price(236) came to 559 px inside a 490 px column. The row overflowed by up to
   67 px and .xcol's own overflow clipped the sentence mid-word - the owner's "doesnt seem to wrap soon
   enough". A price is the most compressible thing in the row (it is prose, it reflows); the label and
   the switch are fixed geometry. So the price is the one that must be allowed to give. */
.ctr .price{margin-left:auto;text-align:right;font-size:9px;color:var(--ink-3);max-width:236px;line-height:1.45;flex:0 1 auto;min-width:0}
.ctr.off{opacity:.38;pointer-events:none}
/* segmented switch — the active key is INVERTED ink, which reads on both polarities
   (fg-alpha active fills are the documented paper-theme smudge trap, principle I2) */
.swg{display:flex;border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;flex:none}
.swg b{padding:4px 10px;font-size:9.5px;cursor:pointer;color:var(--ink-2);font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums;border-right:1px solid var(--line-2);transition:background .12s,color .12s}
.swg b:last-child{border-right:0}
.swg b:hover{background:rgba(var(--fg),.07);color:var(--ink)}
.swg b.on{background:var(--ink);color:var(--bg)}
/* dial sliders — blade thumb (the playhead's own geometry), filled track via --pct */
.dial{-webkit-appearance:none;appearance:none;flex:1;height:20px;background:transparent;cursor:pointer;min-width:70px}
.dial::-webkit-slider-runnable-track{height:2px;border-radius:1px;
  background:linear-gradient(90deg,var(--dc,var(--ink-2)) var(--pct,50%),rgba(var(--fg),.14) var(--pct,50%))}
.dial::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:15px;border-radius:1px;background:var(--ink);margin-top:-6.5px;box-shadow:0 0 7px rgba(var(--fg),.4)}
.ctr .dv{flex:none;width:48px;text-align:right;font-family:var(--disp);font-size:14px;font-weight:350;color:var(--ink);font-variant-numeric:tabular-nums}
.ctr .dv small{font-size:8.5px;color:var(--ink-3);margin-left:1px}
/* alert threshold rows */
.alr{display:flex;align-items:center;gap:8px;padding:6.5px 2px;border-bottom:1px solid var(--line-2)}
.alr .lbl{width:104px;flex:none;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.alr .now{width:74px;flex:none;font-family:var(--disp);font-size:15px;font-weight:350;color:var(--ink);font-variant-numeric:tabular-nums}
.alr .now small{font-size:8.5px;color:var(--ink-3)}
.alr input{width:56px;background:rgba(var(--fg),.05);border:1px solid var(--line);border-radius:var(--rc);
  color:var(--ink);font:600 11px ui-sans-serif,system-ui;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.alr input:focus{outline:0;border-color:rgba(var(--acc2),.5)}
.alr .sep2{font-size:8.5px;color:var(--ink-3);letter-spacing:.06em}
.alr .st2{margin-left:auto;flex:none;font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);width:52px;text-align:right;text-transform:uppercase;font-weight:700}
.alr .st2.hot{color:var(--warn)}
/* read-only truth rows */
.rkv{display:flex;justify-content:space-between;gap:10px;padding:3.5px 2px;font-size:10.5px;color:var(--ink-2)}
.rkv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
/* FX looks — swatches carry their own ground/ink inline: each previews a specific look */
.looks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:13px 0 4px;flex:none}
.lk{cursor:pointer;border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px 10px;position:relative;transition:box-shadow .15s,border-color .15s,transform .15s}
.lk:hover{transform:translateY(-1px)}
.lk.on{border-color:rgba(var(--acc2),.55);box-shadow:0 0 0 1px rgba(var(--acc2),.35),var(--elev)}
.lk .nm{font-size:9px;letter-spacing:.2em;font-weight:700;display:block}
.lk .chips{display:flex;gap:3px;margin-top:7px}
.lk .chips i{height:12px;flex:1;border-radius:2px}
.lk .sub{display:block;font-size:8.5px;line-height:1.35;margin-top:6px;opacity:.72}
/* FX event channels */
.fxr{display:flex;align-items:flex-start;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line-2)}
.fxr .fxd b{display:block;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.fxr .fxd span{display:block;font-size:9.5px;color:var(--ink-3);line-height:1.5;margin-top:2px;max-width:440px}
.tgl{display:inline-flex;width:30px;height:16px;border-radius:9px;border:1px solid var(--line);cursor:pointer;position:relative;background:rgba(var(--fg),.05);transition:background .15s;flex:none;margin-top:2px}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-3);transition:left .15s,background .15s}
.tgl.on{background:rgba(var(--acc2),.35);border-color:rgba(var(--acc2),.5)}
.tgl.on::after{left:16px;background:var(--ink)}
.fxlast{font:10.5px/1.6 "Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;color:var(--ink-2);padding:8px 2px 0;min-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxlast .sk{font-weight:700;margin-right:8px}
.fxlast .sk.crit{color:var(--crit)}.fxlast .sk.warn{color:var(--warn)}.fxlast .sk.ok{color:var(--ok)}.fxlast .sk.info{color:var(--net)}
.fxnote{font-size:9.5px;color:var(--ink-3);line-height:1.6;padding-top:8px;opacity:.85}
.fxnote b{color:var(--ink-2)}
.abt{display:inline-block;cursor:pointer;border:1px solid var(--line);border-radius:var(--rc);padding:3px 10px;font-size:9.5px;color:var(--ink-2)}
.abt:hover{background:rgba(var(--fg),.06);color:var(--ink)}
/* CTRL extras: accent swatches, tame rows, record rows, machine-preset tiles */
.dots{display:flex;gap:7px;align-items:center;flex:none}
.dot2{width:19px;height:19px;border-radius:50%;cursor:pointer;border:1px solid rgba(var(--fg),.25);transition:transform .12s,box-shadow .12s}
.dot2:hover{transform:scale(1.15)}
.dot2.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.tame{display:flex;align-items:center;gap:10px;padding:4.5px 2px;border-bottom:1px solid var(--line-2);font-size:11px}
.tame .tn{width:130px;flex:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tame .tv{width:84px;flex:none;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tame .tp{flex:1;min-width:0;color:var(--ink-3);font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crec{display:flex;gap:9px;font:10px/1.8 "Cascadia Mono",Consolas,ui-monospace,monospace;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.crec time{color:var(--ink-3);flex:none}
.crec b{color:var(--ink);font-weight:600;flex:none}
.crec .sm{overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-3)}
.wall{display:flex;gap:8px;align-items:baseline;padding:3px 2px;font-size:10px;color:var(--ink-3);line-height:1.5}
.wall b{color:var(--ink-2);font-weight:600;flex:none;font-size:10px}
.mtile{cursor:pointer;border:1px solid var(--line);border-radius:var(--rs);padding:10px 13px;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.mtile:hover{transform:translateY(-1px);box-shadow:var(--elev2)}
.mtile .nm{font-size:10px;letter-spacing:.22em;font-weight:700;display:block}
.mtile .what{display:block;font-size:9px;line-height:1.5;margin-top:5px;opacity:.8}
/* FX overlays — event-driven one-shots + the static scanline sheet; never in docked modes */
#scanfx{position:fixed;inset:0;z-index:81;pointer-events:none;border-radius:var(--r);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px);opacity:var(--scan,0)}
:root[data-theme=beast] #scanfx{display:none} /* beast already stripes its shell — doubling moirés */
#fxedge{position:fixed;inset:0;z-index:85;pointer-events:none;opacity:0;border-radius:var(--r);
  box-shadow:inset 0 0 52px rgba(var(--evr,255,176,58),.42),inset 0 0 3px rgba(var(--evr,255,176,58),.7)}
#fxedge.go{animation:fxe .55s ease-out}
@keyframes fxe{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#fxglitch{position:fixed;inset:0;z-index:86;pointer-events:none;display:none;overflow:hidden;border-radius:var(--r)}
#fxglitch.go{display:block}
#fxglitch i{position:absolute;left:0;right:0;opacity:0}
#fxglitch.go i:nth-child(1){top:16%;height:2px;background:rgba(var(--evr,255,92,110),.85);animation:gls1 .3s steps(2) both}
#fxglitch.go i:nth-child(2){top:37%;height:12px;background:rgba(0,229,255,.16);animation:gls2 .32s steps(3) both}
#fxglitch.go i:nth-child(3){top:66%;height:7px;background:rgba(255,46,106,.14);animation:gls3 .28s steps(2) both}
@keyframes gls1{0%{opacity:0;transform:translateX(-14px)}30%{opacity:1}70%{opacity:.4;transform:translateX(8px)}100%{opacity:0}}
@keyframes gls2{0%{opacity:0;transform:translateX(10px)}40%{opacity:1;transform:translateX(-16px)}100%{opacity:0;transform:none}}
@keyframes gls3{0%{opacity:0;transform:translateX(-8px)}50%{opacity:1;transform:translateX(12px)}100%{opacity:0}}
body.fxjit #shell{animation:fxj .16s steps(2)}
@keyframes fxj{0%{transform:translateX(0)}50%{transform:translate(2px,-1px)}100%{transform:none}}
body.docked #fxedge,body.docked #fxglitch,body.docked #scanfx{display:none}
@media (prefers-reduced-motion:reduce){#fxedge.go,#fxglitch.go{animation:none;display:none}body.fxjit #shell{animation:none}}

body.docked #rail,body.docked #main{display:none}
body.docked #compact{display:flex}
/* #shell is a 2-column grid (62px rail + 1fr main). Hiding those two does NOT remove the tracks,
   so #compact lands in the 62px RAIL column and its content overflows out of view — the topbar
   showed only its first chip and the sidebar wrapped every label. Collapse to a single track.
   Docked also runs far more opaque: a floating panel can be see-through because you look AT it,
   but a bar you read at a glance loses every small label to whatever wallpaper is behind it. */
body.docked #shell{
  border-radius:0;grid-template-columns:1fr;
  background:var(--dock-bg);
  border-color:rgba(var(--acc2),.10);
}
body.docked #wctl{height:26px}
/* THE WHOLE STRIP DRAGS - EXCEPT ITS CONTROLS.
 *
 * The docked grip used to be a full-size overlay: #grip is position:fixed with a z-index, so it
 * painted above everything and swallowed every press. That made the strip draggable and made the
 * stopwatch's Start and Lap buttons inert - the click became a window drag. Nothing LOOKED broken;
 * the cursor even says "grab".
 *
 * The obvious fix - raise the buttons above the grip - CANNOT WORK HERE, and it is worth knowing
 * why: #shell is `position:fixed; z-index:1`, which makes it a STACKING CONTEXT, and #grip is its
 * SIBLING. A z-index on a descendant of #shell only ranks it among #shell's other descendants; it
 * can never lift it past something outside. I wrote that fix first and it changed nothing.
 *
 * So the overlay goes away when docked, and the drag is initiated from the strip itself - skipping
 * anything interactive. That is how a real title bar behaves: the bare surface moves the window, the
 * controls on it do their job. */
body.docked #grip{display:none}

/* No card chrome at all in docked modes — boxes inside a 104 px bar are all border and no content.
   Just an accent tick, a label and a number. */
.cm{position:relative;overflow:hidden;background:none;border:0}
.cm .cl{color:var(--ink-3);text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .cv{font-weight:300;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
.cm .cv small{font-size:.6em;color:var(--ink-3);margin-left:1px;font-weight:400}
.cm i.acc{position:absolute;border-radius:1px}
.cm canvas{position:absolute;left:0;right:0;bottom:0;height:11px;width:100%;opacity:.28}

/* ---- sidebar: 104 x full height. Sections, because a column of five numbers over 1400 px of
       screen is mostly empty screen. ---- */
body.docked.sb #compact{flex-direction:column;padding:26px 0 6px;gap:0;overflow-y:auto;overflow-x:hidden}
/* flex:none is REQUIRED. In a column flex container every child is shrinkable by default, and a
   canvas has no intrinsic content to resist with — the sparklines were being squashed to height 0
   the moment the column ran out of room. */
body.docked.sb #compact > *{flex:none}
body.docked.sb #compact::-webkit-scrollbar{width:0}
.sb .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0 3px 2px}
.sb .cm{padding:5px 5px 6px 9px;min-width:0}
.sb .cm i.acc{left:3px;top:7px;width:2px;height:10px}
.sb .cm .cl{font-size:7px;letter-spacing:.1em}
.sb .cm .cv{font-size:13px;margin-top:0}
.sb .cm .cv small{font-size:.58em}
.sb .cm .sub{font-size:7.5px}
.sb .cm canvas{height:8px}
.chead{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  padding:9px 8px 3px 11px;opacity:.65;font-weight:700}
/* nowrap everywhere in the sidebar: a label that wraps turns one 14 px row into three and the
   whole column reads as scrunched. Labels ellipsize, values never break. */
.sb .kvr{display:flex;justify-content:space-between;align-items:baseline;gap:5px;
  padding:2.5px 9px 2.5px 11px;font-size:9.5px;color:var(--ink-2);white-space:nowrap}
.sb .kvr span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb .kvr b{color:var(--ink);font-weight:500;flex:none;white-space:nowrap}
.sb .cm .cv,.sb .cm .cl,.sb .cm .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .cm .sub{display:block;font-size:8.5px;color:var(--ink-3);margin-top:1px}
.cores{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px 9px 4px 11px}
.cores i{height:15px;background:rgba(var(--fg),.06);border-radius:2px;position:relative;overflow:hidden;display:block}
.cores i u{position:absolute;left:0;right:0;bottom:0;background:var(--cpu);opacity:.85;text-decoration:none}
.spark{position:relative;height:26px;margin:2px 9px 3px 11px;border-radius:3px;
  background:rgba(var(--fg),.035);overflow:hidden}
.spark span{position:absolute;left:4px;top:2px;font-size:7px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);z-index:1;opacity:.8}
.spark canvas{position:absolute;inset:0;width:100%;height:100%}
.prow{display:flex;justify-content:space-between;gap:4px;padding:2px 9px 2px 11px;font-size:9.5px}
.prow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.prow b{font-weight:500;color:var(--ink);flex:none}
.sb .fblock{margin-top:auto;padding-bottom:6px;border-top:1px solid var(--line-2)}
.fnd{display:flex;gap:6px;padding:4px 9px 4px 11px;font-size:8.5px;line-height:1.35;color:var(--ink-2)}
.fnd i{width:3px;border-radius:2px;flex:none;margin-top:1px;background:var(--ink-3)}
.fnd.critical i{background:var(--crit)} .fnd.warning i{background:var(--warn)} .fnd.note i{background:var(--net)}
.fnd span{min-width:0}
.sb #cVerdict{font-size:8.5px;color:var(--crit);line-height:1.35;margin-top:auto;
  padding:8px 9px 6px 11px;opacity:.9;border-top:1px solid var(--line-2)}

/* ---- topbar: 46 px x full width. Chips, and enough of them to earn the width. ---- */
body.mode-topbar #compact{flex-direction:row;align-items:center;gap:0;padding:0 44px 0 6px}
body.mode-topbar .cm{
  flex:0 0 auto;display:flex;align-items:baseline;gap:5px;padding:0 13px;
  border-right:1px solid var(--line-2);height:22px;
}
body.mode-topbar .cm i.acc{position:static;width:5px;height:5px;border-radius:50%;flex:none;align-self:center}
body.mode-topbar .cm .cl{font-size:8px;letter-spacing:.12em}
body.mode-topbar .cm .cv{font-size:13px;margin:0}
body.mode-topbar .cm .sub{font-size:9px;color:var(--ink-3);white-space:nowrap}
body.mode-topbar .cm canvas{display:none}
body.mode-topbar .tcores{display:flex;align-items:flex-end;gap:2px;height:14px;align-self:center;margin-left:2px}
body.mode-topbar .tcores i{width:3px;background:var(--cpu);opacity:.8;border-radius:1px;display:block;min-height:1px}
body.mode-topbar #cVerdict{flex:1;min-width:0;font-size:10.5px;color:var(--crit);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px;opacity:.9;text-align:right}

/* ---- WINDOW CONTROLS COLLAPSE TO ONE BUTTON, EVERYWHERE ----
   They used to collapse only when docked, so the floating panel and the popped-out chat both showed
   four always-on buttons in a fixed overlay pinned to the top-right - directly on top of the header.
   In the panel they sat over the PRESSURE meter; in the pop-out the close button covered the `auth`
   chip. A window control that obscures the thing it is floating over is worse than one extra click.
   One dot-button by default, expanding on click, in every mode. */
#wctl{gap:0}
#wctl button:not(.more){display:none}
#wctl.open button{display:grid}
#wctl .more{display:grid}

/* AND the header reserves the space regardless, so nothing sits underneath even while expanded.
   30px per button x 5, plus the 6px gutter - measured from the rule above rather than guessed, so
   adding a sixth button does not silently re-create the overlap. */
#top{padding-right:calc(30px + 6px + 8px)}
#wctl.open ~ * #top,
body.wctl-open #top{padding-right:calc(30px*5 + 6px + 8px)}
body.solo .hd{padding-right:calc(30px + 6px + 8px)}
body.solo.wctl-open .hd{padding-right:calc(30px*5 + 6px + 8px)}
body.docked.sb #wctl{flex-direction:column;top:2px;right:2px;height:auto;padding:0}
body.docked.sb #wctl button{width:24px;height:22px}

/* ---- contemporaneity pass (2026-07-28, DESIGN_EVAL.md) ----
   Repeated row-level actions go GHOST: colour (not chrome) carries the destructive affordance at
   rest — End stays crit red — and the pill materialises when the row declares hover intent.
   Standalone controls (Rescan, Trace, Re-run, Show all) keep their border: a lone control on a
   card needs its boundary to exist at all. Fourteen simultaneous red pills was alarm fatigue. */
table .btn,.crow .btn,table .btn.dgr,.crow .btn.dgr,table .btn.go,.crow .btn.go{background:transparent;border-color:transparent}
table tr:hover .btn.dgr,.crow:hover .btn.dgr{background:rgba(var(--crit-r),.11);border-color:rgba(var(--crit-r),.3)}
table tr:hover .btn:not(.dgr):not(.go),.crow:hover .btn:not(.dgr):not(.go){background:rgba(var(--fg),.06);border-color:var(--line)}
table tr:hover .btn.go,.crow:hover .btn.go{background:rgba(var(--cpu-r),.13);border-color:rgba(var(--cpu-r),.35)}
/* display numerals in the Display optical face — the whole typography budget of an offline app */
#coreLabel .big,.hstat .hv,.tile .tv,.gauge .gv b,.mst .mv,.cm .cv{font-family:var(--disp)}
/* one-shot staggered entrance: compositor-only, fires per navigation, never on the 1 Hz tick
   (live pages build once and update in place, so ticks cannot retrigger it) */
/* settle from ABOVE (−7px): a +7px start would transiently overflow the bottom edge of pages at
   the height budget and flash a scrollbar; translate also leaves rect WIDTHS untouched, which the
   treemap measures during entrance */
@keyframes rise{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.page.on>*{animation:rise .45s cubic-bezier(.22,1,.36,1) backwards}
.page.on>*:nth-child(2){animation-delay:.045s}
.page.on>*:nth-child(3){animation-delay:.09s}
.page.on>*:nth-child(4){animation-delay:.135s}
.page.on>*:nth-child(5){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){.page.on>*{animation:none}}

/* ---- outcomes ledger page (B2, 2026-07-31). The headline claim promoted to a surface: what
   fired HERE, what cleared it, how long each fix held, which levers measurably moved the number.
   Wins and losses render identically — a ledger that only remembers its wins is advertising. ---- */
#p-led .lg-row{display:grid;grid-template-columns:minmax(150px,1.45fr) .5fr .65fr .65fr .8fr minmax(120px,1.35fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:11.5px;align-items:baseline}
#p-led .lg-row:last-child{border-bottom:0}
#p-led .lg-row.h{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:2px 0 6px}
#p-led .lg-row b{font-weight:500;color:var(--ink)}
#p-led .lg-num{font-variant-numeric:tabular-nums;white-space:nowrap}
#p-led .lg-id{display:flex;align-items:baseline;gap:7px;min-width:0}
#p-led .lg-id i{width:7px;height:7px;border-radius:2px;flex:none;align-self:center}
#p-led .lg-id span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#p-led .lg-ev{display:grid;grid-template-columns:92px minmax(140px,1.6fr) .7fr .7fr minmax(110px,1.2fr);gap:10px;padding:5.5px 0;border-bottom:1px solid var(--line-2);font-size:11px;align-items:baseline}
#p-led .lg-ev:last-child{border-bottom:0}
#p-led .lg-ev .t{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
#p-led .lg-ev .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* SINGLE SCREEN, and the project's own scroll treatment.
   This shipped as `max-height:320px; overflow:auto` - a fixed pixel height and a visible bar, in an
   application that has neither anywhere else (nine other panels use the pattern below). Two of the
   rules it broke were already written down: P3 says fit by sizing the CONTAINER to the window
   rather than trimming content, and N4 says deep panels wheel-scroll with no bar so a full panel
   and an empty one have identical geometry. A default scrollbar is not a neutral choice, it is a
   conceded one.
   `flex:1; min-height:0` makes these the shock absorbers (N3) - they take the deficit so the page
   as a whole stays on one screen, which is what makes a web-tech surface read as software rather
   than as a document. */
#p-led{display:flex;flex-direction:column;min-height:0}
/* `align-items:stretch` is the whole fix, and it took a measurement to find.
   .g2 inherits `align-items:start` globally, which means grid items size to their CONTENT rather
   than to the row. Measured live: the grid row was 118 px and the card inside it was 8042 px. Every
   rule underneath — the card's overflow:hidden, .lscroll's flex:1, its min-height:0 — was inert,
   because none of them can shrink a box that was never given a height to shrink INTO. The card then
   painted 7900 px straight out of its cell and through everything below it.
   Same family as N2 ("min-height:100% is a FLOOR — clamping the CONTAINER is what makes every
   shrink rule below it load-bearing") and the implicit-grid ratchet: an unclamped track cannot be
   fixed by tuning what sits inside it. Here the track was clamped and the ITEM was opted out of it. */
#p-led .g2{flex:1 1 0;min-height:0;align-items:stretch}
/* `overflow:hidden` is doing the load-bearing work here, not the flex properties.
   Without it these cards had `min-height:0` (which PERMITS the squeeze) and visible overflow
   (which turns the squeeze into a COLLISION rather than a scroll) - O1's three outcomes, landing
   on the worst one. The footer note painted straight through the cycle rows underneath it.
   Clipping here is safe precisely because .lscroll below scrolls: nothing is lost, it moves into
   the wheel region. And per O2, hidden under flex also drops these to min-height:auto -> 0, which
   is what finally lets them absorb the deficit instead of pushing the page past one screen. */
#p-led .g2 > .card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
#p-led > .card:last-child{flex:none}
/* Floor low, not comfortable: a 120px floor on two stacked panels is 240px this page cannot always
   spare, and a floor that cannot be honoured reintroduces the overflow it was meant to prevent. */
#p-led .lscroll{flex:1 1 auto;min-height:64px;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#p-led .lscroll::-webkit-scrollbar{width:0;height:0}
/* The findings table is bounded too, or a machine with forty distinct findings pushes everything
   below it off screen. Bounded, not capped: every row is present and reachable by wheel. */
/* Three scroll regions SHARING the height, rather than one fixed slab starving the other two.
   A `max-height:min(34vh,300px)` here fitted the page and left the panels below at 65 px - two
   rows each, technically one screen and practically useless. Proportional flex gives every region
   a usable share at any window size, which is what "fit to the window" was supposed to mean. */
#p-led .lgcard{flex:1.25 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#p-led .lg-table{flex:1 1 auto;min-height:0;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#p-led .lg-table::-webkit-scrollbar{width:0;height:0}
#p-led .muted2{color:var(--ink-3)}

#toast{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(70px);z-index:50;
  background:var(--tip-bg);border:1px solid var(--line);border-radius:6px;padding:9px 15px;
  font-size:12px;transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:var(--elev2);
}
#toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>

    <div class="rail-sp"></div>
    <div class="rb" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.6-.25-1-.55-1.4-.3-.4-.45-.7-.45-1.1 0-1.1.9-2 2-2h2.2A4.8 4.8 0 0 0 22 10c-.6-4-4.8-7-10-7z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span class="tip" id="themeTip">Theme · dark</span></div>

    <!-- NOT a button, and it used to look exactly like one. This is the live-connection indicator:

<script>
'use strict';
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Render heartbeats + error counters, watched by the display watchdog. The blank-core failure
   mode (found live twice): a dead rAF chain or a throwing draw() leaves the canvas frozen while
   the DOM keeps ticking — an instrument that looks alive and lies. Counters advance on every rAF
   invocation (even skipped frames), so a stalled counter means the chain itself is dead. */
const __VB={rings:0,field:0,ringErrs:0,fldErrs:0};
window.__VB=__VB;
/* Shell-blur dial: localStorage vitals-shell-blur = 0 removes the 22px backdrop blur (the most
   expensive CSS property on the page). Cost/looks trade measured + printed on FOOTPRINT. */
try{ if(localStorage.getItem('vitals-shell-blur')==='0') document.documentElement.classList.add('noblur'); }catch{}
/* NULL IS NOT ZERO, and this one line was undoing the whole capability design.
   `Number(null)` is 0, so every collector that carefully emitted null for something it could not
   measure had that null rendered as a confident "0" the moment it reached a gauge: an Intel GPU on
   Linux showing "0%" busy, a Mac showing "null% busy / 0.0 queue" storage, "0.00 GB" committed
   memory. The collectors kept the rule; the formatter broke it at the last step.
   A value that was never measured now renders as an em-dash, which reads as absence rather than as
   an idle machine. Callers that genuinely want 0 for a missing value pass it explicitly. */
const NOVAL='—';
const fmt=(n,d=0,missing=NOVAL)=>(n==null||n===''||Number.isNaN(Number(n)))
  ? missing
  : Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
/* For the places that must have a number to do arithmetic on (bar widths, chart points), not to show. */
const num=(n,fallback=0)=>(n==null||Number.isNaN(Number(n)))?fallback:Number(n);
/* 'Intel Iris Xe Graphics' -> 'Iris Xe' · 'NVIDIA GeForce GTX 1650 with Max-Q Design' -> 'GTX 1650' */
const gpuShort=n=>String(n||'').replace(/Intel|NVIDIA|GeForce|Graphics|with Max-Q Design|\(R\)|\(TM\)/g,'').replace(/\s+/g,' ').trim()||'GPU';

/* ============ state ============ */
const S={ static:null, tick:null, hist:{cpu:[],mem:[],disk:[],diskpct:[],net:[],gpu:[],flt:[],rx:[],tx:[],selfcpu:[]}, view:'ov', selfModes:{}, caps:null };

/* THE SYSTEM VOLUME, whatever it is called here. Nine places used to look up `id==='C:'`, which is
   correct on Windows and finds nothing on a Mac or a Linux box - and "nothing" rendered as a dash or
   a zero, so the storage ring would have quietly read empty rather than wrong. Ask for the volume by
   role instead of by name: C: on Windows, / everywhere else, and failing both the largest mounted
   filesystem, which is the only sane guess left. */
function sysVol(t){
  const v=t&&t.disk&&t.disk.vols;
  if(!v||!v.length) return null;
  return v.find(x=>x.id==='C:') || v.find(x=>x.id==='/') || v.slice().sort((a,b)=>b.sizeGB-a.sizeGB)[0] || null;
}
/* Feature gate. `can('gpu.total')` is false on a host whose collector cannot measure it, and the
   caller OMITS the feature rather than drawing it at zero. Before the first static event arrives we
   answer true, so the Windows-shaped page renders immediately instead of flickering through a
   stripped-down version on every load. */
/* WHICH MACHINE IS THIS WINDOW LOOKING AT.
   Every request goes through here so the answer can be something other than "the one serving this
   page". Today it is always same-origin and API() is the identity function; the point is that the
   assumption now lives in ONE place instead of being spelled `/api/...` in a hundred, which is what
   would otherwise make a second window onto a second machine a rewrite rather than a parameter.
   A target is only ever set from the query string by a window we opened ourselves - never from
   anything a page fetched, and never pointing off this machine without an explicit tunnel. */
const TARGET=(()=>{ try{
  const t=new URLSearchParams(location.search).get('target')||'';
  if(!t) return '';
  /* Loopback only. A target is an origin we will send this machine's telemetry requests to and
     accept answers from; anything but localhost is refused until the remote story is built and
     reviewed, rather than silently honoured because a URL said so. */
  const u=new URL(t, location.origin);
  return /^(127\.0\.0\.1|\[::1\]|localhost)$/.test(u.hostname) ? u.origin : '';
}catch{ return ''; } })();
function API(p){ return TARGET ? TARGET+p : p; }

function can(k){ return !S.caps ? true : !!(S.caps.can && S.caps.can[k]); }
/* Clicking the chip has to answer the question it provokes - "why can't I do anything?" - including
   the way back, which is deliberately not a control on this page. */
function explainMode(){
  const c=S.caps||{};
  toast('Viewer mode: reads and reports, changes nothing. Restore with VITALS_MODE=admin',6000);
  try{ console.info('[vitals] mode:',c.mode,'-',c.modeNote||''); }catch{}
}

function capNote(k){ return (S.caps&&S.caps.notes&&S.caps.notes[k])||''; }

/* A 501 FROM THE BRIDGE MUST NOT BECOME AN EMPTY LIST.
   Several pages did `if(!Array.isArray(rows)) rows=[]` and then rendered their normal empty state:
   the PORTS panel said "nothing listening" and the STARTUP page showed 0 entries in every group.
   Both read as a measured finding — a machine with no open ports and a clean autostart — when the
   truth was that the feature is not implemented on this platform at all. That is the same
   fabricated-measurement failure as a zeroed gauge, just wearing an empty table instead.
   Returns true when it handled the payload, so callers can bail. */
function unsupportedPayload(p){ return p && typeof p==='object' && !Array.isArray(p) && p.error && p.platform; }
function paintUnsupported(el,p,feature){
  if(!unsupportedPayload(p)) return false;
  el.innerHTML=`<div class="empty" style="text-align:left;padding:14px 16px;line-height:1.55">
    <b style="display:block;margin-bottom:5px">${feature} is not available on ${p.platform}</b>
    <span class="muted">${p.detail||p.error}</span>
    <span class="muted" style="display:block;margin-top:7px">This is an unported feature, not a
    finding about your machine — nothing here was measured and came back empty.</span></div>`;
  return true;
}
/* An hour of samples, not 2.5 minutes: the bridge keeps this history anyway (/api/recent seeds it
   on load), the charts' captions said "last hour" — now they're telling the truth — and the
   overview's memory rings need real time depth to mean anything. 9×3600 floats is nothing. */
const HIST=3600;
const ease={};                                  // eased display values, keyed by name
function E(k,target,rate=.14){ if(ease[k]===undefined) ease[k]=target; ease[k]+=(target-ease[k])*rate; return ease[k]; }
function push(k,v){ const a=S.hist[k]; a.push(v); if(a.length>HIST) a.shift(); }

function toast(msg,ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),ms); }

/* ============ background field ============
   One fullscreen fragment shader. Domain-warped fbm whose turbulence and hue track system
   pressure — so the ambient look is driven by real data, not decoration running on a timer.
   Rendered at 0.55× and upscaled: this is a background, and the GPU budget belongs to the host. */
(function(){
  const cv=$('#field'), gl=cv.getContext('webgl',{alpha:true,antialias:false,depth:false});
  if(!gl){ cv.style.display='none'; return; }
  const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  /* Colours and response are UNIFORMS, not constants: the theme system feeds them from CSS custom
     properties (--f-cool/--f-acc/--f-warm/--f-base/--f-range/--f-vig/--f-pmul) so light renders a
     pale wash, pro a near-flat sheet, beast an amped storm — same measured pressure P drives all. */
  const fs=`precision mediump float;uniform vec2 R;uniform float T,P,SPD;
  uniform vec3 UC,UA,UW;uniform vec4 FP;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;

    float Q=P*FP.w;
    vec2 q=vec2(fbm(uv*1.6+t),fbm(uv*1.6+vec2(3.1,1.7)-t));
    vec2 r=vec2(fbm(uv*1.9+q*(1.1+Q*1.9)+t*1.3),fbm(uv*1.9+q*1.4+vec2(8.3,2.8)-t*.9));
    float f=fbm(uv*2.2+r*(1.0+Q*1.2));
    vec3 c=mix(UC,UA,smoothstep(.35,.85,f));
    c=mix(c,UW,P*P*smoothstep(.30,.90,f));
    float vig=1.-FP.z*length(uv*vec2(.72,1.));

  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uP=gl.getUniformLocation(pr,'P');
  const uUC=gl.getUniformLocation(pr,'UC'),uUA=gl.getUniformLocation(pr,'UA'),
        uUW=gl.getUniformLocation(pr,'UW'),uFP=gl.getUniformLocation(pr,'FP'),
        uSP=gl.getUniformLocation(pr,'SPD');
  /* theme → uniforms. Called at init and by setTheme(); cssv isn't defined yet at this point in
     the file, so read the vars directly. */
  function fieldTheme(){
    const gv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const hx=h=>{const n=parseInt((h||'#000').slice(1),16);return [n>>16&255,n>>8&255,n&255].map(x=>x/255);};
    gl.uniform3fv(uUC,hx(gv('--f-cool'))); gl.uniform3fv(uUA,hx(gv('--f-acc')));
    gl.uniform3fv(uUW,hx(gv('--f-warm')));
    gl.uniform4f(uFP,+gv('--f-base')||.55,+gv('--f-range')||.75,+gv('--f-vig')||.85,+gv('--f-pmul')||1);
    /* FX drift dial: time base as a uniform. ||.035 also covers the parse-fail case, so the
       field can never freeze because a dial wrote garbage. 0 is a legal value (frozen wash) —
       hence the explicit isNaN guard instead of ||. */
    const sp=parseFloat(gv('--f-speed')); gl.uniform1f(uSP,isNaN(sp)?.035:sp);
  }
  fieldTheme(); window.__vitalsFieldTheme=fieldTheme;
  // ResizeObserver, not the resize event. A window that starts at zero size — collapsed panel,
  // minimized, a hidden preview pane — fires NO resize event when it later becomes visible, so a
  // size-once-at-load canvas stays stuck at its fallback dimensions permanently. RO fires on the
  // transition to non-zero, which is exactly the moment we need.
  function size(){
    // Source of truth is the VIEWPORT, never the canvas's own box — deriving a canvas's backing
    // size from its rendered size feeds its output back into its input.
    const w=innerWidth||2, h=innerHeight||2, s=.55;
    const W=Math.max(2,(w*s)|0), H=Math.max(2,(h*s)|0);
    if(cv.width===W&&cv.height===H) return;
    cv.width=W; cv.height=H; gl.viewport(0,0,W,H);
  }
  new ResizeObserver(size).observe(document.documentElement);
  addEventListener('resize',size); size();
  window.__vitalsField=size;
  const t0=performance.now();
  let fldErrs=0,fLast=0;
  /* Frame governance (2026-07-29 self-cost pass). The field ran at display refresh; at 60 fps the
     WebView2 GPU process alone burned ~7.7% of this 8-thread machine for a slow-evolving ambient
     wash. 30 fps is measurably indistinguishable on a t*.035 time base and halves the per-frame
     GPU+composite work. While DOCKED the field is ~97% occluded by --dock-bg (.945–.97 alpha), so
     drawing it is cost with no photons — skip entirely. document.hidden skips cover minimise.
     Dial: localStorage 'vitals-fps-field' (0 = off). Measured before/after in history/selfcost.jsonl. */
  /* let, not const (2026-07-29 RIG): the fps caps are dials on the RIG page now — a dial that
     needs a reload to act is not a dial. The setter persists and takes effect on the next frame. */
  let FFPS=(()=>{try{const v=parseFloat(localStorage.getItem('vitals-fps-field'));return isNaN(v)?30:v}catch{return 30}})();
  window.__vitalsFpsField=v=>{ FFPS=v; try{localStorage.setItem('vitals-fps-field',String(v))}catch{} };
  window.__vitalsGetFpsField=()=>FFPS;
  function loop(){
    requestAnimationFrame(loop);
    __VB.field++;                       // heartbeat: advances every rAF even when the frame is skipped
    if(!FFPS||document.hidden||document.body.classList.contains('docked')) return;
    const now=performance.now(); if(now-fLast<1000/FFPS-4) return; fLast=now;
    /* Belt to the ResizeObserver's braces. Measured on a real client: backing store stuck at 2x2
       while the box was 1080x720 — a 2-pixel shader stretched over the whole window. RO fires on
       documentElement's box, which is NOT guaranteed to change on every path back from a degenerate
       viewport (restore from minimised, a pane that becomes visible without relayout), and size()
       had already latched W=H=2 from innerWidth||2. size() is two integer compares when correct, so
       re-checking per drawn frame is free and removes the whole class of stuck-backing-store bug. */
    size();
    try{
      gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,(now-t0)/1000);
      gl.uniform1f(uP,E('press_g',(ease.press||0)/100,.05)); gl.drawArrays(gl.TRIANGLES,0,3);
    }catch(e){ __VB.fldErrs=++fldErrs; if(fldErrs===1) console.warn('field draw error (loop kept alive):',e); }
  }
  /* ---- A1 fast-boot invariants (2026-07-31, MARKET_RESEARCH §9) ----
     One real frame IMMEDIATELY after link, before any rAF exists. rAF does not tick in a
     background, occluded or parked window, so a panel opened unfocused otherwise sits black
     until it is first shown. This paint is deliberately unconditional: the gates (fps dial,
     hidden, docked) belong to the LOOP's ongoing cost, not to the first frame's existence. */
  function paintOnce(){
    try{
      size();
      gl.uniform2f(uR,cv.width,cv.height);
      gl.uniform1f(uT,(performance.now()-t0)/1000);
      gl.uniform1f(uP,(ease.press||0)/100);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }catch(e){ __VB.fldErrs=++fldErrs; }
  }
  paintOnce();
  /* Deferred, GUARDED entry into the loop: the double rAF lands just after first contentful
     paint; the 900 ms timer is the path that runs when rAF never fires at all. The display
     watchdog can only re-arm a chain that DIED — this starts the chain that never ran, which
     is a different failure with the same symptom. The guard means exactly one chain exists no
     matter which path wins. */
  let fieldBooted=false;
  const goField=()=>{ if(fieldBooted) return; fieldBooted=true; loop(); };
  requestAnimationFrame(()=>requestAnimationFrame(goField));
  setTimeout(goField,900);
  window.__vitalsRearmField=()=>requestAnimationFrame(loop);   // watchdog resuscitation hook
  /* Heal a bad boot instead of failing: booted while the window reported ~0x0, the backing
     store latched at 2px. size() belts this on every DRAWN frame, but a loop that is skipping
     (hidden, docked, fps 0) never draws — so the watchdog calls this on its 5 s clock. Returns
     true only when it actually repaired something, so the caller can journal the event. */
  window.__vitalsFieldHeal=()=>{
    if(cv.width>2||!(innerWidth>7)) return false;
    size(); if(cv.width<=2) return false;
    paintOnce(); return true;
  };
})();

/* ============ core: memory rings ============
   Each ring is TWO honest encodings sharing one geometry. The bright arc is NOW (arc length =
   value, as always). Beneath it, the ring's own track is the metric's MEMORY: the last hour
   wrapped around the sweep — oldest at the arc's mouth, newest at its far end — as a heat trace
   whose brightness is the value at that moment (bucketed by MAX, so spikes survive; nothing is
   smoothed away). A spike twenty minutes ago is a hot blob two-thirds of the way round; a machine
   that has been pinned all hour is a ring burning end to end. The four current values sit as
   radial readouts in the arcs' open mouth — real negative space — so the centre carries only the
   hero number and the diagnosis. History costs one offscreen bake per TICK (~1 Hz); the 60 fps
   loop just blits it, so the always-on cost stays what it was. */
const RINGS=[
  /* colors are the CANVAS accent set (--cv-*): identical to the DOM set in every theme except
     PRO, where instruments render vivid inside dark wells while chrome accents stay restrained */
  {k:'cpu', label:'CPU LOAD',  tag:'CPU',  color:'--cv-cpu',  go:'cpu',  hk:'cpu',     get:t=>t?t.cpu.total:0},
  {k:'mem', label:'MEMORY',    tag:'MEM',  color:'--cv-mem',  go:'mem',  hk:'mem',     get:t=>t?t.mem.pct:0},
  {k:'disk',label:'DISK USED', tag:'DISK', color:'--cv-disk', go:'disk', hk:'diskpct', get:t=>{const c=sysVol(t);return c?c.pct:0}},
  /* Two GPUs live here (Intel iGPU + NVIDIA). One number labelled "GPU" is a lie whichever
     device it names, so the ring reads the BUSIEST adapter from the vendor-agnostic GPU Engine
     counters (Task Manager's source) — the label says so, and THERM carries the full split.
     Fallback to nvidia-smi only if the engine counters ever go away. */
  /* NULL, NOT 0, when this host cannot measure a GPU at all.
     Caught in the first screenshot of the panel running on a Mac: a CI runner's paravirtual GPU
     publishes no utilisation key, caps.js correctly said gpu.total:false, the collector correctly
     sent null - and this readout printed "0 GPU" anyway. A plausible zero ending the question is
     the exact failure the whole capability manifest exists to prevent, and it was the FIRST thing
     a macOS user would have seen.
     The stat card at CM[] already returned an em-dash for the same datum, so the two views of one
     number disagreed - which is worse than either being wrong alone. */
  {k:'gpu', label:'GPU · BUSIEST ADAPTER', tag:'GPU', color:'--cv-gpu', go:'therm',hk:'gpu',
   get:t=>(t&&t.gpus)?t.gpus.max:((t&&t.gpu&&t.gpu.util!=null)?t.gpu.util:null)},
];
const A0R=-Math.PI*0.75, SPANR=Math.PI*1.5;
(function(){
  const cv=$('#coreC'), cx=cv.getContext('2d');
  const bcv=document.createElement('canvas'), bx=bcv.getContext('2d');
  let hover=-1;
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16);
    return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
  function geo(){
    const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    /* Return null rather than substituting a fallback size when the box is degenerate.
       While docked, #main is display:none so this rect is 0x0. The old code coerced that to 1x1,
       resized the backing store to 2x2 and drew a nonsense frame every tick. Restoring the panel
       then had to grow the canvas back from 2 px, and any frame that landed mid-relayout baked in
       a half-resized geometry — which is why the rings came back oversized and off-centre.
       Not drawing at all while hidden is both correct and cheaper. */
    if(r.width<8||r.height<8) return null;
    const w=r.width, h=r.height;
    const W=Math.max(1,Math.round(w*dpr)), H=Math.max(1,Math.round(h*dpr));
    if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
    cx.setTransform(dpr,0,0,dpr,0,0);
    /* −26, not −14: the ring glow (shadowBlur up to 22) was slicing flat against the canvas edge
       at the top and bottom — the owner's "minor clipping on a shadow". Glows need margin. */
    return {w,h,dpr,cxp:w/2,cyp:h/2,R:Math.min(w,h)/2-26};
  }
  function ringR(g,i){ const gap=g.R*0.135; return g.R-i*gap; }
  /* offscreen bake: heat tracks + gap readouts. Runs on tick / resize, never in the rAF loop.
     bakedSig records the geometry the bitmap was baked FOR, so draw() can refuse to blit a bake
     that belongs to a different size. Empty string = nothing valid baked. */
  const sigOf=g=>g.w+'x'+g.h+'@'+g.dpr;
  let bakedSig='';
  function bake(){
    const g=geo(); if(!g){ bakedSig=''; return; }
    if(bcv.width!==cv.width||bcv.height!==cv.height){ bcv.width=cv.width; bcv.height=cv.height; }
    bx.setTransform(g.dpr,0,0,g.dpr,0,0);
    bx.clearRect(0,0,g.w,g.h);
    RINGS.forEach((ring,i)=>{
      const rr=ringR(g,i); if(rr<12) return;
      const col=css(ring.color), lw=Math.max(3,g.R*0.045);
      bx.lineWidth=lw; bx.lineCap='butt';
      bx.beginPath(); bx.strokeStyle=css('--cv-track');
      bx.arc(g.cxp,g.cyp,rr,A0R,A0R+SPANR); bx.stroke();
      const hist=S.hist[ring.hk]||[];
      if(hist.length>6){
        /* The memory band: ~¾ of the bar's width WITH explicit gaps between buckets. The owner's
           instinct ("the bar should fill the cubes") and the misread risk are reconciled by
           STRUCTURE, not width alone: the bar is a continuous glowing beam, the memory is a ticked
           band — two textures that cannot be confused even where they overlap, while sharing
           enough geometry to read as one instrument track. Full equal width stays rejected: a
           solid-looking trail continuing past the bar head reads as a longer bar. */
        bx.lineWidth=lw*0.74;
        const nb=Math.round(clamp(SPANR*rr/5,80,220)), step=hist.length/nb, duty=0.72;
        for(let b=0;b<nb;b++){
          let v=0; const s0=Math.floor(b*step), s1=Math.max(s0+1,Math.floor((b+1)*step));
          for(let s=s0;s<s1&&s<hist.length;s++) if(hist[s]>v) v=hist[s];   // bucket MAX — spikes survive decimation
          const a=clamp(v,0,100)/100; if(a<=0.005) continue;
          /* AGE fades as well as value (2026-07-30, owner: "a snake chasing its tail - by the time it
             reaches the starting point, that has vanished"). Brightness alone encoded magnitude, so the
             oldest and newest buckets looked identical whenever their values matched and nothing in the
             ring said which end was NOW. Multiplying by recency makes the trace a moving window: the
             head burns, the tail dissolves into the track just as the head laps it. b=0 is the arc's
             mouth and the oldest sample, so recency runs 0 -> 1 along the sweep. */
          const recency=nb>1?b/(nb-1):1;
          const fade=0.08+0.92*Math.pow(recency,0.85);
          bx.strokeStyle=hexA(col,(.06+.32*Math.pow(a,1.25))*fade);
          bx.beginPath(); bx.arc(g.cxp,g.cyp,rr,A0R+SPANR*(b/nb),A0R+SPANR*((b+duty)/nb)); bx.stroke();
        }
      }
      // radial readout in the arcs' open mouth (true negative space at 180°)
      /* `||0` here turned "this host cannot measure that" into a confident 0 - the readout printed
         "0 GPU" on a Mac whose GPU publishes no utilisation at all. Null has to survive as a dash
         all the way to the glyph, or the manifest gating upstream buys nothing. */
      const raw=ring.get(S.tick);
      const val=raw==null?null:Math.round(clamp(raw,0,100));
      bx.textAlign='center'; bx.textBaseline='alphabetic';
      bx.fillStyle=hexA(col,val==null?.42:.92); bx.font='600 12px ui-sans-serif,system-ui';
      bx.fillText(!S.tick||val==null?'–':String(val), g.cxp-rr, g.cyp-1);
      bx.fillStyle=css('--cv-label'); bx.font='600 7px ui-sans-serif,system-ui';
      bx.fillText(ring.tag, g.cxp-rr, g.cyp+9);
    });
    bakedSig=sigOf(g);
  }
  cv.addEventListener('mousemove',e=>{
    const g=geo(); if(!g) return;
    const r=cv.getBoundingClientRect();
    const d=Math.hypot(e.clientX-r.left-g.cxp, e.clientY-r.top-g.cyp);
    hover=-1; RINGS.forEach((_,i)=>{ const rr=ringR(g,i); if(Math.abs(d-rr)<g.R*0.062) hover=i; });
    cv.style.cursor=hover>=0?'pointer':'default';
    if(hover>=0){
      const h=S.hist[RINGS[hover].hk]||[];
      const pk=h.length?Math.round(Math.max.apply(null,h)):null;
      $('#cvSub').textContent=RINGS[hover].label+(pk!==null?` · PEAK ${pk}%`:'');
    }
  });
  cv.addEventListener('mouseleave',()=>{hover=-1;cv.style.cursor='default'});
  cv.addEventListener('click',()=>{ if(hover>=0) go(RINGS[hover].go); });

  function draw(){
    /* Hidden (docked): skip the frame, and report NOT settled. Returning true here was the
       blank-core bug — the loop reads the return as "every ease converged, stop scheduling" and
       clears ringDirty. So going docked permanently retired the renderer: on restore the canvas had
       been cleared by its own resize, ringDirty was false, and nothing marked it again. "I could not
       draw" and "I finished drawing" are opposite facts and must not share a return value. */
    const g=geo(); if(!g) return false;
    /* A bake belongs to ONE geometry. drawImage(bcv,0,0,g.w,g.h) SCALES the baked layer to the
       current box, so after a dock→restore the narrow sidebar bake got stretched across the panel:
       tracks and gap readouts landed far from the live arcs, which is the owner's "circles
       eventually appeared but in the wrong spot". Re-bake whenever the geometry moved, and never
       composite a bake that was made for a different size. */
    const sig=sigOf(g);
    if(sig!==bakedSig) bake();
    let settled=true;                      // true when every ease has converged → loop may sleep
    window.__vitalsLastPaint=performance.now();   // reached the drawing, not merely the loop
    cx.clearRect(0,0,g.w,g.h);
    if(bcv.width>1&&bakedSig===sig) cx.drawImage(bcv,0,0,g.w,g.h);   // the baked hour, 1:1 only
    const t=S.tick;
    RINGS.forEach((ring,i)=>{
      const rr=ringR(g,i); if(rr<12) return;
      const raw=clamp(ring.get(t)||0,0,100);
      const v=E('ring_'+ring.k,raw,.10);
      if(Math.abs(v-raw)>0.05) settled=false;
      const col=css(ring.color);
      /* butt caps, not round: a round cap extends past the terminal angle by lw/2 — ~1.3° on the
         outer ring, a systematic ~0.5%-of-scale overstatement, always in the same direction. The
         arc now ends exactly where the data ends; the head dot marks that same true angle. */
      const lw=Math.max(3,g.R*0.045);
      cx.lineWidth=lw; cx.lineCap='butt';
      const on=hover===i;
      if(v>0.2){
        cx.beginPath(); cx.strokeStyle=col; cx.globalAlpha=on?1:.88;
        cx.shadowBlur=(on?22:12)*GLO(); cx.shadowColor=col;
        cx.arc(g.cxp,g.cyp,rr,A0R,A0R+SPANR*(v/100)); cx.stroke();
        cx.shadowBlur=0; cx.globalAlpha=1;
        const tp=TEXP(cx);   // beast texture on the beam — dark/light/pro; beast striates via shell
        if(tp){ cx.beginPath(); cx.strokeStyle=tp;
          cx.arc(g.cxp,g.cyp,rr,A0R,A0R+SPANR*(v/100)); cx.stroke(); }
      }
      /* The playhead: a radial blade at the TRUE terminal angle — the boundary between measured
         past (the ticked band) and now (the beam). Its bloom tracks the needle's real angular
         speed, so it flares only while the value is actually moving and sits calm at rest —
         motion means data. At 0 it reads as a needle at rest at the mouth, not an orphaned dot;
         at 100 the blade + glow stay inside the 26px canvas margin. */
      const a=A0R+SPANR*(v/100), cA=Math.cos(a), sA=Math.sin(a);
      const pv=(draw._pv||(draw._pv={}))[ring.k]; draw._pv[ring.k]=v;
      const rate=pv===undefined?0:Math.abs(v-pv)*60;          // eased needle speed, %/s
      cx.lineCap='round';
      cx.strokeStyle=col; cx.shadowColor=col; cx.shadowBlur=(8+Math.min(15,rate*0.5))*GLO();
      cx.lineWidth=2.6;
      cx.beginPath(); cx.moveTo(g.cxp+cA*(rr-lw*0.85),g.cyp+sA*(rr-lw*0.85));
      cx.lineTo(g.cxp+cA*(rr+lw*0.85),g.cyp+sA*(rr+lw*0.85)); cx.stroke();
      cx.shadowBlur=0;
      cx.strokeStyle=css('--cv-core'); cx.lineWidth=1.1;
      cx.beginPath(); cx.moveTo(g.cxp+cA*(rr-lw*0.45),g.cyp+sA*(rr-lw*0.45));
      cx.lineTo(g.cxp+cA*(rr+lw*0.45),g.cyp+sA*(rr+lw*0.45)); cx.stroke();
    });
    /* Same rule as the gap readouts. Hovering an unmeasurable ring must not put a confident 0 in
       the hero position - the easing keeps tracking underneath so the animation stays sane, but
       what gets drawn is a dash. */
    const idx=hover>=0?hover:0, rawCur=RINGS[idx].get(S.tick);
    const cur=clamp(rawCur==null?0:rawCur,0,100);
    const big=E('big',cur,.12);
    if(Math.abs(big-cur)>0.25) settled=false;
    $('#cvBig').textContent=rawCur==null?'–':Math.round(big);
    if(hover<0) $('#cvSub').textContent=RINGS[0].label;
    return settled;
  }
  /* Exception-tolerant heart. Found live 2026-07-29: after ~7.5 h up the core was BLANK — one
     uncaught throw in draw() had killed this chain hours earlier (rAF only reschedules if the
     callback survives), leaving the canvas cleared forever while the DOM kept ticking. A 24/7
     instrument keeps beating: catch, count, warn once, keep scheduling. */
  let drawErrs=0,rLast=0;
  /* Demand-driven heart (2026-07-29 self-cost pass). The old loop repainted four glowing arcs —
     shadowBlur is the most expensive op in 2D canvas — at display refresh even when every value
     had converged. Now: capped at 30 fps, and skipped entirely once the eases settle (draw()
     reports convergence) until new data arrives. An idle machine costs ~0 frames; a moving one
     animates exactly while its numbers move — the honesty line and the power bill agree.
     Dial: localStorage 'vitals-fps-rings'. */

     be switched off is a lie waiting to render. Setter marks dirty so the change shows now. */

     loop. A chain that NEVER STARTED is not a chain that died: the watchdog re-arms the second
     and cannot help the first — a window opened hidden or parked at a screen edge gets no rAF
     at all, so without the 900 ms timer the loop simply never begins. A window booted at 0x0

     worked, and the dock path repainted correctly in every theme when driven from the API. So rather
     than guess at a fourth cause, this records the fact the renderer can check - "the page is showing
     the overview, the canvas has a real box, and yet nothing has been painted for seconds" - and the

  window.__vitalsLastPaint=0;

/* ============ tiles ============ */
function sparkline(cvs,data,color,stroke){
  const cx=cvs.getContext('2d'), r=cvs.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  if(!r.width||!r.height) return;
  cvs.width=r.width*dpr; cvs.height=r.height*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,r.width,r.height);
  if(data.length<2) return;
  const mx=Math.max(1,...data);
  // Span the FULL width from whatever data exists rather than reserving room for HIST samples:
  // a fresh session has ~20 points, which drew a 3 px smudge in the corner of a 118 px box.
  const n=data.length, X=i=>(n<2?0:(i/(n-1))*r.width), Y=v=>r.height-(v/mx)*r.height*0.86-1;
  cx.beginPath();
  data.forEach((v,i)=>{ i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)); });
  cx.lineTo(r.width,r.height); cx.lineTo(0,r.height); cx.closePath();
  const grd=cx.createLinearGradient(0,0,0,r.height);
  grd.addColorStop(0,color); grd.addColorStop(1,'transparent');
  cx.fillStyle=grd; cx.fill();
  if(stroke){                      // a fill alone is invisible at 26 px tall
    cx.beginPath();
    data.forEach((v,i)=>{ i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)); });
    cx.strokeStyle=stroke; cx.lineWidth=1.2; cx.lineJoin='round'; cx.stroke();
  }
}
/* ---- shared canvas discipline for the page visuals ----
   CSS owns the box; the backing store follows the RECT (never its own width/height), and a
   degenerate rect (hidden/collapsed element) skips the frame entirely. */
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
/* theme glow scale for canvas painters: every shadowBlur multiplies by this. Dark 1, light .25,
   pro .5, beast 1.7 — glow is a material choice per theme, and paper takes shadow, not light. */
const GLO=()=>parseFloat(cssv('--fx-glow'))||1;
/* beast's meter-bar texture, extracted for the other themes (owner request 2026-07-29): a
   screen-space scanline pattern stroked over each value beam — same striation beast gets from
   its shell overlay, drawn only where the meter is. Cached per alpha; ~one extra stroke per
   ring per frame, nothing at rest beyond the existing loop. --cv-beam-tex:0 disables (beast). */
const TEXP=(()=>{ let key='',pat=null; return (c2)=>{
  const a=parseFloat(cssv('--cv-beam-tex'))||0; if(a<=0.01) return null;
  const k=a.toFixed(2);
  if(k!==key){ const t=document.createElement('canvas'); t.width=1; t.height=3;
    const g=t.getContext('2d'); g.fillStyle='rgba(0,0,0,'+a+')'; g.fillRect(0,0,1,1);
    pat=c2.createPattern(t,'repeat'); key=k; }

function sizeCanvas(cvs){
  const r=cvs.getBoundingClientRect();

  const dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
  if(cvs.width!==W||cvs.height!==H){ cvs.width=W; cvs.height=H; }
  const cx=cvs.getContext('2d'); cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,r.width,r.height);
  return {cx,w:r.width,h:r.height};
}
/* the overview tiles' sparkline, grown up: grid line, glow stroke, live dot */
function areaChart(cvs,data,color,opts={}){
  const g=sizeCanvas(cvs); if(!g) return;
  const cx=g.cx, w=g.w, h=g.h;
  if(!data||data.length<2) return;
  const mx=opts.max||Math.max(1,...data)*1.08;
  const n=data.length, top=16, bot=4;
  // right inset: the live dot (r 2.4 + glow 9) sat at x=w exactly and was cut in half by the
  // canvas edge — the most visible of the clipped glows
  const X=i=>(i/(n-1))*(w-8), Y=v=>h-bot-clamp(v/mx,0,1)*(h-top-bot);
  cx.strokeStyle=cssv('--cv-grid'); cx.lineWidth=1;
  cx.beginPath(); const gy=h-bot-.5*(h-top-bot); cx.moveTo(0,gy); cx.lineTo(w,gy); cx.stroke();
  cx.beginPath(); data.forEach((v,i)=>i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)));
  cx.lineTo(w,h); cx.lineTo(0,h); cx.closePath();

/* 270° arc gauge in the core's language */
function ringGauge(cvs,pct,color){

  const cx=g.cx, cxp=g.w/2, cyp=g.h/2, R=Math.min(g.w,g.h)/2-16;

  const v=clamp(pct,0,100)/100;
  if(v>0.002){
    cx.beginPath(); cx.strokeStyle=color; cx.shadowColor=color; cx.shadowBlur=13*GLO();
    cx.arc(cxp,cyp,R,A0,A0+SPAN*v); cx.stroke(); cx.shadowBlur=0;
    const tp=TEXP(cx);                                 // extracted beast meter texture
    if(tp){ cx.beginPath(); cx.strokeStyle=tp; cx.arc(cxp,cyp,R,A0,A0+SPAN*v); cx.stroke(); }
    const a=A0+SPAN*v;

/* per-thread load as radial spokes — one pinned thread reads as a single long ray */
function threadWheel(cvs,cores,color){
  const g=sizeCanvas(cvs); if(!g) return;
  const n=cores.length; if(!n) return;
  const cx=g.cx, cxp=g.w/2, cyp=g.h/2;
  const R1=Math.min(g.w,g.h)/2-21, R0=Math.max(10,R1*0.48);   // −21: thread index labels sit at R1+9
  const lw=clamp((2*Math.PI*R0)/n-6,3.5,15);
  cx.lineCap='round';
  cores.forEach((v,i)=>{
    const a=-Math.PI/2+i*(2*Math.PI/n), ux=Math.cos(a), uy=Math.sin(a);
    cx.lineWidth=lw;
    cx.beginPath(); cx.strokeStyle=cssv('--cv-grid');
    cx.moveTo(cxp+ux*R0,cyp+uy*R0); cx.lineTo(cxp+ux*R1,cyp+uy*R1); cx.stroke();
    const r=R0+(R1-R0)*clamp(v,0,100)/100;
    cx.beginPath(); cx.strokeStyle=color; cx.globalAlpha=.92;
    cx.shadowColor=color; cx.shadowBlur=9*GLO();
    cx.moveTo(cxp+ux*R0,cyp+uy*R0); cx.lineTo(cxp+ux*Math.max(R0+1.5,r),cyp+uy*Math.max(R0+1.5,r)); cx.stroke();
    cx.shadowBlur=0; cx.globalAlpha=1;
    cx.fillStyle=cssv('--cv-label'); cx.font='8.5px ui-sans-serif,system-ui';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(String(i), cxp+ux*(R1+9), cyp+uy*(R1+9));

/* squarified treemap layout — returns {x,y,w,h,it} rects for items [{v,...}] sorted desc */
function layoutTreemap(items,W,H){
  const total=items.reduce((s,i)=>s+i.v,0)||1;
  const scale=W*H/total, out=[];
  let x=0,y=0,w=W,h=H,row=[];
  const worst=(row,len)=>{
    const s=row.reduce((a,b)=>a+b.v*scale,0); let m=0;
    for(const it of row){ const a=it.v*scale;
      const r=Math.max(len*len*a/(s*s), s*s/(len*len*a)); if(r>m) m=r; }
    return m;
  };
  const flush=()=>{
    const s=row.reduce((a,b)=>a+b.v*scale,0);
    if(w<h){ const rh=s/w; let rx=x;
      for(const it of row){ const rw=it.v*scale/rh; out.push({x:rx,y,w:rw,h:rh,it}); rx+=rw; }
      y+=rh; h-=rh;
    } else { const rw=s/h; let ry=y;
      for(const it of row){ const rh2=it.v*scale/rw; out.push({x,y:ry,w:rw,h:rh2,it}); ry+=rh2; }
      x+=rw; w-=rw;
    }
    row=[];
  };
  for(const it of items){
    if(!row.length){ row.push(it); continue; }
    const len=Math.min(w,h);
    if(worst(row,len)>=worst([...row,it],len)) row.push(it); else { flush(); row.push(it); }
  }
  if(row.length) flush();
  return out;
}

   page grew a chat box. Typing "for" in the Ask input used to fire f→FOOTPRINT then r→RIG, so the
   page changed underneath the sentence being written. Any editable target means the keystroke
   belongs to it, not to the shell. */
function isTyping(e){
  const t=e.target;

addEventListener('keydown',e=>{
  if(isTyping(e)) return;

     this, Ctrl+R reloaded the page AND jumped to RIG on the way out, and Ctrl+Shift+R - the one
     reload that actually bypasses the WebView cache - did the same. */
  if(e.ctrlKey||e.metaKey||e.altKey) return;

/* ============ themes ============

   them live, so switching is: flip the attribute, re-upload the field uniforms, repaint. */
const THEMES=['dark','light','pro','beast'];

   re-announced. Without it the broadcast returns to the window that sent it, which announces again,
   and two windows ping-pong a theme change forever. */
function setTheme(name,quiet,fromRelay){
  if(!THEMES.includes(name)) return;
  const already=(document.documentElement.dataset.theme||'dark')===name;
  if(name==='dark') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=name;
  try{ localStorage.setItem('vitals-theme',name); }catch{}
  /* FX looks are var vectors layered over a base theme. A DIRECT theme switch (T key, RIG
     picker, harness) means "wear the plain theme" — the sync hook strips any custom look's
     inline vars so the two systems can't produce a hybrid. fxLook() sets __fxApplying. */
  try{ if(!window.__fxApplying&&window.__fxThemeSync) __fxThemeSync(name); }catch{}
  const tip=$('#themeTip'); if(tip) tip.textContent='Theme · '+name;
  /* Tell the native host, so the WINDOW's 1px DWM border can be re-tinted to match. The host cannot
     read our CSS, and Windows draws that border itself the moment we ask for rounded corners — left
     unset it is a system mid-grey that measured darker than both the desktop and the paper themes'
     surface, i.e. a dark scar on light and invisible on dark. Chrome outside our canvas still has to
     follow the theme, or the window stops looking like one object. */
  try{ if(window.chrome&&chrome.webview) chrome.webview.postMessage('theme:'+name); }catch{}
  if(window.__vitalsFieldTheme) __vitalsFieldTheme();

  if(window.__vitalsDraw) __vitalsDraw();
  if(RENDER[S.view]) RENDER[S.view]();           // charts re-read their colours on repaint
  // `mode` (let, declared far below) is in its TDZ when the persisted theme applies at load —
  // and nothing is painted yet at that point, so skipping the docked repaint is correct.
  try{ if(mode!=='panel') paintCompact(); }catch{}
  if(!quiet) toast('Theme: '+name+(name==='pro'?' (studio)':name==='beast'?' (overdrive)':''));

     same machine; leaving it on a different theme makes two halves of one tool look like two tools.
     The bridge already had a relay for this (/api/panel/theme broadcasts `paneltheme` to every SSE
     client, and the listener below already applied it) - the only missing link was that changing the
     theme never TOLD anyone. Skipped when the change came from the relay, and when nothing actually
     changed, so the wire stays quiet. */
  if(!fromRelay&&!already){ try{ fetch(API('/api/panel/theme?t='+encodeURIComponent(name))).catch(()=>{}); }catch{} }

  $('#cpuName').textContent=S.static?S.static.cpu:'';

  $('#cpuBig').textContent=fmt(t.cpu.total);

RENDER.mem=()=>{

     where the platform is verified to measure it, and never invents a value. The colour tiers on
     the linux branch are presentation thresholds on a measured number, not fabricated data: full>1%

  if(el.dataset.xp!=='1'){

       the page grew a scrollbar. The count is a MEASUREMENT, not a constant — clear the whole deficit
       in one pass (creeping one row per tick means seconds of visible overflow), and grow back toward
       12 only with a full row of slack so it cannot flip-flop. No inner scroll: one page. */
    const n=S.memRows||12;
    $('#memProc').innerHTML=procTable('mb',{n}); wireKill(el);
    if(el.clientHeight>120){
      const over=el.scrollHeight-el.clientHeight;

      const rowH=c?Math.max(14,tb.getBoundingClientRect().height/c):24;
      if(over>0&&n>5) S.memRows=Math.max(5,n-Math.ceil(over/rowH));

  }
};
/* "Show all" — ONE mechanism, three pages (generalised 2026-07-29).
   Every live process table here shows only its top few, and for good reasons that are invisible to
   the reader: the stream carries 16 processes by design, and each page then fits only what its layout
   allows (NET is down to 3 rows on a 1080x720 window). The owner, on CPU: "shouldnt we have a show all
   for cpu processes itd be weird i would think to not have that information." Correct — a truncated
   table with no way to see the rest is the same defect as a "+441 more" you cannot open.
   /api/processes is the full grouped snapshot and now carries cpu, private working set AND io rates,
   so the only per-page difference is which number leads and which column gets the bar. Opt-in, plainly
   labelled a snapshot, restores the live table on a second click. */
const XPCFG={
  mem: {page:'p-mem', host:'memProc', view:'mem', back:'Show top 12', color:'--mem',
        metric:r=>r.mb||0, lead:r=>`${fmt(r.mb)} MB`, side:r=>`${fmt(r.cpu||0,1)}%`,
        what:'private working set'},
  cpu: {page:'p-cpu', host:'cpuProc', view:'cpu', back:'Show top only', color:'--cpu',
        metric:r=>r.cpu||0, lead:r=>`${fmt(r.cpu||0,1)}%`, side:r=>`${fmt(r.mb)} MB`,
        what:'cpu over the ~1 s sample'},
  net: {page:'p-net', host:'netProc', view:'net', back:'Show top only', color:'--net',
        metric:r=>(r.rMBs||0)+(r.wMBs||0), lead:r=>`${fmt((r.rMBs||0)+(r.wMBs||0),2)} MB/s`,
        side:r=>`<span class="muted">r</span>${fmt(r.rMBs||0,2)} <span class="muted">w</span>${fmt(r.wMBs||0,2)}`,
        sideW:118, what:'read+write bytes differenced over the sample'}
};
function wireShowAll(key){
  const cfg=XPCFG[key], b=document.getElementById(key+'All'); if(!cfg||!b) return;
  b.onclick=async()=>{
    const el=document.getElementById(cfg.page);
    if(el.dataset.xp==='1'){ el.dataset.xp=''; b.textContent='Show all'; RENDER[cfg.view](); return; }
    b.innerHTML='<span class="spin"></span>';
    let all=[];
    try{ all=await (await fetch('/api/processes')).json(); }
    catch(e){ b.textContent='failed'; setTimeout(()=>b.textContent='Show all',1800); return; }
    /* A 501 here used to just snap the button back to "Show all", so it read as a dead control
       rather than an unavailable feature. Say which it is. */
    if(unsupportedPayload(all)){ b.textContent='not on '+all.platform;
      setTimeout(()=>b.textContent='Show all',2600); return; }
    if(!Array.isArray(all)||!all.length){ b.textContent='Show all'; return; }
    el.dataset.xp='1'; b.textContent=cfg.back;
    all=[...all].sort((x,y)=>cfg.metric(y)-cfg.metric(x));
    const mx=Math.max(0.01,...all.map(cfg.metric));
    const sw=cfg.sideW||46;
    /* Same columns and same metric definitions as the live table above — the endpoint mirrors
       metrics.ps1 (private working set, cpu and io as real two-sample deltas), so the first rows here
       read as the collapsed table, continued. Click a row for its PIDs; End works everywhere. */
    const row=(r,i)=>`<div class="crow xrow" data-x="${i}" style="padding:2px 7px;gap:6px;font-size:11px;cursor:pointer" title="click for per-instance detail">
      <i class="rfill" style="background:var(${cfg.color});width:${(cfg.metric(r)/mx*100).toFixed(1)}%"></i>
      <span class="pth" style="color:var(--ink-2);font-size:11px">${r.n}${r.count>1?` <span class="muted">×${r.count}</span>`:''}</span>
      <span class="muted" style="flex:none;width:${sw}px;text-align:right;font-size:10.5px">${cfg.side(r)}</span>
      <span class="sz" style="width:74px;font-size:11px">${cfg.lead(r)}</span>
      <button class="btn dgr k" style="padding:1px 6px;font-size:9.5px" data-pids="${(r.pids||[]).join(',')}" data-n="${r.n}">End</button>
    </div>
    <div data-d="${i}" style="display:none;border-bottom:1px solid var(--line-2);padding:1px 0 3px">
      ${(r.inst||[]).map(x=>`<div class="crow" style="padding:1px 7px 1px 24px;gap:6px;font-size:10.5px;border-bottom:0">
        <span class="pth muted" style="font-size:10.5px">PID ${x.pid}</span>
        <span class="sz" style="width:60px;font-size:10.5px">${fmt(x.mb)} MB</span>
        <button class="btn dgr k" style="padding:0 6px;font-size:9px" data-pids="${x.pid}" data-n="${r.n} (pid ${x.pid})">End</button>
      </div>`).join('')}
    </div>`;
    const cut=Math.ceil(all.length/3), cols=[all.slice(0,cut),all.slice(cut,cut*2),all.slice(cut*2)];
    let base=0;
    const host=document.getElementById(cfg.host);
    host.innerHTML=`
      <div class="pgrid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px">
        ${cols.map(c=>{const h=c.map((r,j)=>row(r,base+j)).join(''); base+=c.length; return `<div>${h}</div>`;}).join('')}
      </div>
      <div class="note">Every process (${all.length} names, grouped) — sorted by ${cfg.what}, same counters as the table above. A snapshot taken when you clicked, not live. Click a row for per-instance PIDs.</div>`;
    host.querySelectorAll('.xrow').forEach(x=>x.onclick=e=>{
      if(e.target.closest('.btn')) return;
      const d=host.querySelector(`[data-d="${x.dataset.x}"]`);
      if(d) d.style.display=d.style.display==='none'?'':'none';
    });
    wireKill(host);
  };
}
/* NET (rebuilt 2026-07-29, telemetry-gaps pass). The page finally answers "what is my network
   DOING" instead of restating disk I/O: link & path (adapter, Wi-Fi radio, IP/DNS — local reads,
   auto on open), and internet tests that are EXPLICIT-ONLY because they spend the user's
   bandwidth — the price is printed on the button, and nothing fires by itself, ever. */
RENDER.net=()=>{

  {const ifs=t.net.ifaces, ifc=$('#ifCard');
