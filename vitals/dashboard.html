<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITALS</title>
<style>
:root{
  --bg:#07090e; --glass:rgba(14,18,28,.62); --glass-2:rgba(20,26,40,.5);
  --line:rgba(var(--acc2),.13); --line-2:rgba(var(--acc2),.07);
  --ink:#e8eef8; --ink-2:#93a3bd; --ink-3:#5e6c85;
  --cpu:#3ad4c8; --mem:#9d7dfb; --disk:#f0a63c; --gpu:#5ee08a; --net:#4d9dff;
  --crit:#ff5c6e; --warn:#ffb03a; --ok:#4fd18b;
  /* THEME SYSTEM (2026-07-29). Every colour the UI uses resolves through a custom property, in
     two spellings: hex for text/canvas (`--cpu`), and an R,G,B TRIPLET twin (`--cpu-r`) so the
     dozens of alpha variants ride the theme for free — rgba(var(--cpu-r),.35). `--fg` is the
     "chrome alpha base": every hover fill / track / hairline that used to be rgba(var(--fg),x)
     is really "foreground at low alpha", which is white on dark and near-black on paper. */
  --cpu-r:58,212,200; --mem-r:157,125,251; --disk-r:240,166,60; --gpu-r:94,224,138; --net-r:77,157,255;
  --crit-r:255,92,110; --warn-r:255,176,58; --ok-r:79,209,139;
  --fg:255,255,255; --acc2:150,180,230;
  --shell-bg:linear-gradient(160deg,rgba(7,9,14,.80),rgba(9,12,20,.72) 45%,rgba(7,9,14,.84));
  --shell-line:rgba(var(--acc2),.14);
  --rail-bg:rgba(8,11,18,.45);
  --dock-bg:linear-gradient(180deg,rgba(9,11,17,.965),rgba(11,14,22,.945));
  --dock-line:rgba(var(--acc2),.10);
  --tip-bg:rgba(12,16,25,.97);
  --elev:0 0 0 rgba(0,0,0,0);            /* card elevation: dark zones by fill, light by shadow */
  --elev2:0 10px 30px rgba(0,0,0,.55);   /* floating surfaces (tooltip) */
  --sgk:1; --disp-sh:0 0 22px rgba(0,0,0,.6);
                                /* CSS glow scale: box-shadow blur = calc(Npx*var(--sgk)) */
  /* canvas-side theme hooks — read live via getComputedStyle by every 2D painter */
  --fx-glow:1;                            /* multiplies every canvas shadowBlur */
  --cv-track:rgba(var(--fg),.035); --cv-grid:rgba(var(--fg),.045);
  --cv-label:rgba(148,163,189,.62);  --cv-core:rgba(var(--fg),.92);
  /* canvas accents: PRO renders its instruments in dark wells inside paper chrome, so the canvas
     accent set must be able to differ from the DOM accent set. Everywhere else they are the same. */
  --cv-cpu:var(--cpu); --cv-mem:var(--mem); --cv-disk:var(--disk); --cv-gpu:var(--gpu);
  --cv-net:var(--net); --cv-ok:var(--ok); --cv-warn:var(--warn); --cv-crit:var(--crit);
  /* WebGL field: colours + response, uploaded as uniforms on load/theme switch */
  --f-cool:#0e1d2d; --f-acc:#216670; --f-warm:#4d1d22;
  --f-base:.55; --f-range:.75; --f-vig:.85; --f-pmul:1; --field-op:.5;
  /* FX surface dials (2026-07-29): field time base (shader uniform) and the generalized
     scanline overlay opacity (0 = off everywhere except beast's own shell stripes). */
  --f-speed:.035; --scan:0;
  /* treemap reclaimability palette (playbook §2.4 tiers), as R,G,B TRIPLETS so per-tile alpha can
     ride along: rgba(var(--t1),.3). Luminance falls as caution rises — mint (act) is brightest,
     steel (keep out) is dimmest — so the 4-way encoding survives every colour-blindness axis.
     t2 is the --disk amber on purpose: "decide" is this page's accent doing its old job. */
  --t1:63,227,164; --t2:240,166,60; --t3:168,143,250; --t4:100,126,166; --tn:132,148,175;
  --r:14px;
  /* surface language (2026-07-29, owner-approved): tighter radii — surfaces 5px, controls 4px.
     "technical sophisticate but restrained" — the soft 11-14px pillow corner was the last
     2020-era tell; instruments have machined corners, not cushions. */
  --rs:5px; --rc:4px;
  /* meter texture lifted from beast (owner: "i like the texture of the meter bars on the home
     page in beast mode") — scanline striation on the value beams, drawn as a screen-space
     pattern stroke clipped to the beam. 0 disables (beast gets it free from its shell overlay). */
  --cv-beam-tex:.22;
  /* display numerals get the Display optical face — Fluent 2's own choice for 30-50px settings;
     the text face at that size is the "default stack" tell (DESIGN_EVAL.md 2026-07-28) */
  --disp:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
/* ---- LIGHT "daylight" — not inverted dark: warm paper, real shadow instead of glow, accents
   re-derived so they stay vivid AND hold contrast on white. ---- */
:root[data-theme=light]{
  --bg:#f3f2ee; --glass:rgba(255,255,255,.74); --glass-2:rgba(247,248,250,.62);
  --line:rgba(30,45,80,.15); --line-2:rgba(30,45,80,.08);
  --ink:#141a28; --ink-2:#44526c; --ink-3:#79859b;
  --cpu:#00988e; --mem:#6b4bee; --disk:#d47b00; --gpu:#0f9b52; --net:#1e6cf0;
  --crit:#df2245; --warn:#c07600; --ok:#0d9a5c;
  --cpu-r:0,152,142; --mem-r:107,75,238; --disk-r:212,123,0; --gpu-r:15,155,82; --net-r:30,108,240;
  --crit-r:223,34,69; --warn-r:192,118,0; --ok-r:13,154,92;
  --fg:20,32,58; --acc2:60,90,140;
  --shell-bg:linear-gradient(160deg,rgba(249,248,245,.87),rgba(253,253,251,.80) 45%,rgba(247,247,244,.89));
  --shell-line:rgba(40,60,100,.18);
  --rail-bg:rgba(255,255,255,.55);
  --dock-bg:linear-gradient(180deg,rgba(251,251,249,.97),rgba(245,246,244,.95));
  --dock-line:rgba(40,60,100,.15);
  --tip-bg:rgba(255,255,255,.98);
  --elev:0 1px 2px rgba(25,35,60,.05),0 6px 18px rgba(25,35,60,.07);
  --elev2:0 12px 32px rgba(25,35,60,.20);
  --disp-sh:none;
  --sgk:.3; --fx-glow:.25;
  --cv-track:rgba(20,32,58,.09); --cv-grid:rgba(20,32,58,.07);
  --cv-label:rgba(68,82,108,.78); --cv-core:rgba(20,30,50,.9);
  --f-cool:#dde2e4; --f-acc:#c3d9d7; --f-warm:#ecd3cd;
  --f-base:.92; --f-range:.10; --f-vig:.25; --f-pmul:1; --field-op:.6;
  --t1:0,150,96; --t2:206,120,0; --t3:112,80,224; --t4:92,110,138; --tn:112,124,142;
  --cv-beam-tex:.13;
}
/* ---- PRO "studio" — the owner's sentence taken literally: a light mode with dark where needed.
   Paper chrome for reading; DARK INSTRUMENT WELLS where the data is light-emissive. Chrome
   accents are restrained; the canvas set inside the wells stays vivid. Minimal glow. ---- */
:root[data-theme=pro]{
  --bg:#eceef1; --glass:rgba(255,255,255,.68); --glass-2:rgba(245,247,249,.56);
  --line:rgba(30,40,60,.14); --line-2:rgba(30,40,60,.075);
  --ink:#171c26; --ink-2:#495568; --ink-3:#818b9b;
  --cpu:#0e7f78; --mem:#5b51c4; --disk:#a86f12; --gpu:#1d8a52; --net:#2b62c9;
  --crit:#c22e47; --warn:#a06e0a; --ok:#1e8a5e;
  --cpu-r:14,127,120; --mem-r:91,81,196; --disk-r:168,111,18; --gpu-r:29,138,82; --net-r:43,98,201;
  --crit-r:194,46,71; --warn-r:160,110,10; --ok-r:30,138,94;
  --fg:24,32,48; --acc2:55,80,120;
  --shell-bg:linear-gradient(160deg,rgba(243,244,247,.88),rgba(249,250,252,.82) 45%,rgba(241,242,245,.90));
  --shell-line:rgba(35,50,80,.17);
  --rail-bg:rgba(255,255,255,.58);
  --dock-bg:linear-gradient(180deg,rgba(249,250,251,.97),rgba(243,244,246,.95));
  --dock-line:rgba(35,50,80,.14);
  --tip-bg:rgba(255,255,255,.98);
  /* PRO v2 (2026-07-29): the owner condemned v1 — "90s css shadows of blur". ZERO blur
     anywhere in this theme: elevation is a crisp hairline ring, wells are flat with machined
     1px bezels. If it reads lazy it gets scrapped, not softened. */
  --elev:0 0 0 1px rgba(20,30,50,.10);
  --elev2:0 0 0 1px rgba(20,30,50,.22);
  --disp-sh:none;
  --sgk:.4; --fx-glow:.5;
  --cv-beam-tex:.25;
  /* the wells */
  --well:#12161d; --well-2:#161b23;
  --cv-track:rgba(255,255,255,.05); --cv-grid:rgba(255,255,255,.055);
  --cv-label:rgba(158,172,196,.72); --cv-core:rgba(255,255,255,.92);
  --cv-cpu:#2fd6c9; --cv-mem:#9d86ff; --cv-disk:#f2a83e; --cv-gpu:#54e08c; --cv-net:#5aa2ff;
  --cv-ok:#43d68d; --cv-warn:#ffb03a; --cv-crit:#ff5c6e;
  --f-cool:#e6e8eb; --f-acc:#dbe4e4; --f-warm:#e9dcd8;
  --f-base:.95; --f-range:.05; --f-vig:.18; --f-pmul:.7; --field-op:.35;
}
/* ---- BEAST "overdrive" — for the super tech nerds: hyper-chroma, glow up, field amped,
   scanlines. Costs more only while displayed; every photon still encodes. ---- */
:root[data-theme=beast]{
  --bg:#020409; --glass:rgba(10,14,24,.55); --glass-2:rgba(16,22,36,.45);
  --line:rgba(120,200,255,.16); --line-2:rgba(120,200,255,.08);
  --ink:#eaf6ff; --ink-2:#8fb3d6; --ink-3:#54718f;
  --cpu:#00f5e4; --mem:#b57bff; --disk:#ffb018; --gpu:#3dff8f; --net:#3aa8ff;
  --crit:#ff2e55; --warn:#ffc02e; --ok:#2effa0;
  --cpu-r:0,245,228; --mem-r:181,123,255; --disk-r:255,176,24; --gpu-r:61,255,143; --net-r:58,168,255;
  --crit-r:255,46,85; --warn-r:255,192,46; --ok-r:46,255,160;
  --fg:190,235,255; --acc2:120,200,255;
  --shell-bg:linear-gradient(160deg,rgba(2,4,10,.86),rgba(4,8,16,.78) 45%,rgba(2,4,10,.88));
  --shell-line:rgba(0,245,228,.22);
  --rail-bg:rgba(3,6,13,.5);
  --dock-bg:linear-gradient(180deg,rgba(3,5,11,.97),rgba(5,8,16,.95));
  --dock-line:rgba(0,245,228,.14);
  --tip-bg:rgba(4,8,16,.97);
  --sgk:1.6; --fx-glow:1.7;
  --cv-track:rgba(140,220,255,.05); --cv-grid:rgba(140,220,255,.07);
  --cv-label:rgba(140,185,225,.7); --cv-core:rgba(255,255,255,.95);
  --f-cool:#04121f; --f-acc:#12717f; --f-warm:#6e1130;
  --f-base:.50; --f-range:1.0; --f-vig:.9; --f-pmul:2.2; --field-op:.62;
  --t1:46,255,160; --t2:255,176,24; --t3:181,123,255; --t4:90,130,180; --tn:120,150,190;
  --cv-beam-tex:0; /* the shell scanlines already stripe the beams — doubling would moiré */
}
/* pro: dark instrument wells — solid grounds under everything light-emissive, plus scoped ink
   overrides so DOM text INSIDE a well reads light (canvas text uses the root --cv-* set). */
:root[data-theme=pro] .chart,:root[data-theme=pro] .tmap{
  background:var(--well); --ink:#e8eef8; --ink-2:#93a3bd; --ink-3:#8391a8; --fg:232,238,248;
  --line:rgba(var(--acc2),.13); --line-2:rgba(var(--acc2),.07);
  box-shadow:0 0 0 1px rgba(20,30,50,.30); /* machined edge — the panel is deliberate, not a shadowless hole */
}
:root[data-theme=pro] #core::before{
  /* v2: FLAT disc, machined bezel. v1's radial-gradient fade edge + blur shadow was the owner's
     "90s css shadows of blur" — a well is a milled cavity, not a smudge. Outer 1px dark bezel,
     inner 1px light catch-edge, zero blur, zero gradient. */
  content:'';position:absolute;left:50%;top:50%;height:100%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:var(--well-2);
  border:1px solid #29323f;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);
}
/* the absolutely-positioned well paints ABOVE a non-positioned canvas (positioned boxes come
   later in the paint order) — lift the canvas into the positioned layer above it */
:root[data-theme=pro] #coreC{position:relative;z-index:1}
:root[data-theme=pro] #coreLabel{--ink:#e8eef8;--ink-2:#93a3bd;--ink-3:#7f8da4;color:var(--ink)}
:root[data-theme=pro] .gauge::before{
  content:'';position:absolute;inset:-2px;border-radius:50%;
  background:var(--well-2);
  border:1px solid #29323f;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);
}
:root[data-theme=pro] .gauge{--ink:#e8eef8;--ink-2:#93a3bd;--ink-3:#8391a8}
:root[data-theme=pro] .gauge .gv{color:var(--ink)}
/* the caps label straddled the disc edge (half on dark, half on paper) — with the v2 crisp disc
   filling the cell, the label must clear it entirely: fully below, in paper ink */
:root[data-theme=pro] .gauge .gv em{bottom:-17px;color:#79859b}
/* beast: scanlines over the shell — static texture, zero motion, compositor-cheap */
:root[data-theme=beast] #shell::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:80;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  opacity:.5;border-radius:inherit;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:transparent; color:var(--ink);
  font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  user-select:none; cursor:default;
}
/* width/height are REQUIRED here: <canvas> is a replaced element, so `inset:0` alone does not
   stretch it — it falls back to its intrinsic (attribute) size. Without these the JS sizer reads
   its own output and spirals toward zero. */
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:var(--field-op,.5)}
#shell{
  position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:62px 1fr;
  /* minmax(0,1fr), not the implicit auto row: an auto grid row cannot shrink below its tallest
     item's min-content. Once the rail's button stack outgrew short windows (18 items ≈ 819px),
     the row — and #main with it — silently stretched past the viewport, so the overview rings
     sized themselves to a phantom height and the page opened "too big" with the bottom clipped. */
  grid-template-rows:minmax(0,1fr);
  background:var(--shell-bg);
  backdrop-filter:blur(22px) saturate(1.25); -webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid rgba(var(--acc2),.14); border-radius:var(--r); overflow:hidden;
}
/* The 22px backdrop blur is the single most expensive CSS property on the page — a real-time
   gaussian recomputed on every composite. It only produces photons where the WebGL field shows
   through --shell-bg (the field is the ONLY thing behind #shell; the OS desktop never reaches a
   CSS backdrop). While DOCKED the field loop is skipped entirely, so the blur would be diffusing
   a static solid: GPU work, zero visible pixels — off. Manual dial for the floating panel:
   localStorage vitals-shell-blur = 0 (measured cost + the visual trade are printed on FOOTPRINT). */
body.docked #shell, html.noblur #shell{ backdrop-filter:none; -webkit-backdrop-filter:none }
/* Display watchdog chip — shown only when the render heart has verifiably stopped (see watchdog
   JS). A 24/7 instrument must never look alive while frozen; this is the visible confession. */
#stallChip{
  position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:90;
  background:var(--crit);color:#fff;font:600 10px/1 ui-sans-serif,system-ui;
  letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:4px;
}
/* ---- drag handle ----
   NOT -webkit-app-region: that only works for installed PWAs and Electron, and does nothing in an
   Edge --app window. Dragging is handed to the native window agent instead (see wireWindow). */
#grip{position:fixed;top:0;left:62px;right:96px;height:34px;z-index:6;cursor:grab}
/* The docked strip is itself the handle, so it carries the affordance - and the controls on it
   opt back out, because a button that says "grab" is lying about what it does. */
body.docked #shell{cursor:grab}
body.docked #shell button,body.docked #shell .btn,body.docked #shell .cm,
body.docked #shell .rb,body.docked #shell [data-go]{cursor:pointer}
#grip:active{cursor:grabbing}
#wctl{position:fixed;top:0;right:0;height:34px;z-index:7;display:flex;align-items:center;gap:2px;padding-right:6px}
#wctl button{
  width:30px;height:24px;border:0;background:transparent;color:var(--ink-3);border-radius:6px;
  cursor:pointer;font:inherit;font-size:13px;line-height:1;display:grid;place-items:center;transition:all .15s;
}
#wctl button:hover{background:rgba(var(--fg),.10);color:var(--ink)}
#wctl button.x:hover{background:rgba(var(--crit-r),.85);color:#fff}
#wctl svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round}

/* ---- rail ---- */
#rail{
  border-right:1px solid var(--line); display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:3px;background:var(--rail-bg);
}
/* With the row clamped above, a short window height-constrains the rail. Buttons compress evenly
   toward a 30px floor instead of overflowing invisibly — no scrollbar (owner's no-scroll law). */
#rail .rb{flex:0 1 44px;height:auto;min-height:30px}
.rb{
  width:44px;height:44px;border-radius:9px;display:grid;place-items:center;cursor:pointer;
  color:var(--ink-3);transition:background .18s,color .18s,transform .18s;position:relative;
}
.rb:hover{background:rgba(var(--fg),.05);color:var(--ink-2)}
.rb.on{background:rgba(var(--fg),.08);color:var(--ink)}
/* owner (2026-07-29): "on light mode and pro mode the lightbulb tab is just on grey not white" —
   the near-black --fg at .08 over an off-white rail reads as a grey smudge. On paper themes the
   active tab is a RAISED WHITE KEY: solid white, hairline ring, and (light only) real elevation. */
:root[data-theme=light] .rb.on{background:#fff;box-shadow:0 0 0 1px var(--line),var(--elev)}
:root[data-theme=pro] .rb.on{background:#fff;box-shadow:0 0 0 1px rgba(20,30,50,.16)}
.rb.on::before{content:'';position:absolute;left:-10px;top:12px;bottom:12px;width:2px;border-radius:2px;background:currentColor}
.rb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rb .tip{
  position:absolute;left:52px;padding:4px 9px;background:var(--tip-bg);border:1px solid var(--line);
  border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;
  color:var(--ink);z-index:20;
}
.rb:hover .tip{opacity:1}
.rail-sp{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--crit);transition:background .3s}
/* The indicator reads as a readout, not a control: no hover lift, and a cursor that says "this tells
   you something" rather than "press me". It is still clickable - it goes to the page that explains
   the state - but it should not promise a button's worth of behaviour. */
.rb.stat{cursor:help}
.rb.stat:hover{background:transparent}
.dot.live{background:var(--ok);box-shadow:0 0 calc(8px*var(--sgk)) var(--ok)}

/* ---- main ---- */
#main{position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{
  height:34px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;
  border-bottom:1px solid var(--line-2);font-size:11px;color:var(--ink-3);letter-spacing:.04em;
}
#top b{color:var(--ink-2);font-weight:600}
#top .sep{width:1px;height:12px;background:var(--line)}
#pressure{margin-left:auto;display:flex;align-items:center;gap:7px}
#pbar{width:80px;height:4px;border-radius:2px;background:rgba(var(--fg),.08);overflow:hidden}
#pbar i{display:block;height:100%;width:0%;background:var(--ok);transition:width .5s cubic-bezier(.22,1,.36,1),background .5s}
#view{flex:1;position:relative;overflow:hidden}
/* A page stays a BLOCK container (2026-07-29). Making it a column flex to absorb overflow LOOKED
   right and clipped real content: under flex, an item whose overflow is not `visible` gets
   min-height:auto → 0 (CSS sizing spec — the automatic minimum only protects non-scroll-containers),
   so every .find/.card with overflow:hidden silently shrank and cut its own text in half. The owner
   caught it on the Startup page: a finding card showing one and a half lines of a three-line warning.
   Pages are fixed instrument layouts, not feeds — the owner's read: "those arent like forever
   expanding lists. theyre set on memory". So they are made to FIT, and only a genuinely deep inner
   list is allowed its own scroll. overflow:auto stays as a safety net: clipping a future too-tall
   page would hide the regression, and a silently clipped page is the same failure as a plausible zero. */
.page{position:absolute;inset:0;overflow:auto;padding:16px;opacity:0;pointer-events:none;transition:opacity .26s;}

/* --- page fit at 1080x720, the owner's real window (2026-07-29) ---
   ONE PAGE, NO INNER SCROLLS on the instrument pages. The owner's rule, and he is right: an inner
   scrollbar on a fixed readout is a second navigation model competing with the page, and it hides
   information behind a gesture nobody thinks to make. "that should be a 1 page format, no seperate
   scrolls ... if its zoomed and a scroll happens its the whole window."
   So the escape hatch is the PAGE's own scroll (kept below), and each page earns its fit honestly:
     · Storage — the treemap sizes to the window (see .tmap); folder count was never the problem.
     · Memory  — the row count is measured each tick and the deficit cleared in one pass.
     · therm / clean / net / fx — tightened; see below.
   The Console (SYS) is the deliberate exception: it is a console, a FEED, and its journal, raw tick
   and socket table are all unbounded history, so those three scroll on purpose.

   FIXED INSTRUMENT LAYOUTS are tightened, never scrolled. Thermals-and-power and Reclaim have no
   expandable list — they are a set of gauges and a set of known targets. Owner: "those arent like
   forever expanding lists. theyre set on memory ... just make them fit, not scroll weird." 3 px off
   card padding and 4 px off the row gaps recovers the 26-27 px they were over without dropping a row
   or truncating a sentence. Net gets the same tightening so its per-process fit loop has slack to
   converge into rather than fighting the page for the last few pixels. */
#p-therm .card,#p-clean .card,#p-net .card{padding:10px}
#p-therm .g2,#p-clean .g2,#p-net .g2{gap:9px;margin-bottom:4px}
#p-therm .hero,#p-clean .hero,#p-net .hero{margin-bottom:8px}
#p-therm .hd,#p-clean .hd{margin-bottom:6px}
#p-clean .hero{margin-bottom:4px}   /* reclaim is the densest of the three — 4 px more to land it */
.page.on{opacity:1;pointer-events:auto}
.page::-webkit-scrollbar{width:9px}
.page::-webkit-scrollbar-thumb{background:rgba(var(--acc2),.18);border-radius:5px}
.page::-webkit-scrollbar-track{background:transparent}

/* ---- TIME: clock + stopwatch (2026-07-30) ---- */
.hclk{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink-2);cursor:pointer}
.hclk:hover{color:var(--ink)}
#p-tools .tcard{display:flex;flex-direction:column;min-height:0}
/* ---- the bento grid (2026-07-30) ----
   A tools page, not a clock page. Tiles are deliberately different sizes: the ones you READ at a
   glance (clock, power) are small, the ones you WORK in (clipboard, ports) get room. Auto-fill rather
   than a fixed column count so the same grid survives the 1080 window and the design budget. */
/* The page must be a COLUMN for the grid to have a definite height - otherwise grid-auto-rows:1fr has
   nothing to divide and every row sizes to content, which is what pushed the tiles off the bottom.
   .hd is flex:none so only the grid absorbs the remainder; each tile clips its own overflow. */
#p-tools{display:flex;flex-direction:column}
#p-tools>.hd{flex:none}
#p-tools .bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);
  gap:10px;flex:1 1 auto;min-height:0}
.bt{background:var(--glass);border:1px solid transparent;border-radius:var(--rs);padding:10px 12px;
  box-shadow:var(--elev);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bt>h4{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  margin-bottom:6px;display:flex;align-items:center;gap:6px;flex:none}
.bt>h4 .sbt{margin-left:auto;cursor:pointer;color:var(--ink-2);letter-spacing:.08em;text-transform:none;
  font-size:9px;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.bt>h4 .sbt:hover{color:var(--ink);background:rgba(var(--fg),.06)}
.bt-body{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.bt-body::-webkit-scrollbar{width:0;height:0}
.bt.w2{grid-column:span 2}
.bt.h2{grid-row:span 2}
.btbig{font-family:var(--disp);font-weight:200;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1}
.btsub{font-size:9.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.clip-row{padding:4px 0;border-bottom:1px solid var(--line-2);font-size:10.5px;line-height:1.4}
.clip-row:last-child{border-bottom:0}
.clip-row .cmeta{font-size:8.5px;color:var(--ink-3);letter-spacing:.05em;display:flex;gap:7px}
.clip-row .ctext{color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:34px;overflow:hidden;margin-top:2px}
.clip-row.skip .ctext{color:var(--ink-3);font-style:italic;opacity:.7}
.cthumb{display:block;max-width:100%;max-height:56px;border-radius:4px;border:1px solid var(--line-2);
  margin-top:3px;cursor:zoom-in;object-fit:cover;object-position:top left}
.cthumb:hover{border-color:rgba(var(--acc2),.5)}
.cpath{font-size:9.5px;color:var(--ink-2);cursor:pointer;padding:1px 0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cpath:hover{color:rgb(var(--acc2));text-decoration:underline}
.curl{display:block;font-size:9px;color:var(--ink-3);margin-top:2px;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curl:hover{color:rgb(var(--acc2));text-decoration:underline}
/* full-size viewer: the panel is small, so an image opens over the whole window rather than inside a
   tile that would shrink it to a stamp again */
#clipView{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);display:none;
  align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
#clipView.on{display:flex}
#clipView img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#clipView .cvbar{position:absolute;top:8px;left:12px;right:12px;display:flex;gap:10px;align-items:center;
  font-size:10px;color:rgba(255,255,255,.75);letter-spacing:.08em}
#clipView .cvbar a{color:rgba(255,255,255,.9);cursor:pointer;text-decoration:underline}
.prow2{display:flex;gap:8px;font-size:10px;padding:2px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.prow2 .pp{width:52px;flex:none;color:var(--ink);font-variant-numeric:tabular-nums}
.prow2 .ps{width:64px;flex:none;color:var(--ink-3)}
.prow2 .pn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
/* three buttons in a one-cell tile: stacked, full width, so none of them truncates */
.frow{display:flex;flex-direction:column;gap:4px}
.frow .btn{width:100%;text-align:center;padding:3px 0;font-size:10px}
/* ---- ASK: one card, thread scrolls, composer pinned to the bottom ---- */
#p-ask{display:flex;flex-direction:column}
#p-ask>.hd{flex:none;display:flex;align-items:center;gap:9px}
.askset{display:flex;align-items:center;gap:6px}
.askset select{background:rgba(var(--fg),.05);border:1px solid var(--line);border-radius:4px;
  color:var(--ink-2);font:inherit;font-size:9.5px;padding:2px 5px;cursor:pointer}
.askset select:focus{outline:none;border-color:rgba(var(--acc2),.45)}
.askset .sbt{cursor:pointer;font-size:9.5px;letter-spacing:.08em;padding:2px 8px;
  border:1px solid var(--line);border-radius:4px;color:var(--ink-2)}
.askset .sbt:hover{color:var(--ink);background:rgba(var(--fg),.06)}
.askcard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.askthread{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.askthread::-webkit-scrollbar{width:0}
.askmsg{margin-bottom:11px}
.askwho{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.askmsg.user .askwho{color:rgb(var(--acc2))}
.asktext{font-size:12px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.askmsg.user .asktext{color:var(--ink)}
.askbar{flex:none;display:flex;gap:7px;align-items:flex-end;margin-top:8px;padding-top:9px;border-top:1px solid var(--line-2)}
.askbar textarea{flex:1;min-width:0;resize:none;background:rgba(var(--fg),.05);border:1px solid var(--line);
  border-radius:6px;color:var(--ink);font:inherit;font-size:12px;padding:7px 9px;max-height:110px;line-height:1.5}
.askbar textarea:focus{outline:none;border-color:rgba(var(--acc2),.45)}
.askbar .btn{flex:none}
.asksug{flex:none;display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.asksug .sbt{cursor:pointer;font-size:9.5px;letter-spacing:.02em;text-transform:none;
  border:1px solid var(--line);border-radius:11px;padding:2px 9px;color:var(--ink-3)}
.asksug .sbt:hover{color:var(--ink);border-color:rgba(var(--acc2),.4)}

/* network records: timestamp, value, and its own x. Compact enough that a dozen fit the tile. */
.nrecs{margin-top:4px}
.nrec{display:flex;align-items:baseline;gap:6px;font-size:9.5px;padding:1.5px 0;color:var(--ink-2)}
.nrec .nt{color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.nrec .nv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrec .nv b{color:var(--ink);font-weight:600}
.nrec .nx{flex:none;cursor:pointer;color:var(--ink-3);font-size:11px;line-height:1;opacity:.6}
.nrec .nx:hover{color:var(--crit);opacity:1}
/* watch rows: label, what it is waiting for, and how far along the hold is */
.wrow{padding:5px 0;border-bottom:1px solid var(--line-2)}
.wrow:last-child{border-bottom:0}
.wrow.done{opacity:.6}
.wtop{display:flex;align-items:baseline;gap:6px;font-size:10.5px;color:var(--ink)}
.wtop b{font-weight:600}
.wtop .wx{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:12px;line-height:1}
.wtop .wx:hover{color:var(--crit)}
.wmeta{font-size:9px;color:var(--ink-3);margin-top:1px}
.wbar{height:3px;background:rgba(var(--fg),.08);border-radius:2px;margin-top:4px;overflow:hidden}
.wbar i{display:block;height:100%;background:rgb(var(--acc2));border-radius:2px;transition:width .4s linear}
/* Stacked, not side by side: a bento tile is roughly 230 px wide, and a 200 px dial plus a column of
   text beside it does not fit in that. Canvas takes the remaining height, the readout sits under it. */
.clockrow{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.clockwrap{position:relative;flex:1 1 auto;min-height:0}
.clockside{flex:none;text-align:center;padding-top:4px}
.cmeta{font-size:9.5px;color:var(--ink-3);letter-spacing:.08em;margin-top:6px;opacity:.8}
/* absolute, like #coreC: a canvas that reports its backing store as a layout height is how the
   overview rings ended up pushed down the page. Same law, same fix. */
#clockC{position:absolute;inset:0;width:100%;height:100%}
.clockmid{position:relative;text-align:center;pointer-events:none}
.cnum{font-family:var(--disp);font-size:32px;font-weight:200;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:var(--disp-sh);line-height:1}
.cday{font-size:9px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
/* ---- docked strip: clock under the ring, then the stopwatch ---- */
.sbclock{position:relative;height:104px;margin:2px 0 4px;flex:none}
#sbClockC{position:absolute;inset:0;width:100%;height:100%}
.sbtime{text-align:center;font-family:var(--disp);font-size:22px;font-weight:200;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;flex:none}
.sbdate{text-align:center;font-size:8.5px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;flex:none}
/* Air above the timer replaces the heading that used to separate it from the date, and air below it
   keeps the readout from sitting on the buttons. Padding rather than margin so it cannot collapse
   into the neighbouring block. */
.sbsw{flex:none;padding:13px 4px 0}
.sbswbig{text-align:center;font-family:var(--disp);font-size:19px;font-weight:200;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.sbswrow{display:flex;gap:4px;margin-top:11px}
.sbswrow .btn{flex:1;padding:2px 0;font-size:9.5px;text-align:center}
.sbswnote{font-size:8px;color:var(--ink-3);letter-spacing:.06em;margin-top:4px;line-height:1.4;text-align:center}
.swbig{font-family:var(--disp);font-size:34px;font-weight:200;letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;text-shadow:var(--disp-sh);margin:2px 0 8px;line-height:1}
.swrow{display:flex;gap:8px;align-items:center}
.swtrk{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:4px}
.swchk{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
/* The BOX carries the colour, so the separate swatch that used to sit between box and label is gone -
   it was saying the same thing twice and it was the reason the row wrapped. appearance:none because a
   native checkbox will not let you colour its border, only its checked fill via accent-color. */
.swchk input{appearance:none;-webkit-appearance:none;flex:none;width:12px;height:12px;margin:0;
  border:1.5px solid var(--c,var(--ink-3));border-radius:3px;background:transparent;cursor:pointer;position:relative}
.swchk input:checked{background:var(--c,rgb(var(--acc2)))}
.swchk input:checked::after{content:'';position:absolute;left:3.5px;top:1px;width:3px;height:6px;
  border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.swchk input:hover{filter:brightness(1.25)}
.swdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
.swtab{width:100%;margin-top:5px}
.swtab td,.swtab th{padding:3px 4px}

/* ---- overview ---- */
/* grid-template-rows is EXPLICIT (2026-07-29): height:100% sizes the box, but an implicit `auto` row
   still sizes to content, so the row has to be told it may shrink. Same fix as #shell's rail row. */
#ov{display:grid;grid-template-columns:1fr 264px;grid-template-rows:minmax(0,1fr);gap:16px;height:100%;padding:16px}
#core{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
/* The canvas is ABSOLUTE so it contributes NOTHING to layout (2026-07-29). This is the third face of
   the canvas-sizing law. A <canvas> is a REPLACED element: when `height:100%` cannot resolve against an
   indefinite parent it falls back to the intrinsic size — which is the BACKING STORE (663x612 here).
   So the canvas was reporting its own pixel buffer as a layout height, #ov's content stayed ~628 px
   tall however small the window got, .page overflowed (measured 341 px at a 330 px box) and its
   scrollbar pushed the rings down the page — the owner's "circles are now way down the page for no
   reason", after a dock cycle left the panel briefly short. geo() then sizes the buffer FROM that box,
   so buffer -> layout -> buffer is a genuine feedback loop; taking the canvas out of flow cuts it.
   inset:0 alone does NOT stretch a replaced element (arc-2 lesson) — the explicit 100%/100% is what
   sizes it, and absolute is what stops it pushing back. */
#coreC{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#coreLabel{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
/* the readout sits BELOW centre: the arcs are busiest across the top of the hole, and the open
   mouth at the left now carries the per-ring readouts — the type belongs in the calm lower half */
#coreLabel>div{transform:translateY(9.5%)}
#coreLabel .big{font-size:52px;font-weight:200;letter-spacing:-.03em;line-height:1;color:var(--ink)}
#coreLabel .big small{font-size:20px;color:var(--ink-3);font-weight:300;margin-left:2px}
#coreLabel .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase;margin-top:9px}
#coreLabel .hint{font-size:10px;color:var(--ink-3);opacity:.5;margin-top:20px;letter-spacing:.06em}
#tiles{display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:0}
.tile{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;cursor:pointer;box-shadow:var(--elev);
  transition:border-color .18s,background .18s,transform .18s;position:relative;overflow:hidden;flex:none;
}
.tile:hover{border-color:rgba(var(--acc2),.3);background:var(--glass-2);transform:translateY(-1px)}
.tile .th{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.tile .th i{width:7px;height:7px;border-radius:2px;display:block}
.tile .tv{font-size:23px;font-weight:250;margin-top:5px;letter-spacing:-.02em}
.tile .tv small{font-size:12px;color:var(--ink-3);margin-left:3px;font-weight:400}
.tile .td{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.tile canvas{position:absolute;right:0;bottom:0;width:100%;height:30px;opacity:.35}

/* ---- generic panels ---- */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{font-size:15px;font-weight:500;letter-spacing:-.01em}
.hd .n{font-size:11px;color:var(--ink-3)}
.hd .sp{flex:1}
/* Borders mean INTERACTION (DESIGN_EVAL.md 2026-07-28): static info surfaces zone by fill alone
   (transparent border keeps the geometry identical); edges stay on things you can act on —
   tiles, standalone buttons — and on severity borders, which are data. */
.card{background:var(--glass);border:1px solid transparent;border-radius:var(--rs);padding:13px;margin-bottom:12px;box-shadow:var(--elev)}
.card h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;font-weight:600}
.btn{
  background:rgba(var(--fg),.06);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--rc);
  padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer;transition:all .16s;white-space:nowrap;
}
.btn:hover{background:rgba(var(--fg),.11);color:var(--ink);border-color:rgba(var(--acc2),.3)}
.btn:active{transform:scale(.97)}
.btn.go{background:rgba(var(--cpu-r),.13);border-color:rgba(var(--cpu-r),.35);color:var(--cpu)}
.btn.go:hover{background:rgba(var(--cpu-r),.22)}
.btn.dgr{background:rgba(var(--crit-r),.11);border-color:rgba(var(--crit-r),.3);color:var(--crit)}
.btn.dgr:hover{background:rgba(var(--crit-r),.2)}
.btn[disabled]{opacity:.35;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:0 8px 7px;border-bottom:1px solid var(--line);
}
td{padding:6px 8px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
tr:hover td{background:rgba(var(--fg),.025);color:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;background:rgba(var(--fg),.07);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:2px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.tag{
  display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:9.5px;letter-spacing:.05em;
  text-transform:uppercase;font-weight:600;
}
.tag.t1{background:rgba(var(--ok-r),.15);color:var(--ok)}
.tag.t2{background:rgba(var(--warn-r),.15);color:var(--warn)}
.tag.sus{background:rgba(var(--crit-r),.16);color:var(--crit)}
.tag.off{background:rgba(var(--fg),.07);color:var(--ink-3)}
.muted{color:var(--ink-3)}
.crit{color:var(--crit)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.crumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);margin-bottom:9px;flex-wrap:wrap}
.crumb span{cursor:pointer;padding:2px 6px;border-radius:5px}
.crumb span:hover{background:rgba(var(--fg),.06);color:var(--ink)}
.spin{width:13px;height:13px;border:2px solid rgba(var(--fg),.13);border-top-color:var(--cpu);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:12px}
.note{font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.note b{color:var(--ink-2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.kv:last-child{border:0}
.kv b{font-weight:500;color:var(--ink)}
#coreGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px;margin-top:6px}
.ccell{height:26px;border-radius:4px;background:rgba(var(--fg),.05);position:relative;overflow:hidden}
.ccell i{position:absolute;left:0;right:0;bottom:0;background:var(--cpu);transition:height .35s cubic-bezier(.22,1,.36,1);opacity:.8}
.ccell u{position:absolute;inset:0;display:grid;place-items:center;font-size:8.5px;color:var(--ink-3);text-decoration:none}
/* ---- diagnosis ---- */
.badge{position:absolute;top:6px;right:6px;min-width:15px;height:15px;border-radius:8px;background:var(--crit);
  color:#fff;font-size:9px;font-style:normal;display:none;place-items:center;padding:0 4px;font-weight:700}
.badge.on{display:grid}
#verdict{position:relative;border-radius:6px;padding:19px 22px 17px 25px;margin-bottom:14px;border:1px solid transparent;box-shadow:var(--elev);
  background:var(--glass);overflow:hidden;--vc:var(--ok)}
#verdict::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--vc);box-shadow:0 0 calc(18px*var(--sgk)) var(--vc)}
#verdict.crit{--vc:var(--crit);border-color:rgba(var(--crit-r),.42);background:linear-gradient(115deg,rgba(var(--crit-r),.12),var(--glass-2) 55%)}
#verdict.warn{--vc:var(--warn);border-color:rgba(var(--warn-r),.38);background:linear-gradient(115deg,rgba(var(--warn-r),.10),var(--glass-2) 55%)}
#verdict.ok{border-color:rgba(var(--ok-r),.3);background:linear-gradient(115deg,rgba(var(--ok-r),.07),var(--glass-2) 55%)}
#verdict .lbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
#verdict .say{font-size:21px;font-weight:300;line-height:1.4;margin-top:8px;letter-spacing:-.015em;color:var(--ink)}
/* border-left-width:0 is load-bearing. An absolutely-positioned ::before anchors to the PADDING box,
   so with a 1px border all round the spine sat 1px inside the card's outer edge — and that 1px strip
   showed the wash's first stop, which at 8% alpha over a light surface is indistinguishable from
   white. Result: a hairline white seam between the card edge and the severity spine, visible in
   light and pro. Removing the left border only makes the padding box start at the true edge, so the
   spine is flush; padding-left absorbs the 1px so no geometry moves. */
.find{position:relative;border:1px solid transparent;border-left-width:0;border-radius:var(--rs);
  padding:14px 16px 12px 20px;margin-bottom:11px;box-shadow:var(--elev);
  background:var(--glass);overflow:hidden;--sv:var(--net)}
.find::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sv);box-shadow:0 0 calc(13px*var(--sgk)) var(--sv)}
/* NO GRADIENT. A directional wash across a panel is a skeuomorphic holdover — it implies a light
   source that nothing else in the UI has, and tightening it only made a shorter gloss. The current
   idiom is a FLAT tint plus a hairline of the same hue: the surface states its severity uniformly
   and the edge does the containing. Both stops are identical, so the layer is a solid overlay over
   --glass rather than a fade, and themes still own the real surface underneath. */
.find.critical{--sv:var(--crit);border-color:rgba(var(--crit-r),.24);
  background:linear-gradient(rgba(var(--crit-r),.055),rgba(var(--crit-r),.055)),var(--glass)}
.find.warning{--sv:var(--warn);border-color:rgba(var(--warn-r),.22);
  background:linear-gradient(rgba(var(--warn-r),.05),rgba(var(--warn-r),.05)),var(--glass)}
/* Spine glow off on the light surfaces — but NOT because glow is wrong on light. It isn't; soft
   coloured shadows on light surfaces are entirely current. The defect was the FALLOFF: 13px * --sgk
   .3 is only ~4px of blur at near-full spine saturation, so it ramped rgb(239,164,177) -> the flat
   tint in five pixels and read as a band, not a glow — choppy rather than smooth.
   A glow needs blur radius proportional to its strength. If glow is wanted here later, give it a
   long radius at low alpha (roughly 3-4x the distance, a third of the opacity) rather than reusing
   the dark theme's tight, strong one. Crisp was simply the cheaper fix for a 3px mark. */
:root[data-theme=light] .find::before,
:root[data-theme=pro] .find::before{box-shadow:none}
.find.note{--sv:var(--net);opacity:.88}
.find h4{font-size:14.5px;font-weight:500;margin-bottom:6px;letter-spacing:-.01em}
.find .why{font-size:11.5px;color:var(--ink-2);line-height:1.65}
.find .ev{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.find .ev span{background:rgba(var(--fg),.05);border:1px solid var(--line-2);border-radius:6px;
  padding:2.5px 8px;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.find .act{margin-top:9px;font-size:11.5px;color:var(--ink);padding-top:8px;border-top:1px solid var(--line-2)}
.find .act b{color:var(--ink-3);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
/* the remedy row: a finding that names a fix should offer it here rather than describe it */
.lvr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-2)}
.lvr .lvn{font-size:10px;color:var(--ink-3);line-height:1.45;flex:1 1 180px;min-width:0}
.lvr code,.lvr .cmd{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:10.5px;
  background:rgba(var(--fg),.06);border:1px solid var(--line-2);border-radius:5px;padding:3px 8px;color:var(--ink)}
.lvr .cmd{cursor:copy}
.lvr .cmd:hover{background:rgba(var(--acc2),.12);border-color:rgba(var(--acc2),.3)}
.drf .lvr{margin-top:7px;padding-top:6px}
.fmeta{float:right;display:flex;align-items:center;gap:8px;margin-left:12px}
.tag.crit{background:rgba(var(--crit-r),.16);color:var(--crit)}
.tag.nt{background:rgba(var(--net-r),.15);color:var(--net)}
.confd{display:inline-flex;gap:3px;align-items:center}
.confd i{width:5px;height:5px;border-radius:50%;background:rgba(var(--fg),.13)}
.confd i.f{background:var(--sv,var(--ink-2))}
.confd em{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:4px}
/* ---- diagnose, pass 4 (2026-07-28): the causal chain IS the page ----
   Squint test drives the design: one lit statement, a glowing chain of measured numbers marching
   across the canvas, an imperative, a quiet rail. No boxes; light and type do all the zoning. The
   verdict and its top finding are ONE object (they were the same sentence printed twice).
   (#verdict/.find survive elsewhere for the startup suspicious card and the disk SSD warning.) */
.dgx{position:relative;min-height:100%;padding:6px 8px 0 14px;--vc:var(--ok);
  display:flex;flex-direction:column}   /* foot pins to the bottom: the void is framed, not leftover */
.dgx.crit{--vc:var(--crit);background:
  radial-gradient(760px 420px at 6% 16%,rgba(var(--crit-r),.16),transparent 70%),
  radial-gradient(1100px 700px at 40% 110%,rgba(var(--crit-r),.05),transparent 70%)}
.dgx.warn{--vc:var(--warn);background:
  radial-gradient(760px 420px at 6% 16%,rgba(var(--warn-r),.13),transparent 70%),
  radial-gradient(1100px 700px at 40% 110%,rgba(var(--warn-r),.045),transparent 70%)}
.dgx.okf{--vc:var(--ok);background:
  radial-gradient(760px 420px at 6% 16%,rgba(var(--ok-r),.11),transparent 70%)}
.dgx-meta{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dgx-meta .pill{letter-spacing:.04em}
.dgx-main{display:flex;gap:44px;align-items:flex-start;margin-top:26px}
.dgx-hero{flex:1;min-width:0}
.dgx-say{font-family:var(--disp);font-size:41px;font-weight:200;line-height:1.16;
  letter-spacing:-.025em;color:var(--ink);max-width:800px;text-wrap:balance}
.dgx-why{font-size:12.5px;color:var(--ink-2);line-height:1.7;max-width:660px;margin-top:20px}
/* the mechanism, as measured figures with arrows — data gets the typography */
.dgx-chain{position:relative;display:inline-flex;align-items:flex-start;gap:20px;
  margin-top:38px;padding:0 6px 26px}
.dcn{display:flex;flex-direction:column;text-align:left}
.dcn .dcv{font-family:var(--disp);font-size:33px;font-weight:250;letter-spacing:-.02em;
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;text-shadow:var(--disp-sh)}
.dcn .dcl{font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin-top:7px;white-space:nowrap}
.dca{width:36px;height:11px;position:relative;flex:none;align-self:flex-start;margin-top:12px}
.dca::before{content:'';position:absolute;left:0;right:5px;top:5px;height:1px;
  background:linear-gradient(90deg,transparent,var(--vc))}
.dca::after{content:'';position:absolute;right:0;top:1.5px;width:8px;height:8px;
  border-top:1.5px solid var(--vc);border-right:1.5px solid var(--vc);transform:rotate(45deg) scale(.8)}
/* the feedback loop: last node feeds the first */
.dgx-loop{position:absolute;left:12px;right:12px;bottom:0;height:16px;
  border:1px solid rgba(var(--fg),.14);border-top:0;border-radius:0 0 14px 14px;
  border-color:transparent;border-bottom-color:var(--vc);border-left-color:var(--vc);
  border-right-color:var(--vc);opacity:.35}
.dgx-loop::before{content:'';position:absolute;left:-4.5px;top:-5px;width:7px;height:7px;
  border-top:1.5px solid var(--vc);border-left:1.5px solid var(--vc);transform:rotate(45deg)}
.dgx-loop i{position:absolute;left:50%;transform:translate(-50%,7px);font-style:normal;
  font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--vc);opacity:.9;
  background:var(--bg);padding:0 8px;white-space:nowrap}
/* evidence as figures when a rule has no structured chain */
.dgx-ev{display:flex;flex-wrap:wrap;gap:10px 30px;margin-top:32px}
.dgx-ev span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  padding-left:10px;border-left:2px solid rgba(var(--fg),.14)}
.dgx-do{margin-top:40px;font-size:13.5px;color:var(--ink);max-width:640px;line-height:1.6}
/* the outcomes-ledger feedback line: what happened LAST time this same finding fired */
.dgx-past{margin-top:14px;font-size:11px;color:var(--ink-3);max-width:640px;line-height:1.6;
  padding-left:14px;position:relative}
.dgx-past::before{content:'↺';position:absolute;left:0;top:0;color:var(--ink-3);opacity:.8}
.drf .past{font-size:10px;color:var(--ink-3);opacity:.85;line-height:1.5;display:block;margin-top:3px}
.dgx-do em{font-style:normal;color:var(--vc);font-weight:700;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;margin-right:9px}
.dgx-do .confd{margin-left:14px;vertical-align:1px}
/* the rail: everything else wrong, quiet, right-hand side */
.dgx-rail{width:298px;flex:none;border-left:1px solid var(--line-2);padding:2px 0 2px 24px}
.dgx-rail .rl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:14px}
.drf{position:relative;padding:0 0 0 14px;margin-bottom:18px;--sv:var(--net)}
.drf::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;
  background:var(--sv);box-shadow:0 0 calc(9px*var(--sgk)) var(--sv)}
.drf.critical{--sv:var(--crit)} .drf.warning{--sv:var(--warn)} .drf.note{--sv:var(--net);opacity:.85}
.drf b{font-size:12px;font-weight:500;color:var(--ink);display:block;line-height:1.45}
.drf span{font-size:10.5px;color:var(--ink-3);line-height:1.55;display:block;margin-top:3px}
.dgx-foot{margin-top:auto;padding:10px 0 8px;border-top:1px solid var(--line-2);
  font-size:10.5px;color:var(--ink-3);line-height:1.6;max-width:1040px;opacity:.85}
.dgx-foot b{color:var(--ink-2)}
.grow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.grow .gp{flex:1;font-size:11.5px;word-break:break-all}
.grow .gb2{width:150px;height:6px;background:rgba(var(--fg),.06);border-radius:3px;position:relative;overflow:hidden}
.grow .gb2 i{position:absolute;top:0;bottom:0;border-radius:3px}
.grow .gv{width:78px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}
/* ---- page design system (panel pages only — nothing here is used by the docked strips) ----
   The overview's grammar, portable: one hero object per page, accent light on dark glass,
   magnitude as geometry, type hierarchy that means something. */
.hero{display:grid;gap:12px;margin-bottom:12px}
.hstat{background:var(--glass);border:1px solid transparent;border-radius:var(--rs);padding:14px 16px;box-shadow:var(--elev);
  position:relative;overflow:hidden;--acc:var(--ink-3)}
.hstat::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent 4%,var(--acc) 50%,transparent 96%);opacity:.55}
.hstat .hl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:flex;align-items:center;gap:7px}
.hstat .hl i{width:7px;height:7px;border-radius:2px;background:var(--acc);flex:none}
.hstat .hv{font-size:38px;font-weight:200;letter-spacing:-.03em;line-height:1.05;margin-top:7px;color:var(--ink)}
.hstat .hv small{font-size:15px;color:var(--ink-3);font-weight:300;margin-left:3px}
.hstat .hs{font-size:11px;color:var(--ink-3);margin-top:4px}
/* charts: CSS owns the box (explicit height, flex:none); the JS sizer follows the rect */
.chart{position:relative;height:96px;border-radius:var(--rc);background:rgba(var(--fg),.028);
  overflow:hidden;margin-top:11px;flex:none}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.chart .cap{position:absolute;top:5px;right:9px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);opacity:.75;z-index:1}
.seg{display:flex;height:9px;border-radius:4px;overflow:hidden;background:rgba(var(--fg),.05);margin-top:10px}
/* beast's meter-bar texture, extracted (owner: "i like the texture of the meter bars…stuff like
   that can definitely get added to dark and light mode"): fine scanline striation on every meter
   fill ≥ 6px tall. Static gradient, zero cost at rest. Beast keeps its shell overlay instead. */
.seg i{position:relative}
.seg i::after,.bar.mb i::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
:root[data-theme=light] .seg i::after,:root[data-theme=light] .bar.mb i::after{
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.28) 0 1px,transparent 1px 3px)}
:root[data-theme=beast] .seg i::after,:root[data-theme=beast] .bar.mb i::after{content:none}
.bar.mb i{position:relative}
.seg i{display:block;height:100%;transition:width .5s cubic-bezier(.22,1,.36,1)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10px;color:var(--ink-3);margin-top:7px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.gauge{position:relative;height:118px;width:118px;margin:2px auto 0;flex:none}
.gauge canvas{position:absolute;inset:0;width:100%;height:100%}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.gauge .gv b{font-size:21px;font-weight:250;letter-spacing:-.02em;display:block}
.gauge .gv b small{font-size:11px;color:var(--ink-3);font-weight:300}
/* The label is taken OUT of the centred flow. Centring a value+label pair as one block puts the
   value above the true centre and the label below it — the number, which is the thing being read,
   ends up off-centre in its own ring. Absolutely positioning the label lets the value centre alone,
   and the 270° arc leaves its gap at the bottom, which is exactly where the label wants to sit. */
.gauge .gv em{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:8.5px;
  color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin:0}
/* THE BIG PER-THREAD WHEEL CANNOT USE THE CAPTION SLOT THE SMALL GAUGES USE.
   Both placements above are correct at 118px and collide at 178px, in different ways, which is why
   this reads as two bugs and is one: the base rule pins the caption 1px above the box bottom, where
   a wheel this size is already drawing its thread-index labels ("HOTTEST" printed through the "4");
   and the pro-theme override pushes it 17px BELOW the box - clear of that theme's dark well, which
   is what it was written for - straight into the explanatory note underneath.
   Putting it in normal flow under the value moves it into the hub, which is the calm negative space
   on this geometry and is where a caption for that number belongs anyway. Fixes both themes with
   one rule instead of two more special cases. */
#cpuWheel ~ .gv em{position:static;bottom:auto;display:block;margin-top:3px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.mst{background:rgba(var(--fg),.028);border:1px solid transparent;border-radius:var(--rc);padding:9px 11px;box-shadow:var(--elev)}
.mst .ml{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mst .mv{font-size:19px;font-weight:250;margin-top:3px;letter-spacing:-.02em}
.mst .mv small{font-size:11px;color:var(--ink-3);font-weight:400;margin-left:2px}
/* ---- THERM + NET additions (2026-07-29, telemetry-gaps pass) ---- */
/* adapter block: name + engine bars. Colour stays the GPU accent; the ENGINE label carries the
   which-silicon answer, so no second accent is invented. */
.gadp{padding:7px 0 5px;border-bottom:1px solid var(--line-2)}
.gadp:last-of-type{border-bottom:0}
.gadp .gan{display:flex;justify-content:space-between;align-items:baseline}
.gadp .gan b{font-size:12.5px;font-weight:600;color:var(--ink)}
.gadp .gan small{font-size:10px;color:var(--ink-3);margin-left:6px}
.gadp .gan .gau{font-size:19px;font-weight:250;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.gadp .gan .gau small{font-size:10px;color:var(--ink-3)}
.geng{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:10px}
.geng .gel{width:82px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;flex:none}
.geng .geb{flex:1;height:5px;border-radius:2px;background:rgba(var(--fg),.055);overflow:hidden}
.geng .geb i{display:block;height:100%;border-radius:2px;background:var(--gpu);min-width:0}
.geng .gev{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.gtop{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gtop .gt{font-size:10.5px;padding:2px 9px;border-radius:999px;border:1px solid rgba(var(--gpu-r),.3);
  color:var(--ink-2);background:rgba(var(--gpu-r),.06);font-variant-numeric:tabular-nums}
.gtop .gt b{color:var(--gpu);font-weight:600}
/* battery health bar: filled = what the pack still holds, dashed remainder = capacity age took */
.bhb{position:relative;height:10px;border-radius:3px;margin-top:6px;
  background:repeating-linear-gradient(45deg,rgba(var(--crit-r),.13) 0 4px,rgba(var(--crit-r),.03) 4px 8px)}
.bhb i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,rgba(var(--ok-r),.85),rgba(var(--ok-r),.55))}
.bhb.warn i{background:linear-gradient(90deg,rgba(var(--warn-r),.9),rgba(var(--warn-r),.55))}
.bhb.crit i{background:linear-gradient(90deg,rgba(var(--crit-r),.9),rgba(var(--crit-r),.55))}
.bcurve{position:relative;height:88px;margin-top:8px}
.bcurve canvas{position:absolute;inset:0;width:100%;height:100%}
.thcore{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:10.5px}
.thcore .gel{width:64px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600;flex:none;font-size:9.5px}
.thcore .geb{flex:1;height:5px;border-radius:2px;background:rgba(var(--fg),.055);overflow:hidden}
.thcore .geb i{display:block;height:100%;border-radius:2px;background:var(--cpu)}
.thcore .gev{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:10.5px;
  font-weight:600;letter-spacing:.04em;border:1px solid var(--line);color:var(--ink-3);background:rgba(var(--fg),.03)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.crit{color:var(--crit);border-color:rgba(var(--crit-r),.35);background:rgba(var(--crit-r),.08)}
.pill.warn{color:var(--warn);border-color:rgba(var(--warn-r),.3);background:rgba(var(--warn-r),.07)}
.pill.note{color:var(--net);border-color:rgba(var(--net-r),.3);background:rgba(var(--net-r),.07)}
.pill.okp{color:var(--ok);border-color:rgba(var(--ok-r),.3);background:rgba(var(--ok-r),.07)}
/* treemap — area IS the data, and colour is RECLAIMABILITY (playbook §2.4).
   Every tile carries --tc (an R,G,B triplet var from the tier palette) and --ta (alpha ∝ share),
   so all colour policy lives in custom properties and the render fn never emits a hex. */
/* The treemap was a hard 340 px, which is what made Storage overflow on a 720 px window — nothing to
   do with how many folders exist. It is a treemap: it fills whatever box it is given, so the box just
   has to know the window. clamped so it never gets uselessly short or exceeds the original design size. */
.tmap{position:relative;height:clamp(170px,calc(100vh - 466px),340px);
  border-radius:var(--rc);overflow:hidden;background:rgba(var(--fg),.02)}

/* The not-connected state. Deliberately roomy and readable rather than a terse banner: it is the
   one moment where someone decides whether to let this talk to an external service, and that
   decision deserves the specifics rather than a shrug. */
.askoff{padding:18px 20px;max-width:640px;line-height:1.55}
.askoff b{display:block;font-size:14px;margin-bottom:8px}
.askoff p{margin:0 0 10px;font-size:12px}
.askoff .muted{color:var(--ink-2)}

/* ---- SOLO WINDOW (?view=ask) ----
   A popped-out chat is a chat window, not a second copy of the panel: no rail, no page header, no
   pop-out button (it is already popped out), and the conversation takes the whole frame. The one-page
   law still applies - the thread scrolls inside its own box, the window never does. */
body.solo #rail,body.solo #top{display:none!important}
/* The header STAYS on the ask page, slimmed. Hiding `.hd` wholesale also hid `.askset`, which took
   the model, effort and auth controls with it - and those are exactly what you reach for from the
   chat window itself. Only the page title and the status line go. */
body.solo .hd{padding:2px 2px 6px;min-height:0}
body.solo .hd h2,body.solo #askMode{display:none}
body.solo .hd .askset{margin-left:auto}
/* THE COLUMN MUST GO WITH THE RAIL. #shell is `grid-template-columns:62px 1fr`; hiding #rail leaves
   the track behind, so #view auto-places into the 62px column and the whole conversation renders in
   a sliver against an empty window. Absolutely positioning #view "fixed" it only in the sense that
   a symptom stops being visible - the grid was still wrong. Collapse the track instead. */
body.solo #shell{grid-template-columns:minmax(0,1fr)}
body.solo #view{position:relative;inset:auto}
body.solo .page{padding:8px}
body.solo #askPop{display:none}
body.solo .askcard{height:calc(100vh - 16px);display:flex;flex-direction:column}
body.solo .askthread{flex:1;min-height:0;overflow-y:auto}
/* The thread must own the remaining height once the slim header is accounted for. */
body.solo .askcard{height:calc(100vh - 46px)}

/* ---- CAPABILITY GATING (2026-07-30, cross-platform pass) ----
   A host that cannot measure something does not get a dimmed gauge or a zero - it gets nothing, and
   the SELF page explains the gap. This is the same rule that produced the hybrid-GPU fix: a ring
   reading 0% while a GPU is genuinely busy is worse than no ring, because the zero ANSWERS the
   question and the absence PROMPTS it. Driven by classes stamped on <body> from /api/caps. */
body.no-gpu [data-cap="gpu.total"],
body.no-percore [data-cap="cpu.perCore"]{display:none!important}

/* An unverified collector says so permanently, in the header, on every page. It is the first thing
   anyone debugging a wrong number on that platform needs to know. */
/* MODE CHIP. Shown ONLY in viewer, deliberately: admin is the expected state and a permanent
   "ADMIN" badge is chrome that stops being read within a day. Viewer is the surprising one - if you
   cannot kill a process you need to know why in the first second, not after hunting for a setting. */
.modechip{display:none}
body.viewer-mode .modechip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  padding:1px 8px;border-radius:999px;font-size:10px;letter-spacing:.10em;font-weight:600;
  color:rgb(var(--t2));border:1px solid rgba(var(--t2),.45);background:rgba(var(--t2),.10)}
body.viewer-mode .modechip:hover{background:rgba(var(--t2),.18)}
.capwarn{display:none}
body.unverified-host .capwarn{display:inline-flex;align-items:center;gap:5px;
  padding:1px 7px;border-radius:999px;font-size:10px;letter-spacing:.06em;
  color:rgb(var(--t3));border:1px solid rgba(var(--t3),.45);background:rgba(var(--t3),.10)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:5px}
.capgrid div{font-size:11px;padding:5px 7px;border-radius:var(--rc);background:rgba(var(--fg),.03);
  border:1px solid rgba(var(--fg),.07)}
.capgrid b{display:block;font-size:10px;letter-spacing:.06em;color:var(--ink-2)}
.tnode{position:absolute;overflow:hidden;border-radius:5px;cursor:pointer;--tc:var(--tn);--ta:.08;
  background:linear-gradient(150deg,rgba(var(--tc),calc(var(--ta)*1.45)),rgba(var(--tc),calc(var(--ta)*.60)));
  border:1px solid rgba(var(--tc),.28);transition:border-color .15s,box-shadow .15s,filter .15s}
.tnode:hover{border-color:rgba(var(--tc),.8);filter:brightness(1.16);
  box-shadow:0 0 15px rgba(var(--tc),.30),inset 0 0 24px rgba(var(--tc),.08)}
.tnode.noc{cursor:default}
.tnode.dim{filter:saturate(.4)}
.tnode .tn1{font-size:11px;font-weight:500;color:var(--ink);padding:5px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.tnode .tn2{font-size:10px;color:rgb(var(--tc));padding:1px 8px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.tnode.dim .tn2{color:var(--ink-3)}
/* free space: an outline, not a fill — absence rendered as absence */
.tnode.tfree{cursor:default;background:none;border:1px dashed rgba(var(--fg),.17)}
.tnode.tfree .tn2{color:var(--ink-3)}
/* unmapped (VSS, $MFT, NTFS metadata): hatched — real space that no visible file owns */
.tnode.tunm{cursor:default;
  background:repeating-linear-gradient(45deg,rgba(var(--tc),.13) 0 5px,rgba(var(--tc),.03) 5px 10px);
  border:1px solid rgba(var(--tc),.25)}
/* second level: a parent's largest children, inset beneath its label */
.tsub{position:absolute;border-radius:3px;overflow:hidden;--tc:var(--tn);--ta:.14;cursor:pointer;
  background:rgba(var(--tc),var(--ta));border:1px solid rgba(var(--tc),.22);transition:filter .12s,border-color .12s}
.tsub:hover{filter:brightness(1.4);border-color:rgba(var(--tc),.75)}
.tsub.fill{cursor:default;background:rgba(var(--tc),.035);border-color:rgba(var(--tc),.07)}
.tsub .tsn{font-size:9px;color:var(--ink-2);padding:2px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub .tsg{font-size:8.5px;color:rgb(var(--tc));padding:0 5px;font-variant-numeric:tabular-nums}
.tleg{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--ink-3);
  text-transform:none;letter-spacing:0;font-weight:400}
.tleg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
/* hover card: full path, exact size, share of level and volume, tier verdict — a title attr can't
   be styled and can't carry colour, so the treemap gets a real one */
#ttip{position:fixed;z-index:60;pointer-events:none;background:var(--tip-bg);border:1px solid var(--line);
  border-radius:6px;padding:8px 11px;font-size:11.5px;max-width:360px;opacity:0;transition:opacity .1s;
  box-shadow:var(--elev2)}
#ttip.on{opacity:1}
#ttip b{font-weight:600}
#ttip .tp{color:var(--ink-3);font-size:10px;word-break:break-all;margin-top:1px}
#ttip .tr{margin-top:5px;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#ttip .tt{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:10px;color:var(--ink-2);
  padding-top:6px;border-top:1px solid var(--line-2)}
#ttip .tt i{width:7px;height:7px;border-radius:2px;flex:none}
/* ---- density system (2026-07-28): no page scrolls at 1240x820 ----
   Magnitude lives BEHIND the row as a subtle fill, never beside it as a bar that duplicates the
   number; single-line rows; long lists go multi-column instead of tall. */
.dense td{padding:3px 8px}
.dense th{padding-bottom:5px}
.dense .btn{padding:2px 8px;font-size:10px;border-radius:6px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
.g2{display:grid;gap:12px;align-items:start;margin-bottom:12px}
.g2>.card{margin-bottom:0}
/* startup: four groups side by side, one line per entry, path in the tooltip */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;margin-bottom:12px}
.bgrid .card{margin-bottom:0;padding:10px 12px;min-width:0}
.brow{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;border-bottom:1px solid var(--line-2);min-width:0}
.brow:last-child{border-bottom:0}
.brow .st{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.35;flex:none}
.brow .st.on{background:var(--ok);opacity:1;box-shadow:0 0 calc(5px*var(--sgk)) rgba(var(--ok-r),.7)}
.brow .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);font-size:10px}
.brow .bn b{color:var(--ink-2);font-weight:500;font-size:11px}
.brow:hover .bn b{color:var(--ink)}
.brow .btn{display:none;padding:1px 7px;font-size:9.5px;border-radius:5px;flex:none}
.brow:hover .btn{display:block}
.brow.xtra{display:none}
.card.xp .brow.xtra{display:flex}
.brow.xm{color:var(--ink-3);font-size:10px;cursor:pointer;justify-content:center;border-bottom:0;padding-top:5px}
.brow.xm:hover{color:var(--ink)}
.card.xp .brow.xm{display:none}
/* reclaim rows: one line, proportional fill behind */
.crow{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line-2);font-size:11.5px;overflow:hidden}
.crow:last-child{border-bottom:0}
.crow>*{position:relative}
.crow .rfill{position:absolute;left:0;top:2px;bottom:2px;width:0;border-radius:4px;opacity:.14;transition:width .6s cubic-bezier(.22,1,.36,1)}
.crow b.cn{font-weight:500;color:var(--ink);flex:none}
.crow .pth{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);font-size:10.5px}
.crow .sz{flex:none;font-variant-numeric:tabular-nums;width:74px;text-align:right;color:var(--ink)}
.crow .btn{flex:none;padding:2px 9px;font-size:10.5px}
/* diagnosis findings: two columns — three stacked full-width cards is a column of scroll */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start;margin-bottom:12px}
.fgrid .find{margin-bottom:0}
/* diverging growth bars around a center axis */
/* GROWTH is the one readout page whose list has no natural ceiling: it is however many directories
   moved between two MFT snapshots (33 here, and a month of drift could be hundreds). So the page holds
   its three cards and the diff scrolls INSIDE its own card - owner: "maek it all fit the 3 cards and
   have what moved be scrollabel within". The card is the flex column; .gscroll takes the remainder.
   The header states the total, so a scrolled list never hides how much there is. */
#p-growth{display:flex;flex-direction:column}
#p-growth>.hd,#p-growth>.hero{flex:none}
.gcard{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;overflow:hidden}
.gcard>h3{flex:none;display:flex;align-items:baseline}
.gscroll{flex:1 1 auto;min-height:0;overflow-y:auto;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.gscroll::-webkit-scrollbar{width:0;height:0}
.dvg{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.dvg:last-child{border-bottom:0}
.dvg .dp{flex:1;min-width:0;word-break:break-all;padding-right:10px}
.dvg .dbar{width:250px;flex:none;height:8px;position:relative}
.dvg .dbar::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.dvg .dbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.dvg .dv{width:82px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
/* ---- docked modes ----
   A 132 px sidebar cannot render the ring core, the rail and a tile grid, so docking swaps to a
   purpose-built compact strip rather than trying to squeeze the panel layout. Same data, same
   colours, different information density. */
#compact{display:none;flex:1;min-width:0;min-height:0;overflow:hidden}
/* ---- SYS console ("hacker mode", 2026-07-29, owner ask): a screen for a developer, not a
   dashboard page. NO cards, no fills — one monospace surface zoned by hairline rules, and every
   line on it is a measured event: the journal derives from the tick stream, the raw tick IS the
   stream, the socket table is a real Get-NetTCPConnection snapshot. Renders only while open;
   the journal ring buffer costs a few comparisons per tick at rest. */
#p-sys{font:11px/1.55 "Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  display:flex;flex-direction:column;padding:14px 18px 12px}
#p-sys .syshead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);
  padding-bottom:9px;flex:none}
#p-sys .syshead b{font-size:13px;letter-spacing:.3em;font-weight:600;color:var(--ink)}
#p-sys .syshead span.tag0{color:var(--ink-3);font-size:10px}
#p-sys .syskpi{margin-left:auto;display:flex;gap:16px;font-size:10px;color:var(--ink-3);letter-spacing:.04em}
#p-sys .syskpi b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sysgrid{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);min-height:0}
.syscol{min-width:0;display:flex;flex-direction:column;min-height:0}
.syscol.r{border-left:1px solid var(--line-2);padding-left:16px;margin-left:16px}
.syssec{flex:none;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  margin:11px 0 5px;display:flex;align-items:center;gap:8px}
.syssec::after{content:'';flex:1;height:1px;background:var(--line-2)}
.syssec .sbt{cursor:pointer;color:var(--ink-2);letter-spacing:.1em;padding:1px 7px;
  border:1px solid var(--line);border-radius:3px;order:2}
.syssec .sbt:hover{color:var(--ink);background:rgba(var(--fg),.06)}
#syslog{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#syslog::-webkit-scrollbar,#sysraw::-webkit-scrollbar,#sysconn::-webkit-scrollbar,.sfx-rail::-webkit-scrollbar,#sfAnat::-webkit-scrollbar{width:0;height:0}
.slr{display:flex;gap:9px;white-space:nowrap;overflow:hidden;line-height:1.75}
.slr time{color:var(--ink-3);flex:none}
.slr .sk{flex:none;width:52px;font-weight:600;letter-spacing:.06em}
.slr .sm{overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);min-width:0}
/* bundle options: a contained panel above the journal, not a modal - the console stays readable behind
   it and the whole thing collapses on Cancel. flex:none so it never steals the journal's scroll. */
.bopt{flex:none;border:1px solid var(--line);border-radius:var(--rc);padding:9px 11px;margin-bottom:8px;
  background:rgba(var(--fg),.03);max-height:none}
.bopt-h{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:5px}
.bopt-r{display:flex;align-items:flex-start;gap:7px;padding:2px 0;cursor:pointer;line-height:1.45}
.bopt-r input{margin-top:2px;flex:none;accent-color:rgb(var(--acc2))}
.bopt-r b{font-size:10.5px;color:var(--ink);font-weight:600;flex:none;min-width:118px}
.bopt-r span{font-size:9.5px;color:var(--ink-3);flex:1 1 0;min-width:0}
.bopt-r input:disabled+b,.bopt-r input:disabled~span{opacity:.45}
.bopt-n{font-size:9.5px;color:var(--ink-3);margin-top:8px;padding-top:7px;border-top:1px solid var(--line-2);line-height:1.5}
.bopt-a{display:flex;align-items:center;gap:8px;margin-top:9px}
.bopt-out{font-size:9.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* recovered from disk, not seen live this session - dimmed so the reader can tell the difference
   between "I watched this happen" and "this was in the record when I opened it" */
.slr.fromdisk{opacity:.62}
.slr.fromdisk time::after{content:'·';margin-left:4px;color:var(--ink-3)}
.slr.crit .sk{color:var(--crit)} .slr.warn .sk{color:var(--warn)}
.slr.ok .sk{color:var(--ok)} .slr.info .sk{color:var(--net)} .slr.proc .sk{color:var(--mem)}
/* The raw tick is 5,000 px of content in a 252 px well — it was clipped, and the label's claim
   "truncated to fit" was doing the apologising that a scroll should do. Wheel it instead. */
#sysraw{flex:none;height:252px;overflow-y:auto;white-space:pre;font-size:9.5px;line-height:1.5;
  color:var(--ink-2);scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#sysconn{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.scr{display:flex;gap:8px;white-space:nowrap;line-height:1.75;color:var(--ink-2);min-width:0}
.scr .st{flex:none;width:72px}
.scr .st.est{color:var(--ok)} .scr .st.lsn{color:var(--ink-3)} .scr .st.oth{color:var(--warn)}
.scr .la{flex:none;width:148px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}
.scr .ra{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.scr .pn{flex:none;color:var(--ink);max-width:128px;overflow:hidden;text-overflow:ellipsis}
.scr.h{color:var(--ink-3);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
/* The column labels stay put while the socket table scrolls — a 458-row table whose header has scrolled
   away is four columns of unlabelled addresses. Opaque --bg under the translucent --glass so rows
   cannot ghost through it. */
.scr.shdr{position:sticky;top:0;z-index:2;padding:2px 0 3px;
  background:linear-gradient(var(--glass),var(--glass)),var(--bg);
  box-shadow:0 1px 0 var(--line-2)}

/* ---- FOOTPRINT (2026-07-29): the instrument audits itself ----
   One lit statement of what this tool costs RIGHT NOW, then the process anatomy as two
   substances: THE MEDIUM (the chromium constellation that renders the window — neutral ink)
   and THE INSTRUMENT (our four processes — accent). Colour answers exactly one question:
   is this cost the price of the window, or of the metering? Row glow = share of self cpu;
   baseline tick = share of self memory. Everything on the page is measured, including the
   admission that the page includes its own cost. */
/* height, NOT min-height (2026-07-29). min-height:100% is a FLOOR: the box grew to its content
   (780 px inside a 684 px page) and, because the column flex container had already grown, no child
   ever needed to shrink — so flex:1 + min-height:0 on .sfx-main looked correct and did nothing.
   That was the owner's "little bit of scroll before it should". Clamping the container is what makes
   the shrink rules load-bearing; the deep rail then scrolls inside itself. Same shape as the rail
   overflow bug: an unclamped track cannot be fixed by tuning what sits in it. */
.sfx{position:relative;height:100%;padding:6px 8px 0 14px;display:flex;flex-direction:column;--vc:var(--ok)}
.sfx.warn{--vc:var(--warn)} .sfx.crit{--vc:var(--crit)}
.sfx-meta{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sfx-main{display:flex;gap:42px;align-items:stretch;margin-top:16px;flex:1;min-height:0}
.sfx-hero{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
/* The process anatomy is the hero's growable part: the medium's constellation gains rows as Chromium
   spawns them. It scrolls so the sparkline row below it stays anchored to the page bottom. */
#sfAnat{min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.sfx-leg{font-size:9px;letter-spacing:.06em;color:var(--ink-3);margin-top:7px;padding:0 8px;opacity:.85}
.sfx-say{font-family:var(--disp);font-weight:200;font-size:54px;line-height:1;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:var(--disp-sh)}
