   if(ifc){ ifc.style.display=show?'':'none';
     if(show) $('#ifBody').innerHTML=ifs.slice(0,6).map(i=>
       `<div class="kv"><span>${sysEsc(i.id)}</span><b>↓ ${fmt(i.rxMBs,2)} · ↑ ${fmt(i.txMBs,2)} MB/s</b></div>`).join(''); }}
  areaChart($('#rxChart'),S.hist.rx,cssv('--cv-net'));
  areaChart($('#txChart'),S.hist.tx,cssv('--cv-net'));
  $('#ioR').textContent=fmt(t.disk.io.readMBs,2);
  $('#ioW').textContent=fmt(t.disk.io.writeMBs,2);

  const b=$('#ioB'); b.textContent=fmt(t.disk.io.busyPct); b.style.color=t.disk.io.busyPct>85?'var(--crit)':'';
  const q=$('#ioQ'); q.textContent=fmt(t.disk.io.queue,1);
  q.style.color=t.disk.io.queue>4?'var(--crit)':t.disk.io.queue>2?'var(--warn)':'';
  if(S.traceView) return;                     // trace results own the table until "back to live"
  if(el.dataset.xp==='1') return;             // "Show all" snapshot owns it until closed
  const cf=v=>v>=1e6?fmt(v/1e6,1)+'M':v>=1e3?fmt(v/1e3,0)+'k':fmt(v);

  const hasProcIo=can('proc.io');

     visibly overflowing page after opening NET — the owner sees a scrollbar that then disappears,
     which is worse than either end state. The overflow and a row's height are both measured right
     here, so the whole deficit can be cleared in ONE tick. The ±1 step is kept only for grow-back,
     where creeping is correct: it damps the flip-flop when slack hovers at the threshold. */
  if(el.clientHeight>120){
    const rows=S.netRows||8, over=el.scrollHeight-el.clientHeight;
    if(over>0&&rows>3){
      const tb=$('#netProc tbody'), n=tb?tb.children.length:0;
      const rowH=n?Math.max(11,tb.getBoundingClientRect().height/n):15;
      S.netRows=Math.max(3,rows-Math.ceil(over/rowH));
    }
    else if(over<=0&&el.scrollHeight<=el.clientHeight-56&&rows<8) S.netRows=rows+1;
  }
};

        <div class="note"><b>ETW:</b> ${r.etw}. Byte totals are exact — cumulative counters differenced end to end — but <b>peak</b> is only as sharp as the ${r.hzActual} Hz sample rate, so short bursts are understated.${(r.processes||[]).length>n?` Top ${n} of ${(r.processes||[]).length} by bytes.`:''}</div>`;

/* THERM (rebuilt 2026-07-29, telemetry-gaps pass). Four quadrants, each named for its SOURCE:
   graphics activity (GPU Engine counters — both adapters, per engine, per process), NVIDIA
   silicon sensors (nvidia-smi — the only card that has them), CPU silicon (LHM), and battery
   (ACPI + powercfg). Where a sensor does not exist the page says so and says WHY — a blank row
   and an absent sensor are different facts. */
const ENG_LABEL={'3d':'3D',copy:'COPY',videodecode:'VIDEO DECODE',videoencode:'VIDEO ENCODE',
  videoprocessing:'VIDEO PROC',gdi:'GDI',security:'SECURITY',legacyoverlay:'OVERLAY',vr:'VR',other:'OTHER'};
function drawBattCurve(cv,hist){
  if(!cv||!hist||hist.length<2) return;
  const r=cv.parentElement.getBoundingClientRect(); if(r.width<8||r.height<8) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height, design=Math.max(1,...hist.map(p=>p.design||0));
  const X=i=>6+(w-70)*(i/(hist.length-1)), Y=v=>12+(h-34)*(1-v/design);
  x.clearRect(0,0,w,h);
  // design capacity: the dashed ceiling the pack was born with
  x.strokeStyle=cssv('--cv-track'); x.setLineDash([3,3]); x.beginPath();
  x.moveTo(6,Y(design)); x.lineTo(w-64,Y(design)); x.stroke(); x.setLineDash([]);
  const last=hist[hist.length-1], healthPct=last.full/design*100;
  const col=healthPct<45?cssv('--cv-crit'):healthPct<70?cssv('--cv-warn'):cssv('--cv-ok');
  x.beginPath();
  hist.forEach((p,i)=>{ const px=X(i),py=Y(p.full); i?x.lineTo(px,py):x.moveTo(px,py); });
  x.strokeStyle=col; x.lineWidth=1.6; x.stroke();
  x.lineTo(X(hist.length-1),h-22); x.lineTo(X(0),h-22); x.closePath();
  x.globalAlpha=.10; x.fillStyle=col; x.fill(); x.globalAlpha=1;
  x.font='9px Segoe UI'; x.fillStyle=cssv('--cv-label');
  x.textAlign='left';  x.fillText(`${hist[0].d} · ${fmt(hist[0].full/1000,0)} Wh`,6,h-8);
  x.textAlign='right'; x.fillText(`${last.d} · ${fmt(last.full/1000,1)} Wh`,w-6,h-8);
  x.fillText(`design ${fmt(design/1000,0)} Wh`,w-6,Y(design)+3);
  x.textAlign='left';
}

function procTable(sortKey,opts={}){
  const t=S.tick; if(!t) return '<div class="empty">waiting…</div>';
  const rows=[...t.proc].sort((a,b)=>b[sortKey]-a[sortKey]).slice(0,opts.n||14);
  const maxV=Math.max(1,...rows.map(r=>r[sortKey]));
  // Magnitude is a row-background fill, not a bar column — the old under-name bar spent half the
  // row width restating what the right-aligned number already said. Instance count folds into the
  // name; the sort key keeps the ink.
  const acc=sortKey==='cpu'?'var(--cpu-r)':'var(--mem-r)';
  const em=(on,html)=>on?`<b style="font-size:12.5px;color:var(--ink);font-weight:500">${html}</b>`:`<span class="muted">${html}</span>`;
  const row=r=>{ const pct=(r[sortKey]/maxV*100).toFixed(1);
    return `<tr style="background:linear-gradient(90deg,rgba(${acc},.09) ${pct}%,transparent ${pct}%)">
      <td>${r.n}${r.count>1?` <span class="muted" style="font-size:10px">×${r.count}</span>`:''}</td>
      <td class="num ${r.cpu>25&&sortKey!=='cpu'?'warn':''}">${em(sortKey==='cpu',fmt(r.cpu,1)+'%')}</td>
      <td class="num">${em(sortKey==='mb',fmt(r.mb)+' MB')}</td>
      <td style="width:48px;text-align:right"><button class="btn dgr k" data-pids="${r.pids.join(',')}" data-n="${r.n}">End</button></td>
    </tr>`; };
  const tbl=rs=>`<table class="dense"><thead><tr><th>Process</th><th class="num">CPU</th><th class="num">Memory</th><th></th></tr></thead><tbody>${rs.map(row).join('')}</tbody></table>`;
  if(opts.split){ const h=Math.ceil(rows.length/2);
    return `<div class="pgrid">${tbl(rows.slice(0,h))}${tbl(rows.slice(h))}</div>`; }
  return tbl(rows);
}
function wireKill(root){
  $$('.btn.k',root).forEach(b=>b.onclick=async()=>{
    const n=b.dataset.n, pids=b.dataset.pids.split(',').map(Number);
    if(!confirm(`End ${pids.length} process${pids.length>1?'es':''} named "${n}"?\n\nUnsaved work in that app will be lost.`)) return;
    b.disabled=true;
    try{ await fetch('/api/kill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pids})}); toast(`Ended ${n}`); }
    catch(e){ toast('Failed: '+e.message); b.disabled=false; }
  });
}

/* ---- diagnosis: the headline view ---- */
RENDER.diag=async()=>{
  const el=$('#p-diag');
  let d;
  try{ d=await (await fetch('/api/diagnose')).json(); }
  catch(e){ el.innerHTML=`<div class="empty">diagnose failed: ${e.message}</div>`; return; }
  const worst=(d.findings||[])[0];
  const cls=!d.findings.length?'ok':worst.sevName==='critical'?'crit':worst.sevName==='warning'?'warn':'';
  const sevTag={critical:'<span class="tag crit">critical</span>',warning:'<span class="tag t2">warning</span>',note:'<span class="tag nt">note</span>'};
  const confDots=c=>{ const n=/high/i.test(c)?3:/med/i.test(c)?2:1;
    return `<span class="confd">${[0,1,2].map(i=>`<i class="${i<n?'f':''}"></i>`).join('')}<em>${c}</em></span>`; };
  const pills=[
    d.counts.critical?`<span class="pill crit"><i></i>${d.counts.critical} critical</span>`:'',
    d.counts.warning ?`<span class="pill warn"><i></i>${d.counts.warning} warning</span>`:'',
    d.counts.note    ?`<span class="pill note"><i></i>${d.counts.note} note</span>`:'',
    !d.findings.length?`<span class="pill okp"><i></i>all clear</span>`:'',
  ].join('');
  const cls2=!d.findings.length?'okf':worst.sevName==='critical'?'crit':worst.sevName==='warning'?'warn':'okf';
  // The verdict IS the top finding (the engine's summary is findings[0].title) — render them as
  // ONE object. The hero owns the canvas; every other finding composes as the quiet right rail.
  const hero=worst, rest=(d.findings||[]).slice(1);
  const histLine=!d.ready
    ?`warming up · ${d.warmupSec}s until the sustained rules can fire`
    :`${d.historySec}s of history · ${d.sampleRateHz} Hz measured`;
  const chain=hero&&hero.chain&&hero.chain.steps&&hero.chain.steps.length?`
    <div class="dgx-chain">
      ${hero.chain.steps.map((s,i)=>`${i?'<span class="dca"></span>':''}
        <span class="dcn"><span class="dcv">${s.v}</span><span class="dcl">${s.l}</span></span>`).join('')}
      ${hero.chain.loop?'<span class="dgx-loop"><i>feeds back</i></span>':''}
    </div>`:'';
  el.innerHTML=`
    <div class="dgx ${cls2}">
      <div class="dgx-meta"><span>Diagnosis</span>${pills}<span style="opacity:.7;font-weight:400;letter-spacing:.06em">${histLine}</span>
        <span style="flex:1"></span><button class="btn" id="reDiag" style="letter-spacing:0;text-transform:none">Re-run</button></div>
      <div class="dgx-main">
        <div class="dgx-hero">
          <div class="dgx-say">${hero?hero.title:'Nothing wrong that I can measure.'}</div>
          ${hero?`<div class="dgx-why">${hero.because}</div>`:
            `<div class="dgx-why">Every rule tested its sustained window against the recorded history and came back clean. This sentence is re-earned every ten seconds.</div>`}
          ${chain||(hero?`<div class="dgx-ev">${(hero.evidence||[]).map(e=>`<span>${e}</span>`).join('')}</div>`:'')}
          ${hero?`<div class="dgx-do"><em>Do</em>${hero.action}<span style="white-space:nowrap">${confDots(hero.confidence)}</span></div>`:''}
          ${hero?leverHTML(hero):''}
          ${hero&&hero.past?`<div class="dgx-past">${hero.past.text} <span style="opacity:.65;cursor:pointer;text-decoration:underline dotted" onclick="go('led')" title="open the full ledger">— outcomes ledger, this machine</span></div>`:''}
        </div>
        ${rest.length?`<div class="dgx-rail"><div class="rl">Also found</div>
          ${rest.map(f=>`<div class="drf ${f.sevName}"><b>${f.title}</b><span>${f.action}</span>${leverHTML(f)}${f.past?`<span class="past">↺ ${f.past.text}</span>`:''}</div>`).join('')}
        </div>`:''}
      </div>
      <div class="dgx-foot">
        Every rule tests a <b>sustained</b> condition against recorded history, never an instant —
        a CPU spike is a process starting; ninety seconds of it is a problem. Compound causes
        suppress the symptoms they explain, which is why one sentence above can stand for three
        findings. Windows are wall-clock, not sample-count: the loop's rate is measured, not assumed.
      </div>
    </div>`;
  $('#reDiag').onclick=()=>RENDER.diag();
  wireLevers(el);
};

/* ---- remedies attached to findings (2026-07-29) ----
 * The owner asked whether it would tell him when the fix is a reboot, a specific app, the Recycle Bin
 * or a defrag. The engine now says so; this renders the remedy next to the sentence that earned it.
 *
 * The split is deliberate and follows the precedent the owner said he liked on the Recycle Bin:
 *   BUTTON  - only for what is reversible or non-destructive: restarting a named app (approved
 *             explicitly, and it closes gracefully first), and opening the bin to LOOK.
 *   COMMAND - anything that destroys data, takes the machine down, or rewrites the whole volume:
 *             rebooting, emptying the bin, TRIM/defrag. Copyable, never clickable. A dashboard should
 *             not be one misclick from taking the box down, and emptying the bin belongs behind
 *             Explorer's own confirmation. */
function leverHTML(f){
  const lv=f&&f.lever; if(!lv) return '';
  if(lv.kind==='restart-app')
    return `<div class="lvr"><button class="btn dgr" data-lv="restart" data-n="${String(lv.name).replace(/"/g,'&quot;')}">Restart ${lv.name}</button>
      <span class="lvn">closes it gracefully first, then relaunches from the same path${lv.mb?` · returns ~${(lv.mb/1024).toFixed(1)} GB`:''}</span></div>`;
  if(lv.kind==='recycle-open')
    return `<div class="lvr"><button class="btn" data-lv="recycle">Open the bin</button>
      <span class="lvn">opens Explorer so you can look first. Emptying stays yours: <code>Clear-RecycleBin -Force</code></span></div>`;
  if(lv.kind==='reboot')
    return `<div class="lvr"><code class="cmd" data-lv="copy">shutdown /r /t 0</code>
      <span class="lvn">not a button on purpose. Save your work, then run it or use Start &gt; Restart</span></div>`;
  if(lv.kind==='optimize')
    return `<div class="lvr"><code class="cmd" data-lv="copy">Optimize-Volume -DriveLetter C ${lv.ssd?'-ReTrim':'-Defrag'}</code>
      <span class="lvn">needs an elevated prompt · ${lv.ssd?'TRIM, not defrag: this is an SSD':'defrag is correct for a spinning disk'}</span></div>`;
  return '';
}
function wireLevers(root){
  root.querySelectorAll('[data-lv]').forEach(b=>{
    const kind=b.dataset.lv;
    if(kind==='copy'){ b.onclick=()=>{ try{ navigator.clipboard.writeText(b.textContent.trim()); toast('Command copied'); }catch{ toast('Copy failed'); } }; return; }
    if(kind==='recycle'){ b.onclick=async()=>{ try{ await fetch('/api/openrecycle',{method:'POST'}); toast('Recycle Bin opened'); }catch{ toast('Could not open it'); } }; return; }
    if(kind==='restart'){
      b.onclick=async()=>{
        const n=b.dataset.n;
        /* Same confirmation shape as End: this closes the app, and anything unsaved in it is the
           user's to lose. CloseMainWindow gives it the chance to save; nothing guarantees it takes it. */
        if(!confirm(`Restart ${n}?\n\nIt is asked to close normally first, so it can save. If it refuses, it is forced.\nThen it is relaunched from the same executable.`)) return;
        const was=b.textContent; b.disabled=true; b.innerHTML='<span class="spin"></span>&nbsp;restarting';
        try{
          const r=await (await fetch('/api/restartapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})).json();
          if(r.error) throw new Error(r.error);
          toast(`${r.name} restarted${r.forced?` (${r.forced} forced)`:''}`);
          setTimeout(()=>RENDER.diag(),1500);
        }catch(e){ toast('Restart failed: '+e.message); b.disabled=false; b.textContent=was; }
      };
    }
  });
}

/* ---- B2 (2026-07-31): the outcomes ledger, promoted from one sentence to a surface ----
 * MARKET_RESEARCH §3.2 calls this the actual moat — the one capability on the differentiator
 * list no competitor can copy without a per-machine history — and until today it rendered as a
 * single sentence on DIAG while the public landing page led with it. This page is presentation
 * over data the bridge has recorded all along (history/outcomes.jsonl, append-only, written by
 * the 30 s server-side loop whether or not any window exists): what has fired on THIS machine,
 * what cleared it, how long each fix held, which levers measurably moved the number.
 * Honesty rules carried over verbatim: every figure is a recorded measurement or a dash, and a
 * cleanup that returned nothing renders exactly like one that returned 2.3 GB — a ledger that
 * only remembers its wins is advertising. */
RENDER.led=async()=>{
  const el=$('#p-led');
  el.innerHTML=`<div class="hd"><h2>Outcomes</h2></div><div class="card"><div class="empty"><span class="spin"></span> replaying the ledger…</div></div>`;
  let r;
  try{ r=await (await fetch('/api/outcomes?n=8000')).json(); }
  catch(e){ el.innerHTML=`<div class="hd"><h2>Outcomes</h2></div><div class="card"><div class="empty">ledger unreadable: ${sysEsc(e.message)}</div></div>`; return; }
  const evs=r.recent||[], active=r.active||{};
  const esc=s=>sysEsc(String(s??''));
  const agoT=t=>{const h=(Date.now()-t)/3600000; return h<1?Math.max(1,Math.round(h*60))+' min':h<48?h.toFixed(1)+' h':(h/24).toFixed(1)+' days';};
  const durT=s=>s==null?NOVAL:s<90?Math.round(s)+' s':s<5400?Math.round(s/60)+' min':s<172800?(s/3600).toFixed(1)+' h':(s/86400).toFixed(1)+' days';
  const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[(s.length-1)>>1];};
  const when=t=>{const d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toTimeString().slice(0,5);};
  const sevCol={critical:'--crit',warning:'--warn',note:'--net'};
  const levTxt=l=>{const d=l.detail||{};
    return l.kind==='clean'?`clean ${esc(d.key||'')} → ${typeof d.freedGB==='number'?fmt(d.freedGB,2)+' GB back':NOVAL}`
      :l.kind==='kill'?`killed ${(d.pids||[]).length} process${(d.pids||[]).length===1?'':'es'}${d.name?' ('+esc(d.name)+')':''}`
      :l.kind==='task'?`task ${esc(d.name||'')} → ${d.enable?'on':'off'}`
      :l.kind==='ctl'?`dial ${esc((d.params&&d.params.act)||d.act||'')}`
      :l.kind==='restart-app'?`restarted ${esc(d.name||'')}`
      :esc(l.kind);};
  /* A SUMMARY CELL COUNTS; IT DOES NOT ENUMERATE.
     This was `+15 more · ` followed by the newest four joined with dots, which broke two rules at
     once. P2: a count you cannot open is worse than no count — "+15 more" states precisely what the
     reader is being denied. And a dot-joined run of records is a table that lost its nerve; rows
     are rows, and if they do not fit, the container is wrong rather than the content.
     The resolution is that the full list is ALREADY on this screen: the Levers panel renders every
     one as its own row. So this cell says how many there were and stops. That is a fact pointing at
     something present, not a count withheld — which is the whole difference. */
  const levList=(ls)=>{
    const n=ls.length;
    if(!n) return '<span class="muted2">no lever pulled</span>';
    if(n===1) return levTxt(ls[0]);
    return `<span class="muted2">${n} levers</span> <span class="muted2">· see Levers</span>`;
  };
  /* Δ of C: free across one cycle — rendered ONLY when both endpoints were recorded. `m0` is the
     metric snapshot at fire, `m` at clear; a missing side is a dash, never a zero. */
  const dFree=c=>(c&&c.m0&&c.m&&typeof c.m0.freeGB==='number'&&typeof c.m.freeGB==='number')?+(c.m.freeGB-c.m0.freeGB).toFixed(1):null;
  const dTxt=v=>v==null?NOVAL:`${v>0?'+':''}${fmt(v,1)} GB`;
  const dCls=v=>v==null?'muted2':v>0.4?'ok':v<-0.4?'warn':'muted2';

  if(!evs.length){
    el.innerHTML=`<div class="hd"><h2>Outcomes</h2></div>
      <div class="card"><div class="empty" style="text-align:left;line-height:1.6">Nothing recorded yet — the ledger writes its first line the first time a finding fires.
      From then on the bridge records every transition server-side, page open or not:
      finding <b>fired</b> → lever <b>pulled</b> → measured <b>delta</b> → finding <b>cleared</b>.
      When a finding fires again, DIAG quotes this record: what worked on <i>this</i> machine, not generic advice.</div></div>`;
    return;
  }

  /* one replay pass — the same fold the bridge does, kept here so the page can aggregate */
  const agg={}; const cycles=[]; const levers=[];
  for(const e of evs){
    if(e.ev==='fired'){
      const a=agg[e.id]||(agg[e.id]={fired:0,cleared:0,durs:[],holds:[],title:'',sev:'note'});
      a.fired++; if(e.title) a.title=e.title; if(e.sev) a.sev=e.sev;
      if(a.lastClearedAt) a.holds.push(e.at-a.lastClearedAt);
      a.lastFiredAt=e.at;
    }else if(e.ev==='cleared'){
      const a=agg[e.id]||(agg[e.id]={fired:0,cleared:0,durs:[],holds:[],title:'',sev:'note'});
      a.cleared++; if(typeof e.durSec==='number') a.durs.push(e.durSec);
      a.lastClearedAt=e.at; a.lastCycle=e; cycles.push(e);
    }else if(e.ev==='lever') levers.push(e);
  }
  const ids=Object.keys(agg).sort((x,y)=>agg[y].fired-agg[x].fired);
  const totFired=ids.reduce((n,k)=>n+agg[k].fired,0);
  const openIds=Object.keys(active);
  const allDurs=cycles.map(c=>c.durSec).filter(v=>typeof v==='number');
  const cleans=levers.filter(l=>l.kind==='clean'&&l.detail&&typeof l.detail.freedGB==='number');
  const cleanedGB=cleans.reduce((n,l)=>n+l.detail.freedGB,0);
  const firstAt=evs[0].at;

  const frow=id=>{const a=agg[id];
    const status=active[id]?`<b style="color:var(--warn)">open ${agoT(active[id].firedAt)}</b>`
      :a.lastClearedAt?`clear ${agoT(a.lastClearedAt)}`:NOVAL;
    const cyc=a.lastCycle;
    const lv=(cyc&&cyc.levers&&cyc.levers.length)?levList(cyc.levers)
      :cyc?`<span class="muted2">cleared on its own · <span class="${dCls(dFree(cyc))}">${dTxt(dFree(cyc))} free</span></span>`:NOVAL;
    return `<div class="lg-row">
      <div class="lg-id" title="${esc(a.title||id)}"><i style="background:var(${sevCol[a.sev]||'--net'})"></i><span>${esc(shortT(a.title)||id)}</span></div>
      <span class="lg-num">×${a.fired}</span>
      <span class="lg-num">${durT(med(a.durs))}</span>
      <span class="lg-num">${a.holds.length?durT(med(a.holds)/1000):NOVAL}</span>
      <span class="lg-num">${status}</span>
      <span class="what">${lv}</span></div>`;};
  /* same derivation the engine uses for its `short` field: claim before the separator */
  function shortT(t){ if(!t) return ''; const cut=String(t).split(' — ')[0].split(' · ')[0].trim(); return cut.length>=12?cut:String(t); }

  const cycRow=c=>{const a=agg[c.id]||{}; const d=dFree(c);
    return `<div class="lg-ev">
      <span class="t">${when(c.at)}</span>
      <span class="what" title="${esc(a.title||c.id)}"><i style="display:inline-block;width:6px;height:6px;border-radius:2px;background:var(${sevCol[a.sev]||'--net'});margin-right:6px"></i>${esc(shortT(a.title)||c.id)}</span>
      <span class="lg-num">open ${durT(c.durSec)}</span>
      <span class="lg-num ${dCls(d)}">${dTxt(d)}</span>
      <span class="what">${(c.levers&&c.levers.length)?levList(c.levers):'<span class="muted2">no lever pulled</span>'}</span></div>`;};

  const levRow=l=>`<div class="lg-ev" style="grid-template-columns:92px 1.6fr 2fr">
      <span class="t">${when(l.at)}</span>
      <span class="what">${levTxt(l)}</span>
      <span class="what muted2">${(l.during&&l.during.length)?'while open: '+l.during.map(esc).join(', '):'nothing open at the time'}</span></div>`;

  el.innerHTML=`
    <div class="hd"><h2>Outcomes</h2><span class="n">${evs.length} recorded events since ${when(firstAt)} · this machine only</span>
      <span class="sp"></span><button class="btn" id="ledRe" style="letter-spacing:0;text-transform:none">Refresh</button></div>
    <div class="hero" style="grid-template-columns:repeat(3,1fr)">
      <div class="hstat" style="--acc:var(--warn)">
        <div class="hl"><i></i>Findings fired</div>
        <div class="hv">${totFired}<small>· ${ids.length} distinct</small></div>
        <div class="hs">${openIds.length?`${openIds.length} open right now`:'none open right now'} — every one recorded by the bridge's 30 s loop, window open or not.</div>
      </div>
      <div class="hstat" style="--acc:var(--ok)">
        <div class="hl"><i></i>Cleared</div>
        <div class="hv">${cycles.length}<small>cycles</small></div>
        <div class="hs">median time-to-clear ${durT(med(allDurs))} — measured from fire to clear, not estimated.</div>
      </div>
      <div class="hstat" style="--acc:var(--cpu)">
        <div class="hl"><i></i>Levers pulled</div>
        <div class="hv">${levers.length}<small>${cleans.length?`· cleans returned ${fmt(cleanedGB,1)} GB`:''}</small></div>
        <div class="hs">${cleans.length?`across ${cleans.length} measured cleanups — including the ones that returned nothing.`:'kills, dials, task toggles and cleanups, each ledgered with a metric snapshot.'}</div>
      </div>
    </div>
    <div class="card lgcard"><h3>What has fired here <span class="muted">· by count</span></h3>
      <div class="lg-row h"><span>finding</span><span>fired</span><span>typical clear</span><span>stays clear</span><span>status</span><span>last cycle</span></div>
      <div class="lg-table">${ids.map(frow).join('')}</div></div>
    <div class="g2" style="grid-template-columns:1.35fr 1fr">
      <div class="card" style="margin-bottom:0"><h3>Every cycle <span class="muted">· newest first · Δ is C: free, recorded at fire and at clear</span></h3>
        <div class="lscroll">${cycles.slice().reverse().map(cycRow).join('')||'<div class="empty">no completed cycles yet</div>'}</div></div>
      <div class="card" style="margin-bottom:0"><h3>Levers <span class="muted">· what was actually done, and what it measurably returned</span></h3>
        <div class="lscroll">${levers.slice().reverse().map(levRow).join('')||'<div class="empty">no levers pulled yet — findings so far cleared on their own</div>'}</div></div>
    </div>
    <div class="card" style="margin-top:12px;margin-bottom:0"><div class="note" style="margin-top:0">
      Append-only record at <b>history/outcomes.jsonl</b>. A cleanup that returned <b>0.00 GB</b> is
      recorded as returning nothing, next to the one that returned 2.3 GB — the record is only worth
      quoting because it cannot flatter. When a finding fires again, DIAG cites this ledger:
      <i>"last time this fired, it cleared after…"</i> — what worked on <b>this machine</b>, which is
      the sentence no tool without a per-machine history can say.</div></div>`;
  $('#ledRe').onclick=()=>RENDER.led();
};

/* ================= TIME: clock, stopwatch, and a stopwatch that REMEMBERS =================
 * The owner's ask: a digital clock in the header, an analog one built from the same concentric arcs
 * the instrument already uses, and "not only a timer but a record" - a stopwatch with toggles for what
 * it should track while it runs.
 *
 * That last part is the reason this page is not a gadget. A stopwatch on a monitoring tool answers a
 * question nothing else here can: "what did this machine do during THAT" - during a build, an export,
 * a game, the four minutes it felt awful. The live pages show now and the history shows the shape of
 * the day, but neither scopes to an interval the user chose. So the run records min/avg/max per metric
 * over exactly the window between start and stop, and writes the summary into the journal, where it
 * joins the permanent record instead of vanishing with the page.
 *
 * The clock reuses the ring geometry deliberately: hours, minutes, seconds as three arcs, so it reads
 * as part of the same instrument rather than a widget bolted on. */
const SW = {
  running:false, t0:0, elapsed:0, laps:[],
  samples:[],                  // one row per tick while running
  trials:[],                   // banked runs: New trial keeps these, Reset clears them
  startedAt:null, stoppedAt:null,        // wall clock, so a recording can be placed in the day
  track:{ cpu:true, mem:true, disk:true, net:false, gpu:false, flt:false },
};
const SW_METRICS = {
  cpu:  { label:'CPU',          unit:'%',    color:'--cv-cpu',  get:t=>t.cpu.total },
  mem:  { label:'Memory',       unit:'%',    color:'--cv-mem',  get:t=>t.mem.pct },
  disk: { label:'Disk I/O',     unit:'MB/s', color:'--cv-disk', get:t=>(t.disk.io.readMBs||0)+(t.disk.io.writeMBs||0) },
  net:  { label:'Network',      unit:'MB/s', color:'--cv-net',  get:t=>(t.net.rxMBs||0)+(t.net.txMBs||0) },
  gpu:  { label:'GPU',          unit:'%',    color:'--cv-gpu',  get:t=>t.gpus?t.gpus.max:(t.gpu?t.gpu.util:0) },
  flt:  { label:'Hard faults',  unit:'/s',   color:'--crit',    get:t=>t.mem.pagesSec||0 },
};
const swMs   = ()=> SW.elapsed + (SW.running ? performance.now()-SW.t0 : 0);
const swFmt  = (ms)=>{ const t=Math.max(0,ms), h=Math.floor(t/3600000), m=Math.floor(t/60000)%60,
                       s=Math.floor(t/1000)%60, cs=Math.floor(t/10)%100;
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0'); };

/* Called from the tick, so the sample rate is the collector's real rate rather than a second clock
   that would drift against it. Every row carries its own timestamp for the same reason history does. */
function swSample(t){
  if(!SW.running||!t) return;
  const row={at:Date.now()};
  for(const k of Object.keys(SW_METRICS)) if(SW.track[k]) row[k]=+SW_METRICS[k].get(t)||0;
  SW.samples.push(row);
  if(SW.samples.length>7200) SW.samples.shift();     // 2 h at 1 Hz, then it rolls
}
function swStats(){
  const out={};
  for(const k of Object.keys(SW_METRICS)){
    if(!SW.track[k]) continue;
    const v=SW.samples.map(r=>r[k]).filter(x=>typeof x==='number');
    if(!v.length){ continue; }
    out[k]={ min:Math.min(...v), max:Math.max(...v), avg:v.reduce((a,b)=>a+b,0)/v.length, n:v.length };
  }
  return out;
}

/* One set of controls, two surfaces (2026-07-30). The main page and the docked sidebar drive the SAME
   SW object rather than each keeping their own, so a run started in the sidebar stops in the window and
   the metric toggles chosen in the window govern what the sidebar records. Two stopwatches that
   disagreed about whether they were running would be worse than one. */
function swToggle(){
  if(SW.running){
    SW.elapsed=swMs(); SW.running=false; SW.stoppedAt=Date.now();
    swReport();
  } else {
    if(!SW.elapsed){ SW.samples=[]; SW.laps=[]; SW.startedAt=Date.now(); SW.stoppedAt=null; }
    SW.t0=performance.now(); SW.running=true;
    const o=$('#swOut'); if(o) o.innerHTML='';
  }
  swPaintUI();
}
function swLapAdd(){
  if(!SW.running&&!SW.elapsed) return;
  const t=swMs(), prev=SW.laps.length?SW.laps[SW.laps.length-1].at:0;
  SW.laps.push({at:t,split:t-prev,wall:Date.now()});
  paintLaps(); swPaintUI();
}
function swResetAll(){
  SW.running=false; SW.elapsed=0; SW.laps=[]; SW.samples=[]; SW.startedAt=null; SW.stoppedAt=null;
  SW.trials=[];                       // Reset means reset: the trials go too, which is why New trial exists
  const o=$('#swOut'); if(o) o.innerHTML='';
  paintLaps(); paintTrials(); swPaintUI();
}
/* NEW TRIAL (owner's ask): bank this run and clear the timer WITHOUT losing the record. Reset wipes
   everything; this keeps the results so runs can be compared - which is the A/B compare idea arriving
   through the back door, and better than a separate feature because the comparison is just the list. */
function swNewTrial(){
  if(SW.running){ SW.elapsed=swMs(); SW.running=false; SW.stoppedAt=Date.now(); }
  const st=swStats();
  if(Object.keys(st).length){
    SW.trials.push({ n:SW.trials.length+1, ms:swMs(), startedAt:SW.startedAt, stoppedAt:SW.stoppedAt||Date.now(),
                     samples:(SW.samples||[]).length, stats:st });
  }
  SW.elapsed=0; SW.samples=[]; SW.laps=[]; SW.startedAt=null; SW.stoppedAt=null;
  const o=$('#swOut'); if(o) o.innerHTML='';
  paintLaps(); paintTrials(); swPaintUI();
}
function paintTrials(){
  const el=$('#swTrials'); if(!el) return;
  if(!SW.trials.length){ el.innerHTML=''; return; }
  const keys=[...new Set(SW.trials.flatMap(t=>Object.keys(t.stats)))];
  const clk=t=>new Date(t).toTimeString().slice(0,8);
  const fv=(k,v)=>(SW_METRICS[k].unit==='MB/s'||v<10)?fmt(v,2):fmt(v,0);
  el.innerHTML=`<div class="rl" style="margin-top:10px">trials · ${SW.trials.length}</div>
    <table class="dense swtab"><thead><tr><th>#</th><th>started</th><th class="num">time</th>
    ${keys.map(k=>`<th class="num">${SW_METRICS[k].label} avg / peak</th>`).join('')}</tr></thead><tbody>
    ${SW.trials.map(t=>`<tr><td>${t.n}</td><td class="muted">${clk(t.startedAt)}</td><td class="num">${swFmt(t.ms)}</td>
      ${keys.map(k=>t.stats[k]?`<td class="num">${fv(k,t.stats[k].avg)} / <b>${fv(k,t.stats[k].max)}</b></td>`:'<td class="num muted">—</td>').join('')}
    </tr>`).join('')}</tbody></table>`;
}
/* Repaints whichever of the two surfaces currently exists. Both may exist at once during a dock
   transition, so this never assumes which one it is looking at. */
function swPaintUI(){
  const running=SW.running, txt=swFmt(swMs());
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
  set('#swBig',txt); set('#sbSwBig',txt);
  set('#swState',running?'running':(SW.elapsed?'paused':'stopped'));
  for(const id of ['#swGo','#sbSwGo']){
    const b=$(id); if(!b) continue;
    b.textContent=running?'Stop':(SW.elapsed?'Resume':'Start');
    b.classList.toggle('go',!running);
  }
  for(const id of ['#swLap','#sbSwLap']){ const b=$(id); if(b) b.disabled=!running&&!SW.elapsed; }
  const r=$('#swReset'); if(r) r.disabled=!SW.elapsed&&!running;
}

/* ---- the ring clock: hours / minutes / seconds as three arcs ---- */
function drawClock(cv){
  if(!cv) return;
  const r=cv.getBoundingClientRect(); if(r.width<8||r.height<8) return;
  const dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.round(r.width*dpr), H=Math.round(r.height*dpr);
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,r.width,r.height);
  const cx=r.width/2, cy=r.height/2, R=Math.min(r.width,r.height)/2-14;
  const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  /* Local, because the ring renderer's hexA lives inside its own closure. Handles both #rgb/#rrggbb
     and an rgb()/rgba() value, since a CSS custom property can legitimately be either. */
  const hexA=(c,a)=>{
    c=String(c).trim();
    if(c.startsWith('#')){
      let h=c.slice(1);
      if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      const n=parseInt(h,16);
      return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
    }
    const m=c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    return m?`rgba(${m[1]},${m[2]},${m[3]},${a})`:c;
  };
  const now=new Date();
  const secF=(now.getSeconds()+now.getMilliseconds()/1000)/60;
  const minF=(now.getMinutes()+secF*60/60/60*0+now.getSeconds()/60)/60;
  const hrF =((now.getHours()%12)+now.getMinutes()/60)/12;
  const TOP=-Math.PI/2;
  /* A SNAKE EATING ITS TAIL, not an arc that snaps back to zero (owner's sketch). A plain sweep has a
     discontinuity every lap: the arc reaches the top, vanishes, and starts again. Here the head sits at
     the current fraction and the trail fades backwards over a whole revolution, so the oldest part is
     already at zero alpha by the moment the head laps it. Nothing ever disappears abruptly - it is the
     same "age fades as well as value" idea the instrument rings now use, which is why the clock reads
     as part of the same family rather than a widget bolted on. */
  const ring=(i,frac,col)=>{
    const rr=R-i*(R*0.155), lw=Math.max(4,R*0.075);
    x.lineCap='butt'; x.lineWidth=lw;
    x.beginPath(); x.strokeStyle=cs('--cv-track'); x.arc(cx,cy,rr,0,Math.PI*2); x.stroke();
    const head=TOP+Math.PI*2*frac;
    const N=Math.max(48,Math.round(rr*1.6));        // enough segments that the fade reads as smooth
    const c=cs(col);
    for(let s=0;s<N;s++){
      const a0=head-(Math.PI*2)*(s+1)/N, a1=head-(Math.PI*2)*s/N;
      const age=s/(N-1);                            // 0 at the head, 1 at the tail
      const alpha=Math.pow(1-age,1.7);              // fades to nothing before it laps itself
      if(alpha<0.012) break;                        // stop early: the rest is invisible anyway
      x.beginPath(); x.strokeStyle=hexA(c,alpha);
      x.arc(cx,cy,rr,a0,a1+0.004);                  // hair of overlap so the joins do not stripe
      x.stroke();
    }
    x.lineCap='round';                              // a round cap only on the head, so it reads as one
    x.beginPath(); x.strokeStyle=hexA(c,1); x.arc(cx,cy,rr,head-0.012,head); x.stroke();
  };
  /* Three rings, not four. A milliseconds ring was tried and removed: it read as motion but it made the
     dial busy and stole width from the three that carry the actual time. */
  ring(0,hrF, '--cv-cpu');
  ring(1,minF,'--cv-mem');
  ring(2,secF,'--cv-disk');
}

/* Power and network read straight off the live tick - no new plumbing, they just had nowhere to live
   before. Battery is the one number this machine has that nothing else on screen shows. */
function paintToolTiles(){
  const t=S.tick; if(!t) return;
  const p=$('#twPwr'), ps=$('#twPwrSub');
  if(p&&t.pwr){
    if(t.pwr.bat){
      p.innerHTML=`${t.pwr.pct}<small style="font-size:.45em;color:var(--ink-3)">%</small>`;
      const health=t.pwr.designWh&&t.pwr.fullWh?Math.round(t.pwr.fullWh/t.pwr.designWh*100):null;
      ps.innerHTML=`${t.pwr.ac?'on AC':'on battery'}${t.pwr.charging?' · charging':(t.pwr.rateW?` · ${fmt(t.pwr.rateW,1)} W`:' · no flow')}`
        +(health!==null?`<br>holds ${health}% of design · ${t.pwr.cycles||0} cycles`:'');
    } else { p.textContent='—'; ps.textContent='no battery reported'; }
    /* Which process is holding the machine awake (tick.wake, pmset assertions on macOS). Only where
       the platform is verified to answer it; an empty array is the real "nothing is" and says so. */
    if(ps&&can('power.wake')&&Array.isArray(t.wake)){
      ps.innerHTML+=`<br>${t.wake.length?('awake: '+t.wake.slice(0,2).map(w=>sysEsc(w.name)).join(', ')):'nothing blocks sleep'}`;
    }
  }
  const n=$('#twNet'), ns=$('#twNetSub');
  if(n){ const dn=t.net.rxMBs||0, up=t.net.txMBs||0;
    n.innerHTML=`${fmt(dn+up,2)}<small style="font-size:.42em;color:var(--ink-3)"> MB/s</small>`;
    ns.textContent=`↓ ${fmt(dn,2)} ↑ ${fmt(up,2)} MB/s`; }
}

/* Ports: the socket table already existed on the console, but "what owns port 3000" needed scrolling
   a 500-row list. Grouped by owning process and sorted by listeners first, which is the question
   people actually ask. */
async function paintPorts(){
  const el=$('#portBody'); if(!el) return;
  el.innerHTML='<div class="empty" style="padding:6px;font-size:10px"><span class="spin"></span> reading…</div>';
  let rows=[];
  try{ rows=await (await fetch('/api/conns')).json(); }catch(e){ el.innerHTML=`<div class="empty">failed: ${e.message}</div>`; return; }
  if(paintUnsupported(el,rows,'Socket and port enumeration')) return;
  if(!Array.isArray(rows)) rows=[];
  const port=s=>{ const m=String(s||'').match(/:(\d+)$/); return m?+m[1]:0; };
  const listen=rows.filter(r=>r.st==='Listen').sort((a,b)=>port(a.l)-port(b.l));
  const estab=rows.filter(r=>r.st==='Established');
  const byProc={};
  for(const r of estab){ const k=r.pn||r.pid||'?'; byProc[k]=(byProc[k]||0)+1; }
  el.innerHTML=
    `<div class="rl">listening · ${listen.length}</div>`
    + (listen.length?listen.slice(0,14).map(r=>
        `<div class="prow2"><span class="pp">${port(r.l)||'—'}</span><span class="ps">${sysEsc(r.pn||r.pid||'')}</span>
         <span class="pn2">${sysEsc(r.l)}</span></div>`).join('')
       :'<div class="btsub">nothing listening</div>')
    + `<div class="rl" style="margin-top:8px">talking out · ${estab.length} sockets</div>`
    + Object.entries(byProc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,c])=>
        `<div class="prow2"><span class="pp">${c}</span><span class="pn2">${sysEsc(n)}</span></div>`).join('');
}

/* Model and effort are SESSION settings on the CLI, so they take effect on the next question rather
   than retroactively - saved server-side because the bridge is what spawns the process. */
async function askCfg(patch){
  try{
    const d=await (await fetch('/api/ask/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(patch)})).json();
    ASK.cfg=d;
    const m=$('#askMode');
    if(m) m.textContent=`${d.authMode} · ${d.permissionMode} · ${d.model||'default model'}${d.effort?' · '+d.effort:''}`;
    return d;
  }catch(e){ toast('Could not save: '+e.message); }
}
function askAuth(){
  const c=ASK.cfg||{};
  const cur=c.hasKey?`An API key is saved (${c.keyTail}).`:'No API key saved — using the Claude Code login on this machine.';
  const v=prompt(
    `${cur}\n\n`+
    `Leave blank and press OK to KEEP the current setting.\n`+
    `Type "clear" to remove a saved key and go back to the CLI login.\n`+
    `Or paste an Anthropic API key — needed on a machine where Claude Code is installed but not logged in.\n\n`+
    `The key is stored locally, outside the VITALS folder (%LOCALAPPDATA%\vitals on Windows), and is never included in a support bundle.`, '');
  if(v===null) return;
  const t=v.trim();
  if(!t) return;
  askCfg({apiKey: t.toLowerCase()==='clear' ? '' : t}).then(d=>{
    if(d) toast(d.hasKey?`API key saved (${d.keyTail})`:'Key cleared — using the CLI login');
  });
}
