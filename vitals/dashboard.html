/* THE INSTALL'S OWN LIMITS, stated on the same page that states its cost. Someone looking at a
   missing gauge should be one click from the reason, and someone filing a bug from a Mac should be
   told, by the tool itself, that its collector has never been verified there. */
/* THE MODE SWITCH lives beside "what it can measure", because both are facts about the INSTALL
   rather than about the machine - which is also why it is not on the CTRL page, where every other
   control writes to Windows itself.
   Only one direction is offered. Dropping to viewer is a button; coming back is not, and the panel
   says so plainly instead of showing a disabled control that invites a fight. */
async function paintMode(){
  const box=$('#sfMode'); if(!box) return;
  let m=null;
  try{ m=await (await fetch(API('/api/mode'))).json(); }catch{}
  if(!m){ box.innerHTML='<div class="sfl"><span>could not read the mode</span></div>'; return; }
  if(m.mode==='admin'){
    box.innerHTML=
      `<div class="sfl"><b>Admin — full technician access</b><span>Kill a process, clear caches,
        restart an app, pull the machine's own dials. Ask can edit files.</span></div>`+
      `<div class="sfl"><b>Viewer mode</b><span>Reads, diagnoses, reports and exports; changes nothing
        about the machine. Its own theme and layout stay yours. Refused at the bridge, so it holds for
        anything that can reach the port — not just this window.
        <br><br><b style="color:rgb(var(--t3))">One way.</b> Viewer cannot switch itself back; that
        needs a relaunch with <code>VITALS_MODE=admin</code>. A switch the viewer can flip would not
        be a restriction.</span>
        <div style="margin-top:8px"><button class="btn dgr" id="goViewer">Switch to viewer mode</button>
        <button class="btn" id="setPass" style="margin-left:6px">${m.hasPass?'Change':'Set'} passphrase</button></div></div>`+
      `<div class="sfl"><b>Getting back in</b><span>${m.hasPass
        ? 'A passphrase is set, so viewer mode can be left from this page by entering it.'
        : 'No passphrase set, so viewer mode can only be left by relaunching with <code>VITALS_MODE=admin</code>. Set one if you want a way back from the panel.'}
        <br><br><b style="color:rgb(var(--t3))">What a passphrase is worth.</b> It stops mistakes and
        casual poking. It is not a security boundary: anyone with a shell here can set the environment
        variable, edit <code>history/mode.json</code>, or delete the stored hash. A real boundary means
        running the bridge as an account the viewer cannot write as.</span></div>`;
    const sp=$('#setPass');
    if(sp) sp.onclick=async()=>{
      const askNew=['Enter a NEW admin passphrase.','',
        'Leave blank and press OK to REMOVE it (viewer would then need a relaunch to escape).'].join('\n');
      const askFirst=['Choose an admin passphrase (6+ characters).','',
        'It lets you leave viewer mode from this page.'].join('\n');
      const v=prompt(m.hasPass?askNew:askFirst,'');
      if(v===null) return;
      try{
        const r=await (await fetch(API('/api/mode/password'),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:v.trim()})})).json();
        if(r.error) return toast(r.error);
        toast(r.hasPass?'Passphrase set':'Passphrase removed');
        paintMode();
      }catch(e){ toast('Could not save: '+e.message); }
    };
    const b=$('#goViewer');
    if(b) b.onclick=async()=>{
      const warn=['Switch this install to VIEWER mode?','',
        'Actions will be refused by the bridge and Ask drops to read-only.','',
        'You cannot switch back from the panel — it needs a relaunch with VITALS_MODE=admin.'].join('\n');
      if(!confirm(warn)) return;
      b.disabled=true; b.textContent='switching…';
      try{
        const r=await (await fetch(API('/api/mode'),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({mode:'viewer'})})).json();
        toast(r.note||'Now in viewer mode',5000);
        paintMode();
      }catch(e){ toast('Could not switch: '+e.message); b.disabled=false; b.textContent='Switch to viewer mode'; }
    };
  }else{
    box.innerHTML=
      `<div class="sfl"><b style="color:rgb(var(--t2))">Viewer — reads and reports only</b>
        <span>${m.detail||'This install cannot change the machine. Diagnosis, history, journal, reports and exports all work; anything that would alter the box is refused by the bridge.'}</span></div>`+
      /* THE BUTTON IS ALWAYS HERE, passphrase or not. Showing it only when one was set meant that on
         an install without a passphrase viewer mode rendered as a wall of text with no control at
         all - the reader is left hunting for a way out that is only mentioned in a paragraph. A
         control that explains why it cannot help is far better than a missing one. */
      `<div class="sfl"><b>Getting back to admin</b><span>${m.hasPass
          ? 'A passphrase is set on this install — enter it to restore full technician access. Five wrong attempts pause it for a minute.'
          : '<b style="color:rgb(var(--t3))">No passphrase was set before this install switched to viewer</b>, so there is nothing to enter. It can only be unlocked by relaunching — see below.'}</span>
        <div style="margin-top:8px"><button class="btn" id="unlockAdmin">Unlock admin</button></div></div>`+
      `<div class="sfl"><b>${m.hasPass?'Or relaunch':'Relaunch to unlock'}</b><span>Close the panel
        and relaunch with the mode set — deliberately outside the surface viewer mode governs:
        <br><br><code>$env:VITALS_MODE='admin'; node start.js</code>
        <br><br>The setting persists afterwards, so ordinary launches stay in admin. Set a passphrase
        once you are back in and this page will offer a button instead.</span>
        <div style="margin-top:8px"><button class="btn" id="copyRelaunch">Copy the command</button></div></div>`;
    const cr=$('#copyRelaunch');
    if(cr) cr.onclick=()=>{ try{ navigator.clipboard.writeText("$env:VITALS_MODE='admin'; node start.js");
      toast('Command copied — run it from the vitals folder',4500); }catch{ toast('Copy failed'); } };
    const ua=$('#unlockAdmin');
    if(ua) ua.onclick=async()=>{
      /* No passphrase means the button cannot do its job - so it says so, in the place the user is
         already looking, rather than opening a prompt that can only ever be rejected. */
      if(!m.hasPass){
        alert(['No admin passphrase is set on this install.','',
          'Viewer mode can only be left by relaunching:',
          "  $env:VITALS_MODE='admin'; node start.js",'',
          'Run it from the vitals folder. Once you are back in admin you can set a passphrase, and',
          'this button will work from then on.'].join(String.fromCharCode(10)));
        return;
      }
      const v=prompt('Enter the admin passphrase to restore full access:','');
      if(v===null||!v.trim()) return;
      ua.disabled=true; ua.textContent='checking…';
      try{
        const r=await (await fetch(API('/api/mode'),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({mode:'admin',password:v.trim()})})).json();
        if(r.error){ toast(r.error); ua.disabled=false; ua.textContent='Unlock admin'; return; }
        toast('Admin access restored',5000);
        paintMode();
      }catch(e){ toast('Failed: '+e.message); ua.disabled=false; ua.textContent='Unlock admin'; }
    };
  }
}
function paintCaps(){
  const box=$('#sfCaps'); if(!box) return;
  const c=S.caps;
  if(!c){ box.innerHTML=`<div class="sfl"><span>waiting for the host description…</span></div>`; return; }
  const verdict = c.verified===false
    ? `<b style="color:rgb(var(--t3))">Unverified collector</b><span>${c.verifyNote||''}</span>`
    : `<b>Verified</b><span>${typeof c.verified==='string'?c.verified:'this platform is the reference implementation'}</span>`;
  const nice=k=>k.replace(/^\w+\./,'').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase();
  const lim=(c.limited||[]).map(k=>`<div class="sfl"><b>${nice(k)} · limited</b><span>${capNote(k)||'weaker than the reference implementation on this platform.'}</span></div>`).join('');
  const mis=(c.missing||[]).map(k=>`<div class="sfl"><b>${nice(k)} · not available</b><span>${capNote(k)||'this operating system does not expose it to unprivileged code, so it is omitted rather than shown as zero.'}</span></div>`).join('');
  box.innerHTML=
    `<div class="sfl"><b>${c.name}${c.supported?'':' · unsupported'}</b><span>${c.collector}</span></div>`+
    `<div class="sfl">${verdict}</div>`+
    (lim||mis ? lim+mis
      : `<div class="sfl"><b>Nothing withheld</b><span>every feature this panel can draw is measurable on this host.</span></div>`);
}

let fxLastFire=0, AC=null;
function fxAudio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();

addEventListener('pointerdown',()=>{ if(FXS.sound&&(!AC||AC.state!=='running')) fxAudio(); });
function fxSound(sev){
  const ac=fxAudio(); if(!ac||ac.state!=='running') return;
  const t0=ac.currentTime, g=ac.createGain(); g.connect(ac.destination);
  const v=.28*FXS.vol*FXS.vol+.0001;
  const o=ac.createOscillator(); o.connect(g);
  if(sev==='crit'){ // low double-thud: fundamental drop + a short sub knock
    o.type='sine'; o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(44,t0+.24);
    g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.34); o.start(t0); o.stop(t0+.36);
    const o2=ac.createOscillator(),g2=ac.createGain(); o2.type='square'; o2.frequency.value=88;
    g2.gain.setValueAtTime(v*.12,t0); g2.gain.exponentialRampToValueAtTime(.0001,t0+.1);
    o2.connect(g2); g2.connect(ac.destination); o2.start(t0); o2.stop(t0+.12);
  } else if(sev==='warn'){ // falling blip
    o.type='triangle'; o.frequency.setValueAtTime(392,t0); o.frequency.exponentialRampToValueAtTime(196,t0+.11);
    g.gain.setValueAtTime(v*.7,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.16); o.start(t0); o.stop(t0+.18);
  } else { // rising resolve for a clear
    o.type='sine'; o.frequency.setValueAtTime(523,t0); o.frequency.setValueAtTime(784,t0+.07);
    g.gain.setValueAtTime(v*.5,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.22); o.start(t0); o.stop(t0+.24);
  }
}
function fxFire(sev,audition){

    if(!(FXS.flash||FXS.glitch||FXS.sound)) return;

  const tri=cssv(sev==='crit'?'--crit-r':sev==='warn'?'--warn-r':'--ok-r')||'255,176,58';
  document.documentElement.style.setProperty('--evr',tri);
  if(FXS.flash||audition){ const e=document.getElementById('fxedge');
    if(e){ e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); } }
  if((FXS.glitch||audition)&&sev!=='ok'){ const gl=document.getElementById('fxglitch');

function paintCtl(){
  const st=CTL.state, g=id=>document.getElementById(id);
  if(!st||!g('ctPower')) return;
  // power plans — built from what the machine actually offers
  g('ctPower').innerHTML=(st.powerPlans||[]).map(p=>
    `<b data-guid="${p.guid}" class="${p.active?'on':''}">${sysEsc(p.name.toUpperCase())}</b>`).join('');
  $$('#ctPower b').forEach(b=>b.onclick=()=>ctlPost({act:'powerplan',guid:b.dataset.guid}));
  const on=(id,val)=>$$('#'+id+' b').forEach(b=>b.classList.toggle('on',b.dataset.v===String(val)));
  on('ctMode',st.appsLight?1:0); on('ctTrans',st.transparency?1:0);
  on('ctTb',st.taskbarAl==null?1:st.taskbarAl);
  on('ctExt',st.hideExt?0:1); on('ctHid',st.showHidden===1?1:0);
  on('ctPrev',st.colorPrevalence?1:0);
  // accent swatches: mark whichever matches the live DWM value; always show the live value chip
  const cur=st.accentColor>>>0;
  $$('#ctDots .dot2').forEach(d=>{ if(d.dataset.ab) d.classList.toggle('on',(+d.dataset.ab>>>0)===cur); });
  const lv=g('ctAccNow'); if(lv){ lv.style.background=ABCSS(cur); lv.title='live DWM accent'; }
  const ms=g('ctSpeed'); if(ms){ ms.value=st.mouseSpeed||10; fxDialPaint(ms); g('ctSpeedV').textContent=st.mouseSpeed; }
  const mt=g('ctTrails'); if(mt){ mt.value=st.mouseTrails||0; fxDialPaint(mt); g('ctTrailsV').textContent=st.mouseTrails||0; }
  // the record + baseline
  g('ctRec').innerHTML=CTL.recent.slice(0,5).map(e=>{
    const t=new Date(e.ts).toTimeString().slice(0,8);
    const s=e.snap?` · cpu ${e.snap.cpu}% ram ${e.snap.ram}% dq ${e.snap.dq}`:'';
    return `<div class="crec"><time>${t}</time><b>${sysEsc(e.act)}</b><span class="sm">${sysEsc(JSON.stringify(e.params))}${s}</span></div>`;
  }).join('')||'<div class="crec"><span class="sm">no pulls yet; the record starts with your first one</span></div>';
  const bl=Object.keys(CTL.baseline);
  g('ctBase').textContent=bl.length?('bottled: '+bl.join(' · ')):'nothing written yet; baseline bottles each dial the first time you pull it';
  if(g('ctW')) g('ctW').textContent=CTL.recent.length?CTL.recent.length+' ledgered':'none yet';
  if(g('ctBW')) g('ctBW').textContent=bl.length+' keys';
}
function paintCtlLive(t){
  const el=document.getElementById('ctTame'); if(!el||!t||!t.proc) return;
  const top=[...t.proc].sort((a,b)=>b.cpu-a.cpu).slice(0,4);
  el.innerHTML=top.map(p=>`<div class="tame"><span class="tn">${sysEsc(p.n)}${p.count>1?' ×'+p.count:''}</span>
    <span class="tv">${fmt(p.cpu,1)}% · ${fmt(p.mb/1024,1)} GB</span>
    <span class="tp">own-user instances only</span>
    <span class="abt" data-tame="${sysEsc(p.n)}">tame</span><span class="abt" data-untame="${sysEsc(p.n)}">restore</span></div>`).join('');
  $$('#ctTame [data-tame]').forEach(b=>b.onclick=()=>{
    if(confirm(`Set every ${b.dataset.tame} process you own to BelowNormal priority?\nReversible with its restore button; the pull is ledgered.`))
      ctlPost({act:'priority',name:b.dataset.tame,level:'BelowNormal'}); });
  $$('#ctTame [data-untame]').forEach(b=>b.onclick=()=>ctlPost({act:'priority',name:b.dataset.untame,level:'Normal'}));
}

/* ---- machine presets: the Plus!-era theme pack, reborn. A preset is a VECTOR of verified
   ctl actions + a VITALS look — wallpaper/cursors/sounds join when their paths verify. ---- */
const MPRESETS={
  neon:{label:'NEON NIGHT',bg:'#060310',ink:'#00e0ff',look:'cyberpunk',
    what:'windows goes dark · accent cyan · transparency on · pointer trails · vitals wears cyberpunk',
    acts:[{act:'appsmode',light:0},{act:'transparency',on:1},{act:'accent',abgr:AB('#00E0FF')},{act:'mousetrails',n:3}]},
  paper:{label:'PAPER DAY',bg:'#f3f2ee',ink:'#0e7f78',look:'pro',
    what:'windows goes light · accent teal · trails off · vitals wears studio',
    acts:[{act:'appsmode',light:1},{act:'transparency',on:1},{act:'accent',abgr:AB('#0E7F78')},{act:'mousetrails',n:0}]},
  yours:{label:'YOURS',bg:'transparent',ink:'',restore:true,
    what:'every machine dial back to its first-captured baseline: the machine as it was, bottled'},
};
async function applyMachinePreset(k){
  const P=MPRESETS[k]; if(!P) return;
  if(P.restore){
    if(!confirm('Restore every machine dial to its captured baseline?')) return;
    await fetch('/api/ctl/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    sysPush('info','ctl','machine restored to baseline'); toast('Machine: restored to baseline'); return;
  }
  if(!confirm(`Apply "${P.label}" to WINDOWS itself?\n${P.what}\nPrior values are captured first; YOURS puts them back.`)) return;
  for(const a of P.acts){ try{ await ctlPost(a,true); }catch{} }
  if(P.look) fxLook(P.look,true);
  sysPush('info','ctl','machine preset applied: '+P.label);
  toast('Machine theme: '+P.label);
}

/* boot: reapply the saved FX state (theme itself was applied above; looks/dials layer on it) */
(function(){
  try{ const s=JSON.parse(localStorage.getItem('vitals-fx')||'0');
    if(s&&typeof s==='object'){ if(LOOKS[s.look]) FXS.look=s.look;
      FXS.flash=s.flash?1:0; FXS.glitch=s.glitch?1:0; FXS.sound=s.sound?1:0;
      FXS.vol=typeof s.vol==='number'?clamp(s.vol,0,1):.5;
      if(s.vars&&typeof s.vars==='object') FXS.vars=s.vars; } }catch{}
  const L=LOOKS[FXS.look], cur=document.documentElement.dataset.theme||'dark';
  if(!L){ FXS.look=cur; return; }
  if(L.base!==cur){ window.__fxApplying=true; try{ setTheme(L.base,true); }finally{ window.__fxApplying=false; } }
  if(Object.keys(L.vars).length||Object.keys(FXS.vars).length) fxSyncInline();
})();

/* The verdict is the headline, so it belongs on the overview — not buried behind a tab. Polled
   rather than pushed: the rules read minutes of history, so re-running at 1 Hz would be waste. */
async function pollDiagnosis(){
  try{
    const d=await (await fetch('/api/diagnose')).json();
    const n=(d.counts?d.counts.critical+d.counts.warning:0);
    const b=$('#diagBadge');
    if(b){ b.textContent=n>9?'9+':n; b.classList.toggle('on',n>0);
           b.style.background=d.counts&&d.counts.critical?'var(--crit)':'var(--warn)'; }
    /* The SHORT form on every compact surface. `summary` is findings[0].title, i.e. the full sentence
       with its trailing clause; on the overview and the topbar strip that clause wraps to a second and
       third line inside the ring. The engine already derives the short version, so use it. */
    const worst0=(d.findings&&d.findings[0])||null;
    const shortSummary = worst0 ? (worst0.short||worst0.title) : '';
    lastVerdict = shortSummary;
    lastFindings = d.findings||[];
    try{ sysDiag(d); }catch{}
    const cv=$('#cVerdict');
    if(cv) cv.textContent = lastVerdict;
    paintFindings();
    const v=$('#ovVerdict');
    if(v&&d.summary){
      const crit=d.counts&&d.counts.critical>0;
      v.textContent=shortSummary||'click a ring to drill in';
      v.title=worst0?worst0.title:'';                       // full sentence on hover
      v.style.color=crit?'var(--crit)':(d.findings&&d.findings.length?'var(--warn)':'');
      v.style.opacity=d.findings&&d.findings.length?'.95':'.5';
      v.style.maxWidth='340px'; v.style.margin='20px auto 0'; v.style.lineHeight='1.5';
    }
  }catch{}
}
/* ============ native window control ============
   The page drives its own OS window through the bridge's Win32 agent. Chromium's --app mode still
   draws a title bar and a square frame; stripping the frame and clipping to a rounded region are
   both Win32 operations with no CSS equivalent — border-radius rounds the PAGE, not the window,
   which is why the corners looked like they were floating inside a rectangle. */
/* The panel is a WinForms window (FormBorderStyle=None) hosting WebView2, so there is no frame to
   fight — the host owns the window and the page just tells it what to do over WebView2's message
   channel. `window.chrome.webview` exists ONLY inside that host, which is also how we detect
   whether we're in the panel or an ordinary browser tab. */
const HOST = !!(window.chrome && window.chrome.webview);
const send = (m)=>{ if(HOST) window.chrome.webview.postMessage(m); };
let alphaIdx=0, isTop=true;
const ALPHAS=[255,240,215,185];

function wireWindow(){
  document.body.classList.toggle('native',HOST);
  if(!HOST){                       // plain browser tab: the window chrome isn't ours to control
    $('#wctl').style.display='none';
    $('#grip').style.display='none';
  }
}

// mousedown, not click: the host hands the press straight to the window manager, so the drag is
// native and picks up snap and aero gestures for free.
$('#grip').addEventListener('mousedown',e=>{ if(e.button===0){ e.preventDefault(); send('drag'); } });
/* DOCKED: the strip itself is the drag handle, minus anything you could press. `closest` rather than
   a tag check, because the press usually lands on a <span> inside the button, not the button. */
const NO_DRAG='button,a,input,select,textarea,[data-go],[data-sug],.btn,.sbt,.rb,.cm,.swchk';
$('#shell').addEventListener('mousedown',e=>{
  if(e.button!==0 || !document.body.classList.contains('docked')) return;
  if(e.target.closest && e.target.closest(NO_DRAG)) return;   // a control: let it have the click
  e.preventDefault(); send('drag');
});
// Docked, four buttons eat a chunk of a 104 px bar. Collapse to one, expand on click.
$('#wMore').onclick=e=>{ e.stopPropagation();
  const open=$('#wctl').classList.toggle('open');
  /* Mirrored onto <body> so the HEADER can widen its gutter while the controls are expanded - a
     sibling selector cannot reach back up to #top from inside the fixed overlay. */
  document.body.classList.toggle('wctl-open',open); };
addEventListener('click',e=>{ if(!$('#wctl').contains(e.target)){ $('#wctl').classList.remove('open'); document.body.classList.remove('wctl-open'); } });
$('#wMin').onclick=()=>send('min');
$('#wClose').onclick=()=>send('close');
$('#wTop').onclick=()=>{
  isTop=!isTop; send('top:'+(isTop?1:0));
  $('#wTop').style.color=isTop?'var(--cpu)':'';
  toast(isTop?'Always on top':'Normal window order');
};
$('#wOpacity').onclick=()=>{
  alphaIdx=(alphaIdx+1)%ALPHAS.length;
  send('alpha:'+ALPHAS[alphaIdx]);
  toast(`Opacity ${Math.round(ALPHAS[alphaIdx]/255*100)}%`);
};
// double-click the grip cycles half-screen docking, since a frameless window has no snap edges
let snapState=0;
$('#grip').addEventListener('dblclick',()=>{
  snapState=(snapState+1)%3;
  send('snap:'+['reset','left','right'][snapState]);
});

/* ============ docked modes ============
   The host decides the mode (it owns the geometry and knows where the cursor let go) and tells the
   page, which swaps to a compact strip. Layout has to change, not just shrink: a 132 px sidebar
   fits five stacked readouts and nothing else. */
let mode='panel';
// buildCompact() replaces the whole strip, which wiped the verdict until the next 10 s poll — a
// visibly empty bottom third of the sidebar every time you docked. Cache and reapply.
let lastVerdict='', lastFindings=[];
// The findings list is the one thing here no other monitor shows, so it earns the space the
// sidebar had spare rather than that space being padding.
function paintFindings(){
  const el=$('#cFindings'); if(!el) return;
  /* short, not title: these are one-line chips in the overview and the docked strip. The engine derives
     the short form by dropping the clause after the dash; the full sentence lives on DIAG. */
  el.innerHTML = lastFindings.slice(0,5).map(f=>
    `<div class="fnd ${f.sevName}" title="${String(f.title).replace(/"/g,'&quot;')}"><i></i><span>${f.short||f.title}</span></div>`).join('')
    || '<div class="fnd note"><i></i><span>Nothing wrong that I can measure.</span></div>';
}
const CM=[
  {k:'cpu', l:'CPU',  c:'--cpu',  v:t=>[fmt(t.cpu.total),'%']},
  {k:'mem', l:'MEM',  c:'--mem',  v:t=>[fmt(t.mem.pct),'%']},
  {k:'disk',l:'FREE', c:'--disk', v:t=>{const d=sysVol(t);return d?[fmt(d.freeGB,0),'GB']:['—','']}},
  {k:'net', l:'NET',  c:'--net',  v:t=>[fmt(t.net.rxMBs+t.net.txMBs,1),'MB/s']},
  {k:'gpu', l:'GPU',  c:'--gpu',  v:t=>t.gpus?[fmt(t.gpus.max,0),'%']:(t.gpu?[fmt(t.gpu.util),'%']:['—',''])},
];
const GOTO={cpu:'cpu',mem:'mem',disk:'disk',net:'net',gpu:'therm',flt:'mem'};
// Sixth readout exists only in the sidebar grid, but paintCompact must be able to resolve it too,
// so the combined list lives here rather than inside the builder.
const CM6=[...CM,{k:'flt',l:'FAULTS',c:'--crit',v:t=>[fmt(t.mem.pagesSec),'/s']}];
const chip=(m)=>`<div class="cm" data-k="${m.k}" data-go="${GOTO[m.k]||'ov'}">
    <i class="acc" style="background:var(${m.c})"></i>
    <div class="cl">${m.l}</div><div class="cv"><span class="v">—</span><small class="u"></small></div>
    ${m.k==='cpu'?'<div class="tcores"></div>':''}<span class="sub" data-f="${m.k}sub"></span>
    <canvas></canvas></div>`;

/* Fields resolved on every tick. Keyed by data-f, so the two layouts can pick whichever subset
   they have room for without either builder knowing about the other. */
const FIELD={
  cpusub:  t=>`${S.static?S.static.threads:'?'}T`,
  memsub:  t=>`${fmt(t.mem.freeMB/1024,1)} GB free`,
  disksub: t=>{const d=sysVol(t);return d?`${d.pct}% used`:''},
  netsub:  t=>`u ${fmt(t.net.txMBs,2)}`,
  // name the BUSIEST adapter, not both: answers "which silicon is that %" in the strip's width
  gpusub:  t=>{ if(t.gpus&&t.gpus.ads&&t.gpus.ads.length){
      const a=[...t.gpus.ads].sort((x,y)=>y.util-x.util)[0];
      const tok=gpuShort(a.n).split(' ').sort((x,y)=>x.length-y.length)[0];
      return `${tok} ${fmt(a.util,0)}%`; }
    return t.gpu?`${t.gpu.temp}°C ${fmt(t.gpu.watts,0)}W`:''; },
  iov:     t=>`${fmt(t.disk.io.readMBs,1)}/${fmt(t.disk.io.writeMBs,1)}`,
  busy:    t=>t.disk.io.busyPct==null?NOVAL:`${fmt(t.disk.io.busyPct)}%`,
  queue:   t=>fmt(t.disk.io.queue,1),
  faults:  t=>fmt(t.mem.pagesSec),
  cached:  t=>`${fmt(t.mem.cacheMB/1024,1)} GB`,
  commit:  t=>t.mem.committedMB==null?NOVAL:`${fmt(t.mem.committedMB/1024,1)} GB`,
  vram:    t=>t.gpu?`${fmt(t.gpu.memUsed/1024,1)}/${fmt(t.gpu.memTotal/1024,1)}`:'—',
  gtemp:   t=>t.gpu?`${t.gpu.temp}°C`:'—',
  gwatt:   t=>t.gpu?`${fmt(t.gpu.watts,1)} W`:'—',
  up:      t=>`${fmt(t.up,0)}h`,
  netdn:   t=>`${fmt(t.net.rxMBs,2)} MB/s`,
  netup:   t=>`${fmt(t.net.txMBs,2)} MB/s`,
  samples: t=>fmt(S.hist.cpu.length),
  topcpu:  t=>{const p=[...t.proc].sort((a,b)=>b.cpu-a.cpu)[0];return p?`${p.n} ${fmt(p.cpu,0)}%`:''},
  topmem:  t=>{const p=[...t.proc].sort((a,b)=>b.mb-a.mb)[0];return p?`${p.n} ${fmt(p.mb/1024,1)}G`:''},
};
const rows=(list)=>list.map(r=>`<div class="kvr"><span>${r[0]}</span><b data-f="${r[1]}">—</b></div>`).join('');

function buildCompact(){
  const sb = mode.startsWith('sidebar');
  const el = $('#compact');
  if(sb){
    // 2 x 3 grid rather than five full-width rows: a 138 px bar showing "49%" left-aligned wastes
    // its entire right half. Sixth cell is hard faults — the number the playbook argues is the
    // truest measure of memory pressure, and it had nowhere prominent to live.
    el.innerHTML =
      `<div class="cgrid">${CM6.map(chip).join('')}</div>`
      + `<div class="chead">Threads</div><div class="cores" id="cCores"></div>`
      + `<div class="chead">Memory</div>` + rows([['Faults/s','faults'],['Cached','cached'],['Commit','commit']])
      + `<div class="chead">Disk I/O</div>` + rows([['Busy','busy'],['Queue','queue'],['R/W','iov']])
      + `<div class="chead">Network</div>` + rows([['Down','netdn'],['Up','netup']])
      // labelled NVIDIA, not GPU: temp/power/VRAM come from nvidia-smi and describe ONLY that
      // card — the GPU chip above reads the busiest of both adapters (engine counters)
      + `<div class="chead">NVIDIA</div>` + rows([['Temp','gtemp'],['Power','gwatt'],['VRAM','vram']])
      + `<div class="chead">Trend</div>`
      + ['cpu','mem','disk'].map(k=>`<div class="spark" data-s="${k}"><span>${k}</span><canvas></canvas></div>`).join('')
      + `<div class="chead">Top CPU</div><div id="cTopCpu"></div>`
      + `<div class="chead">Top memory</div><div id="cTopMem"></div>`
      + `<div class="chead">Uptime</div>` + rows([['Since boot','up'],['Samples','samples']])
      // No #cVerdict here: the verdict IS findings[0], so printing both put the same sentence on
      // screen twice. The topbar keeps it because it has no room for the list.
      // Heading and list wrapped together: margin-top:auto on the list alone pinned it to the
      // bottom while its heading stayed put, leaving a labelled gap between them.
      /* Clock and stopwatch live here because the docked strip is the surface that is actually on
         screen all day. Time sits BELOW the ring, per the owner's sketch. The stopwatch is the same
         SW object the window drives, so a run started here reports against the metric toggles chosen
         over there rather than keeping a second, disagreeing set. */
      + `<div class="chead">Clock</div>`
      + `<div class="sbclock"><canvas id="sbClockC"></canvas></div>`
      + `<div class="sbtime" id="sbTime">—</div><div class="sbdate" id="sbDate"></div>`
      /* NO "Stopwatch" HEADING and no tracked-metrics line. In a 138px strip both were paying rent:
         a running timer above a Start button needs no label to say what it is, and the metric list
         is a setting chosen in the main window - it belongs where it is chosen, not repeated under
         every glance. Dropping them buys the vertical air the readouts actually needed. */
      + `<div class="sbsw"><div class="sbswbig" id="sbSwBig">00:00.00</div>`
      +   `<div class="sbswrow"><button class="btn go" id="sbSwGo">Start</button>`
      +   `<button class="btn" id="sbSwLap" disabled>Lap</button></div></div>`
      + `<div class="fblock"><div class="chead">Findings</div><div id="cFindings"></div></div>`;
  } else {
    el.innerHTML =
      CM.map(chip).join('')
      + [['DISK','busy'],['QUEUE','queue'],['R/W','iov'],['FAULTS','faults'],
         ['CACHED','cached'],['COMMIT','commit'],['VRAM','vram'],
         ['DOWN','netdn'],['UP↑','netup'],['TOP CPU','topcpu'],['TOP MEM','topmem'],['UPTIME','up']]
        .map(([l,f])=>`<div class="cm"><div class="cl">${l}</div><div class="cv"><span data-f="${f}">—</span></div></div>`).join('')
      + `<div id="cVerdict"></div>`;
  }
  $$('#compact .cm[data-go]').forEach(x=>x.addEventListener('dblclick',e=>{
    e.stopPropagation(); send('mode:panel'); setTimeout(()=>go(x.dataset.go),120);
  }));
  /* Same handlers as the window's buttons, not copies of them. */
  const g=$('#sbSwGo'); if(g) g.onclick=swToggle;
  const l=$('#sbSwLap'); if(l) l.onclick=swLapAdd;
  /* The docked note was removed; the guard stays because the TOPBAR layout may still render one. */
  const n=$('#sbSwNote');
  if(n) n.textContent=Object.keys(SW.track).filter(k=>SW.track[k]).map(k=>SW_METRICS[k].label).join(' · ')||'nothing ticked';
  swPaintUI();
  const cv=$('#cVerdict'); if(cv) cv.textContent=lastVerdict;
  paintCompact();
  pollDiagnosis();                 // refresh rather than wait out the interval
}

function paintCompact(){
  const t=S.tick; if(!t) return;
  $$('#compact .cm[data-k]').forEach(el=>{
    const m=CM6.find(x=>x.k===el.dataset.k); if(!m) return;
    const [v,u]=m.v(t);
    $('.v',el).textContent=v; $('.u',el).textContent=u;
    const c=$('canvas',el);
    if(c&&getComputedStyle(c).display!=='none'){
      const col=getComputedStyle(document.documentElement).getPropertyValue(m.c).trim();
      sparkline(c,S.hist[m.k]||[],col+'55');
    }
  });
  $$('#compact [data-f]').forEach(el=>{
    const fn=FIELD[el.dataset.f]; if(fn){ try{ el.textContent=fn(t); }catch{ el.textContent='—'; } }
  });
  // per-thread bars: vertical grid in the sidebar, a micro histogram in the topbar chip
  const cores=t.cpu.cores||[];
  const grid=$('#cCores');
  if(grid){
    if(grid.children.length!==cores.length)
      grid.innerHTML=cores.map(()=>'<i><u></u></i>').join('');
    cores.forEach((v,i)=>{const u=grid.children[i]&&grid.children[i].firstElementChild;
      if(u) u.style.height=clamp(v,0,100)+'%';});
  }
  const tc=$('#compact .tcores');
  if(tc){
    if(tc.children.length!==cores.length) tc.innerHTML=cores.map(()=>'<i></i>').join('');
    cores.forEach((v,i)=>{const b=tc.children[i]; if(b) b.style.height=Math.max(1,clamp(v,0,100)*0.14)+'px';});
  }
  const mk=(list,val)=>list.map(p=>`<div class="prow"><span>${p.n.slice(0,10)}</span><b>${val(p)}</b></div>`).join('');
  const tcpu=$('#cTopCpu'), tmem=$('#cTopMem');
  if(tcpu) tcpu.innerHTML=mk([...t.proc].sort((a,b)=>b.cpu-a.cpu).slice(0,6),p=>fmt(p.cpu,0)+'%');
  if(tmem) tmem.innerHTML=mk([...t.proc].sort((a,b)=>b.mb-a.mb).slice(0,6),p=>fmt(p.mb/1024,1)+'G');
  const COL={cpu:'--cpu',mem:'--mem',disk:'--disk'};
  $$('#compact .spark').forEach(el=>{
    const k=el.dataset.s;
    const col=getComputedStyle(document.documentElement).getPropertyValue(COL[k]).trim();
    sparkline($('canvas',el),S.hist[k]||[],col+'55',col+'cc');
  });
}
function setMode(m){
  const was=mode; mode=m;
  document.body.classList.remove('mode-panel','mode-sidebar-left','mode-sidebar-right','mode-topbar');
  document.body.classList.add('mode-'+m);
  document.body.classList.toggle('docked',m!=='panel');
  document.body.classList.toggle('sb',m.startsWith('sidebar'));
  $('#wctl').classList.remove('open'); document.body.classList.remove('wctl-open');
  // The two docked layouts have different DOM, not just different CSS, so rebuild on any change
  // that crosses between them.
  if(m!=='panel' && (was===m ? false : true)) buildCompact();
}
if(HOST){
  window.chrome.webview.addEventListener('message',ev=>{
    const d=String(ev.data||'');
    if(d.startsWith('mode:')) setMode(d.slice(5));
    // Auto-hide state from the host (minimise converts to the side widget, hidden at the edge).
    // Toast copy must fit the 138px docked strip — it shows there, not in the panel.
    if(d==='autohide:1') toast('Hidden, edge reveals');
    if(d==='autohide:0') toast('Back');
  });
}

/* The verdict is the headline, so it belongs on the overview — not buried behind a tab. Polled
   rather than pushed: the rules read minutes of history, so re-running at 1 Hz would be waste. */
/* SOLO WINDOW (?view=ask): the popped-out chat. It still needs the telemetry stream, because the
   grounding context and the header's machine name come from it, but it renders no sidebar, no page
   chrome and no other pages - and it does not run the diagnosis poll, the tile builders or the ring
   painters, none of which have a visible surface here and all of which cost CPU on a machine this
   tool exists to keep honest about its own footprint. */
if(SOLO==='ask'){
  document.body.classList.add('solo','solo-ask');
  connect();
  go('ask');
}else{
  buildTiles(); buildCompact(); connect(); seedHist(); pollDiagnosis(); setInterval(pollDiagnosis,10000);
}
/* ?v=therm etc: initial view for HARNESS twins (headless captures) — unlike /api/panel/view this
   touches only the tab that loaded it, never the owner's panel. Theme via ?theme= for the same
   reason (does not persist: harness twins must not overwrite the owner's saved choice). */
try{
  const qp=new URLSearchParams(location.search);
  if(qp.get('theme')&&['dark','light','pro','beast'].includes(qp.get('theme')))
    document.documentElement.dataset.theme=qp.get('theme')==='dark'?'':qp.get('theme');
  if(qp.get('v')&&document.querySelector('#p-'+qp.get('v'))) setTimeout(()=>go(qp.get('v')),400);
  /* harness-only auto-open, WHITELISTED to the battery curve: powercfg is local and free.
     The bandwidth-spending buttons (latency/speed) are deliberately NOT reachable this way —
     a GET must never be able to spend the user's data plan. */
  if(qp.get('open')==='battcurve') setTimeout(()=>{const b=document.querySelector('#bRep'); if(b) b.click();},2500);
}catch{}
wireWindow(); $('#wTop').style.color='var(--cpu)';
// Esc undocks as well as returning to the overview; Ctrl+arrows dock without dragging.
addEventListener('keydown',e=>{
  /* Escape inside a text field means "I am done with this field", not "undock the window". */
  if(e.key==='Escape'&&mode!=='panel'&&!isTyping(e)){ send('mode:panel'); return; }
  if(!e.ctrlKey) return;
  const m={ArrowLeft:'sidebar-left',ArrowRight:'sidebar-right',ArrowUp:'topbar',ArrowDown:'panel'}[e.key];
  if(m){ e.preventDefault(); send('mode:'+m); }
});
</script>
